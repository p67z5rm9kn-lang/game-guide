<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>planner-sequence-test-v1</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:20px;line-height:1.6;background:#111;color:#eee}
  button{font-size:18px;padding:12px 18px;border-radius:10px;border:0;margin:8px 0}
  #summary{font-size:20px;font-weight:700;margin:12px 0}
  #results{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#1d1d1d;padding:14px;border-radius:10px}
</style>
</head>
<body>
<h2>planner-sequence-test-v1</h2>
<button onclick="runAllTests()">▶ 全部執行</button>
<div id="summary">尚未執行</div>
<div id="results"></div>

<script>
function assertEqual(name, actual, expected) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  return a === e ? `✅ ${name}` : `❌ ${name}\n   實際：${a}\n   預期：${e}`;
}
function clone(x){return JSON.parse(JSON.stringify(x));}

function complete(state,count=1,tasks=null){
  const s=clone(state);
  for(let i=0;i<count;i++){
    if(s.unfinished<=0)break;
    s.unfinished--; s.completed++;
    if(tasks){
      for(const key of ["warrior","dawn"]){
        if(tasks[key]?.active){
          tasks[key].current=Math.min(tasks[key].target,tasks[key].current+1);
        }
      }
    }
  }
  return s;
}

function harvest(state,count=1,fiveStar=false){
  const s=clone(state); s.treasure ??= 0;
  for(let i=0;i<count;i++){
    if(s.completed<=0)break;
    s.completed--; s.field--;
    if(fiveStar)s.treasure=Math.min(10,s.treasure+1);
    if(s.field<8 && s.inventory>0){
      const move=Math.min(8-s.field,s.inventory);
      s.field+=move; s.inventory-=move;
    }
  }
  return s;
}

function systemFree(state,amount=8){
  const s=clone(state);
  const fieldNeed=Math.max(0,8-s.field);
  const toField=Math.min(amount,fieldNeed);
  s.field+=toField;
  const toInventory=amount-toField;
  if(toInventory>0){
    const room=Math.max(0,s.maxInventory-s.inventory);
    s.inventory+=Math.min(toInventory,room);
  }
  return s;
}

function useLaura(state,star){
  const s=clone(state);
  if(s.lauraUsed)return s;
  const amount=[5,10,10,10,20,20][star];
  if(s.field<8){
    const toField=Math.min(amount,8-s.field);
    s.field+=toField; s.inventory+=amount-toField;
  }else{
    s.field+=3; s.inventory+=amount-3;
  }
  s.lauraUsed=true;
  return s;
}

function rollover(state){
  const s=clone(state);
  s.lauraUsed=false;
  s.treasure=0;
  return systemFree(s,8);
}

function scoreCompletion(state,tasks,count=1){
  const s=complete(state,count,tasks);
  return {state:s,tasks:clone(tasks)};
}

function idealPrep(maxInventory){
  return {field:11,inventory:maxInventory-8};
}

const tests=[];

tests.push(()=>{let s={field:11,unfinished:3,completed:8,inventory:10};s=complete(s,3);s=harvest(s,3);return assertEqual("1. 完成3→收割3的完整序列",s,{field:8,unfinished:0,completed:8,inventory:10});});

tests.push(()=>{let s={field:11,unfinished:0,completed:11,inventory:0};s=harvest(s,3);return assertEqual("2. 場上11收割3、庫存0",s,{field:8,unfinished:0,completed:8,inventory:0,treasure:0});});

tests.push(()=>{let s={field:11,unfinished:0,completed:11,inventory:5};s=harvest(s,3);return assertEqual("3. 場上11收割3、庫存5自動補充",s,{field:8,unfinished:0,completed:8,inventory:5,treasure:0});});

tests.push(()=>{let s={field:7,unfinished:2,completed:5,inventory:4};s=complete(s,1);return assertEqual("4. 完成事件不觸發自動補充",s,{field:7,unfinished:1,completed:6,inventory:4});});

tests.push(()=>{let s={field:7,unfinished:0,completed:7,inventory:4};s=harvest(s,1);return assertEqual("5. 收割後才觸發自動補充",s,{field:8,unfinished:0,completed:6,inventory:3,treasure:0});});

tests.push(()=>{let s={field:11,unfinished:0,completed:11,inventory:0,treasure:9};s=harvest(s,3,true);return assertEqual("6. 5星Laura寶箱9/10收割3→10/10",s,{field:8,unfinished:0,completed:8,inventory:0,treasure:10});});

tests.push(()=>{let s={field:8,unfinished:0,completed:8,inventory:0,treasure:0,lauraUsed:false};s=harvest(s,2,true);s=useLaura(s,5);return assertEqual("7. 寶箱進度不阻止當日Laura使用",s,{field:11,unfinished:0,completed:6,inventory:17,treasure:2,lauraUsed:true});});

tests.push(()=>{let s={field:8,unfinished:0,completed:8,inventory:0,lauraUsed:false};s=useLaura(s,4);const afterFirst=clone(s);s=useLaura(s,4);return assertEqual("8. Laura同日第二次使用無效",s,afterFirst);});

tests.push(()=>{let s={field:8,unfinished:0,completed:8,inventory:0,lauraUsed:true,treasure:7,maxInventory:30};s=rollover(s);s=useLaura(s,0);return assertEqual("9. 10:00後Laura重置可使用",s,{field:11,unfinished:0,completed:8,inventory:10,lauraUsed:true,treasure:0,maxInventory:30});});

tests.push(()=>{const s={field:6,unfinished:2,completed:4,inventory:10,maxInventory:30};return assertEqual("10. 系統+8先補場上",systemFree(s),{field:8,unfinished:2,completed:4,inventory:8,maxInventory:30});});

tests.push(()=>{const s={field:11,unfinished:3,completed:8,inventory:27,maxInventory:30};return assertEqual("11. 系統+8進庫存且受MAX限制",systemFree(s),{field:11,unfinished:3,completed:8,inventory:30,maxInventory:30});});

tests.push(()=>{const s={field:8,unfinished:0,completed:8,inventory:29,maxInventory:30,lauraUsed:false};return assertEqual("12. Laura可突破MAX",useLaura(s,4),{field:11,unfinished:0,completed:8,inventory:46,maxInventory:30,lauraUsed:true});});

tests.push(()=>{const s={field:11,unfinished:2,completed:9,inventory:0};const tasks={warrior:{active:true,target:20,current:17},dawn:{active:true,target:10,current:9}};const r=scoreCompletion(s,tasks,1);return assertEqual("13. 一次完成同時推進兩個每日任務",r.tasks,{warrior:{active:true,target:20,current:18},dawn:{active:true,target:10,current:10}});});

tests.push(()=>{const s={field:11,unfinished:3,completed:8,inventory:0};const tasks={warrior:{active:true,target:20,current:20},dawn:{active:true,target:10,current:9}};const r=scoreCompletion(s,tasks,2);return assertEqual("14. 每日任務各自封頂不互相影響",r.tasks,{warrior:{active:true,target:20,current:20},dawn:{active:true,target:10,current:10}});});

tests.push(()=>assertEqual("15. MAX30理想準備狀態",idealPrep(30),{field:11,inventory:22}));

tests.push(()=>assertEqual("16. MAX20理想準備狀態",idealPrep(20),{field:11,inventory:12}));

tests.push(()=>{const s={field:11,unfinished:0,completed:11,inventory:22,maxInventory:30};return assertEqual("17. MAX30理想狀態→10:00庫存MAX",systemFree(s),{field:11,unfinished:0,completed:11,inventory:30,maxInventory:30});});

tests.push(()=>assertEqual("18. 跨日前預計可收割",11+10,21));

tests.push(()=>{let s={field:11,unfinished:0,completed:11,inventory:10,maxInventory:30};s=systemFree(s,8);s=systemFree(s,8);s=systemFree(s,8);return assertEqual("19. 衝分日三次系統+8共24",s.inventory,30);});

tests.push(()=>assertEqual("20. 預計收割基準不加入盟友瞬間幫助",11+10+24+20,65));

function runAllTests(){
  const results=tests.map(fn=>{try{return fn();}catch(e){return `❌ 測試執行錯誤：${e.message}`;}});
  const passed=results.filter(x=>x.startsWith("✅")).length;
  const failed=results.length-passed;
  document.getElementById("summary").textContent=`通過：${passed}/${results.length}　失敗：${failed}`;
  document.getElementById("results").textContent=results.join("\n\n");
}
</script>
</body>
</html>
