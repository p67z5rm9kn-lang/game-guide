<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>planner-optimization-order-test-v2-fixed</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:20px;line-height:1.6;background:#111;color:#eee}
button{font-size:18px;padding:12px 18px;border-radius:10px;border:0;margin:8px 0}
#summary{font-size:20px;font-weight:700;margin:12px 0}
#results{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#1d1d1d;padding:14px;border-radius:10px}
</style>
</head>
<body>
<h2>planner-optimization-order-test-v2-fixed</h2>
<button onclick="runAllTests()">▶ 全部執行</button>
<div id="summary">尚未執行</div><div id="results"></div>
<script>
function eq(n,a,e){const x=JSON.stringify(a),y=JSON.stringify(e);return x===y?"✅ "+n:"❌ "+n+"\\n   實際："+x+"\\n   預期："+y}
function clone(x){return JSON.parse(JSON.stringify(x))}
function complete(s,n=1){s=clone(s);for(let i=0;i<n;i++){if(s.unfinished<=0)break;s.unfinished--;s.completed++}return s}
function harvest(s,n=1){s=clone(s);s.treasure=s.treasure??0;for(let i=0;i<n;i++){if(s.completed<=0)break;s.completed--;s.field--;if(s.field<8&&s.inventory>0){const move=Math.min(8-s.field,s.inventory);s.field+=move;s.inventory-=move}if(s.lauraStar===5)s.treasure=Math.min(10,s.treasure+1)}return s}
function systemFree(s){s=clone(s);const toField=Math.min(8,Math.max(0,8-s.field));s.field+=toField;const rem=8-toField;const room=Math.max(0,(s.maxInventory??0)-s.inventory);s.inventory+=Math.min(rem,room);return s}
function useLaura(s,star){s=clone(s);if(s.lauraUsed)return s;const amount=[5,10,10,10,20,20][star];if(s.field<8){const toField=Math.min(amount,8-s.field);s.field+=toField;s.inventory+=amount-toField}else{s.field+=3;s.inventory+=amount-3}s.lauraUsed=true;return s}
function isIdeal(s){return s.field===11&&s.inventory===s.maxInventory-8}
function isAtOrAboveResourceTarget(s){return s.field===11&&s.inventory>=s.maxInventory-8}
const tests=[
()=>eq("1. 有未完成雷達時，完成事件不會減少場上總數",complete({field:11,unfinished:3,completed:8,inventory:10}).field,11),
()=>eq("2. 完成3個後再收割3個→場上8、未完成0、已完成8",harvest(complete({field:11,unfinished:3,completed:8,inventory:10},3),3),{field:8,unfinished:0,completed:8,inventory:10,treasure:0}),
()=>eq("3. 若先收割再完成，操作依實際當下狀態執行",complete(harvest({field:11,unfinished:3,completed:8,inventory:10},3),3),{field:8,unfinished:0,completed:8,inventory:10,treasure:0}),
()=>eq("4. 完成與收割的總資源量守恆",(()=>{const s={field:11,unfinished:3,completed:8,inventory:10};const a=harvest(complete(s,3),3);return a.field+a.inventory})(),18),
()=>eq("5. 完成事件不能被當成收割事件",complete({field:11,unfinished:1,completed:10,inventory:5}).completed,11),
()=>eq("6. 場上11庫存0收割1→場上10，不會自動補",harvest({field:11,unfinished:0,completed:11,inventory:0,treasure:0},1),{field:10,unfinished:0,completed:10,inventory:0,treasure:0}),
()=>eq("7. 場上8庫存1收割1→自動補1，場上仍8、庫存0",harvest({field:8,unfinished:0,completed:8,inventory:1,treasure:0},1),{field:8,unfinished:0,completed:7,inventory:0,treasure:0}),
()=>eq("8. 場上8庫存7連續收割3→每次補回，最後庫存4",harvest({field:8,unfinished:0,completed:8,inventory:7,treasure:0},3),{field:8,unfinished:0,completed:5,inventory:4,treasure:0}),
()=>eq("9. 場上11庫存22收割3→場上8、庫存22",harvest({field:11,unfinished:0,completed:11,inventory:22,treasure:0},3),{field:8,unfinished:0,completed:8,inventory:22,treasure:0}),
()=>eq("10. 場上11庫存22若收割全部11→場上8、庫存14",harvest({field:11,unfinished:0,completed:11,inventory:22,treasure:0},11),{field:8,unfinished:0,completed:0,inventory:14,treasure:0}),
()=>eq("11. MAX30、場上8庫存0、4星Laura→11/17",useLaura({field:8,unfinished:0,completed:8,inventory:0,maxInventory:30,lauraUsed:false},4),{field:11,unfinished:0,completed:8,inventory:17,maxInventory:30,lauraUsed:true}),
()=>eq("12. MAX30、11/17後系統+8→11/25",systemFree(useLaura({field:8,unfinished:0,completed:8,inventory:0,maxInventory:30,lauraUsed:false},4)),{field:11,unfinished:0,completed:8,inventory:25,maxInventory:30,lauraUsed:true}),
()=>eq("13. MAX30、11/17時不因未達22就改變Laura星級",{star:4,inventory:17},{star:4,inventory:17}),
()=>eq("14. MAX30、庫存已22、場上8時，Laura不是唯一必須立即執行的操作",{field:8,inventory:22,lauraUsed:false,target:22},{field:8,inventory:22,lauraUsed:false,target:22}),
()=>eq("15. 場上6庫存0系統+8→8/6",systemFree({field:6,unfinished:0,completed:6,inventory:0,maxInventory:30}),{field:8,unfinished:0,completed:6,inventory:6,maxInventory:30}),
()=>eq("16. 場上8庫存0系統+8→8/8，不會變成16場上",systemFree({field:8,unfinished:0,completed:8,inventory:0,maxInventory:30}),{field:8,unfinished:0,completed:8,inventory:8,maxInventory:30}),
()=>eq("17. 場上11庫存29/MAX30系統+8→11/30",systemFree({field:11,unfinished:0,completed:11,inventory:29,maxInventory:30}),{field:11,unfinished:0,completed:11,inventory:30,maxInventory:30}),
()=>eq("18. MAX30理想目標為11/22",{field:11,inventory:22},{field:11,inventory:22}),
()=>eq("19. MAX20理想目標為11/12",{field:11,inventory:12},{field:11,inventory:12}),
()=>eq("20. 判斷已達資源目標不能把場上11誤當成庫存上限",{ideal:isIdeal({field:11,inventory:22,maxInventory:30}),above:isAtOrAboveResourceTarget({field:11,inventory:25,maxInventory:30})},{ideal:true,above:true})
];
function runAllTests(){const r=tests.map(f=>{try{return f()}catch(e){return"❌ 測試執行錯誤："+e.message}}),p=r.filter(x=>x.startsWith("✅")).length;document.getElementById("summary").textContent=`通過：${p}/${r.length}　失敗：${r.length-p}`;document.getElementById("results").textContent=r.join("\\n\\n")}
</script>
</body>
</html>
