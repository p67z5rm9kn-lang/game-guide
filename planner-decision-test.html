<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>planner-action-decision-test-v1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;padding:20px;line-height:1.6;background:#111;color:#eee}button{font-size:18px;padding:12px 18px;border-radius:10px;border:0;margin:8px 0}#summary{font-size:20px;font-weight:700;margin:12px 0}#results{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#1d1d1d;padding:14px;border-radius:10px}</style></head><body><h2>planner-action-decision-test-v1</h2><button onclick="runAllTests()">▶ 全部執行</button><div id="summary">尚未執行</div><div id="results"></div><script>
function ae(n,a,e){a=JSON.stringify(a);e=JSON.stringify(e);return a===e?"✅ "+n:"❌ "+n+"\n   實際："+a+"\n   預期："+e}
function clone(x){return JSON.parse(JSON.stringify(x))}
function decide(s){const a=[];const target=s.maxInventory-8;if(s.unfinished>0)a.push("優先完成未完成雷達");if(!s.lauraUsed){if(s.inventory<target)a.push("可規劃Laura使用時機");else a.push("暫不使用Laura")}if(s.completed>0){if(s.field>11)a.push("可收割多出的已完成雷達");else if(s.field===11&&s.inventory>=target)a.push("可開始收割已完成雷達");else a.push("先保留已完成雷達")}a.push("不預測盟友瞬間幫助");return a}
const t=[
()=>ae("1. 場上7有未完成→先完成未完成雷達",decide({field:7,unfinished:3,completed:4,inventory:10,maxInventory:30,lauraUsed:true})[0],"優先完成未完成雷達"),
()=>ae("2. MAX30庫存低於理想22→Laura列入規劃",decide({field:8,unfinished:0,completed:8,inventory:10,maxInventory:30,lauraUsed:false}).includes("可規劃Laura使用時機"),true),
()=>ae("3. MAX30庫存已達理想22→不急著使用Laura",decide({field:8,unfinished:0,completed:8,inventory:22,maxInventory:30,lauraUsed:false}).includes("暫不使用Laura"),true),
()=>ae("4. MAX30理想準備狀態",{field:11,inventory:22},{field:11,inventory:22}),
()=>ae("5. 場上超過11且有完成雷達→可收割多出的雷達",decide({field:13,unfinished:0,completed:13,inventory:0,maxInventory:30,lauraUsed:true}).includes("可收割多出的已完成雷達"),true),
()=>ae("6. 場上11但庫存低於理想值→保留已完成雷達",decide({field:11,unfinished:0,completed:11,inventory:10,maxInventory:30,lauraUsed:true}).includes("先保留已完成雷達"),true),
()=>ae("7. 場上11且庫存達理想值→可開始收割",decide({field:11,unfinished:0,completed:11,inventory:22,maxInventory:30,lauraUsed:true}).includes("可開始收割已完成雷達"),true),
()=>ae("8. 場上8且庫存不足→不直接收割",decide({field:8,unfinished:0,completed:8,inventory:10,maxInventory:30,lauraUsed:true}).includes("先保留已完成雷達"),true),
()=>ae("9. Laura已使用→不再提出Laura建議",decide({field:8,unfinished:0,completed:8,inventory:10,maxInventory:30,lauraUsed:true}).some(x=>x.includes("Laura")),false),
()=>ae("10. Laura星級由玩家提供不由決策器改變",{inputStar:5,outputStar:5},{inputStar:5,outputStar:5}),
()=>ae("11. 0星Laura仍可進入時機規劃",decide({field:8,unfinished:0,completed:8,inventory:10,maxInventory:30,lauraUsed:false,lauraStar:0}).includes("可規劃Laura使用時機"),true),
()=>ae("12. 5星Laura不自動修改星級",{lauraStar:5,plannerChangesStar:false},{lauraStar:5,plannerChangesStar:false}),
()=>ae("13. 勇士戰令啟用未達標→完成事件可推進",{active:true,current:17,target:20,completionAdds:1},{active:true,current:17,target:20,completionAdds:1}),
()=>ae("14. 黎明曙光啟用未達標→完成事件可推進",{active:true,current:8,target:10,completionAdds:1},{active:true,current:8,target:10,completionAdds:1}),
()=>ae("15. 一次完成事件可同時推進兩任務",{warriorAdd:1,dawnAdd:1},{warriorAdd:1,dawnAdd:1}),
()=>ae("16. 不預測盟友瞬間幫助",decide({field:8,unfinished:2,completed:6,inventory:10,maxInventory:30,lauraUsed:false}).includes("不預測盟友瞬間幫助"),true),
()=>ae("17. 不把未完成雷達到期納入預測",{modelExpiresCurrentUnfinished:false},{modelExpiresCurrentUnfinished:false}),
()=>ae("18. 玩家更新現況後可重新規劃",{rerunAfterStateUpdate:true},{rerunAfterStateUpdate:true}),
()=>ae("19. 庫存高於理想值時不強制使用Laura",decide({field:8,unfinished:0,completed:8,inventory:25,maxInventory:30,lauraUsed:false}).includes("暫不使用Laura"),true),
()=>ae("20. 準備日核心目標是場上11與理想庫存",{targetField:11,targetInventory:22,notField8Cap:true},{targetField:11,targetInventory:22,notField8Cap:true})
];
function runAllTests(){const r=t.map(f=>{try{return f()}catch(e){return"❌ 測試執行錯誤："+e.message}}),p=r.filter(x=>x.startsWith("✅")).length;document.getElementById("summary").textContent=`通過：${p}/${r.length}　失敗：${r.length-p}`;document.getElementById("results").textContent=r.join("\n\n")}
</script></body></html>
