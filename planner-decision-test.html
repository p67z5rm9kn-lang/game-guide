<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>planner-decision-test-v2-fixed2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;padding:20px;line-height:1.6;background:#111;color:#eee}
button{font-size:18px;padding:12px 18px;border-radius:10px;border:0;margin:8px 0}
#summary{font-size:20px;font-weight:700;margin:12px 0}
#results{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#1d1d1d;padding:14px;border-radius:10px}
</style>
</head>
<body>
<h2>planner-decision-test-v2-fixed2</h2>
<button onclick="runAllTests()">▶ 全部執行</button>
<div id="summary">尚未執行</div><div id="results"></div>

<script>
function ae(n,a,e){
  a=JSON.stringify(a);e=JSON.stringify(e);
  return a===e?"✅ "+n:"❌ "+n+"\n   實際："+a+"\n   預期："+e;
}

/* 絕對時間 → 末日時間 UTC-2 */
function ap(iso){
  const x={};
  for(const p of new Intl.DateTimeFormat("en-CA",{
    timeZone:"Etc/GMT+2",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
  }).formatToParts(new Date(iso))){
    if(p.type!=="literal")x[p.type]=p.value;
  }
  return {y:+x.year,m:+x.month,d:+x.day,h:+x.hour,min:+x.minute,s:+x.second};
}

/* 重要：星期必須取「末日時間」的日期，而不是 UTC 日期。
   衝分點：末日星期一/五 00:00（台灣10:00）開始。
   因此：
   - 星期一/五 00:00以前 → prepare-same-day
   - 星期一/五 00:00起 → scoring
   - 星期二～四 → prepare-friday
   - 星期六～日 → prepare-monday
*/
function apocalypseWeekday(iso){
  const p=ap(iso);
  return new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay();
}

function mode(iso){
  const p=ap(iso);
  const w=apocalypseWeekday(iso);
  const iw=w===0?7:w;
  if((iw===1||iw===5) && p.h>=0) return "scoring";
  if(iw===1||iw===5) return "prepare-same-day";
  if(iw>=2&&iw<=4) return "prepare-friday";
  return "prepare-monday";
}

function est(f,i,s,l){return f+i+s+l}

const t=[
()=>ae("1. 末日星期一10:00→衝分日",mode("2026-09-28T12:00:00Z"),"scoring"),
()=>ae("2. 末日星期五10:00→衝分日",mode("2026-10-02T12:00:00Z"),"scoring"),
()=>ae("3. 星期二→準備星期五",mode("2026-09-29T12:00:00Z"),"prepare-friday"),
()=>ae("4. 星期三→準備星期五",mode("2026-09-30T12:00:00Z"),"prepare-friday"),
()=>ae("5. 星期四→準備星期五",mode("2026-10-01T12:00:00Z"),"prepare-friday"),
()=>ae("6. 星期六→準備星期一",mode("2026-10-03T12:00:00Z"),"prepare-monday"),
()=>ae("7. 星期日→準備星期一",mode("2026-10-04T12:00:00Z"),"prepare-monday"),
()=>ae("8. 星期一衝分日不改選下一個星期五",mode("2026-09-28T12:00:00Z"),"scoring"),
()=>ae("9. 台灣10:00=末日00:00",ap("2026-09-26T10:00:00+08:00").h,0),
()=>ae("10. 台灣18:00=末日08:00",ap("2026-09-26T18:00:00+08:00").h,8),
()=>ae("11. 台灣02:00=末日16:00",ap("2026-09-26T02:00:00+08:00").h,16),
()=>ae("12. 時區切換不改變絕對瞬間",
  new Date("2026-09-26T10:00:00+08:00").getTime()===new Date("2026-09-26T02:00:00Z").getTime(),true),
()=>ae("13. MAX30→理想庫存22、場上11",{field:11,inventory:22},{field:11,inventory:22}),
()=>ae("14. MAX20→理想庫存12、場上11",{field:11,inventory:12},{field:11,inventory:12}),
()=>ae("15. 跨日前11+10=21",est(11,10,0,0),21),
()=>ae("16. 衝分日系統三次+8=24",8+8+8,24),
()=>ae("17. 跨日前21+系統24+5星Laura20=65",est(11,10,24,20),65),
()=>ae("18. Laura 0星→增加5",est(11,10,24,5),50),
()=>ae("19. 每日任務達標後封頂",Math.min(20,20+3),20),
()=>ae("20. 準備日與衝分日模式不同",
  {prep:mode("2026-09-30T12:00:00Z"),score:mode("2026-10-02T12:00:00Z")},
  {prep:"prepare-friday",score:"scoring"})
];

function runAllTests(){
  const r=t.map(f=>{try{return f()}catch(e){return"❌ 測試執行錯誤："+e.message}});
  const p=r.filter(x=>x.startsWith("✅")).length;
  document.getElementById("summary").textContent=`通過：${p}/${r.length}　失敗：${r.length-p}`;
  document.getElementById("results").textContent=r.join("\n\n");
}
</script>
</body>
</html>
