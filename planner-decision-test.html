<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>規劃器決策測試 v1 修正版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#eee;padding:16px;line-height:1.5}
button{font-size:18px;padding:12px 18px;border:0;border-radius:10px;margin:8px 0;font-weight:700}
#summary{font-size:20px;margin:12px 0}.test{padding:10px 0;border-bottom:1px solid #333}
.pass{color:#7ee787}.fail{color:#ff7b72}pre{background:#1b1b1b;padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>規劃器決策測試 v1（修正版）</h1>
<p>修正：週一／週五 10:00 前應鎖定「當天 10:00」；時間比較統一使用台灣 UTC+8 的絕對時間。</p>
<button onclick="runAll()">全部執行</button>
<div id="summary">尚未執行</div>
<div id="results"></div>

<script>
const TW="Asia/Taipei";

function parse(s){ return new Date(s); }

function twParts(t){
  const p=new Intl.DateTimeFormat("en-CA",{
    timeZone:TW,year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).formatToParts(t);
  const o={};
  p.forEach(x=>{if(x.type!=="literal")o[x.type]=x.value});
  return o;
}

function twDateString(t){
  const p=twParts(t);
  return `${p.year}-${p.month}-${p.day}`;
}

function twHour(t){
  return Number(twParts(t).hour);
}

function twWeekday(t){
  // 取得台灣當地日期的星期：將該日 00:00(+08) 移回 UTC 後，再加 8 小時取 UTC weekday
  const ds=twDateString(t);
  const midnight=Date.parse(ds+"T00:00:00+08:00");
  const shifted=new Date(midnight+8*3600000);
  return shifted.getUTCDay(); // 0 Sun ... 6 Sat
}

function addDaysToDateString(ds,n){
  const base=Date.parse(ds+"T00:00:00+08:00");
  const x=new Date(base+n*86400000+8*3600000);
  const y=x.getUTCFullYear();
  const m=String(x.getUTCMonth()+1).padStart(2,"0");
  const d=String(x.getUTCDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function targetAt(ds){
  return new Date(ds+"T10:00:00+08:00");
}

function nextScoring(t){
  const ds=twDateString(t);
  const w=twWeekday(t);
  const h=twHour(t);

  // 週一／週五：
  // 10:00 前 = 今天 10:00 尚未到，屬於衝分前準備
  // 10:00 起 = 今天就是衝分日
  if((w===1||w===5)){
    if(h>=10){
      return {date:targetAt(ds),scoring:true};
    }
    return {date:targetAt(ds),scoring:false};
  }

  // 其他日期：找下一個週一或週五 10:00
  let add;
  if(w===0) add=1;      // Sun -> Mon
  else if(w===2) add=3; // Tue -> Fri
  else if(w===3) add=2; // Wed -> Fri
  else if(w===4) add=1; // Thu -> Fri
  else if(w===6) add=2; // Sat -> Mon
  else add=0;

  const targetDate=addDaysToDateString(ds,add);
  return {date:targetAt(targetDate),scoring:false};
}

function decide(i){
  const n=nextScoring(i.time);
  const ideal={inventory:Math.max(0,i.max-8),field:11};

  if(n.scoring){
    return {
      mode:"SCORING",
      target:n.date,
      strategy:"CLEAR_AND_HARVEST",
      lauraRequired:false,
      ideal
    };
  }

  return {
    mode:"PREPARE",
    target:n.date,
    strategy:"PREPARE_TARGET",
    lauraRequired:!i.lauraUsedToday,
    ideal
  };
}

function sameTime(a,b){
  return a.getTime()===b.getTime();
}

const tests=[
["1 週六準備週一","2026-09-26T16:00:00+08:00",30,false,"PREPARE","2026-09-28T10:00:00+08:00","PREPARE_TARGET"],
["2 週日準備週一","2026-09-27T09:00:00+08:00",30,true,"PREPARE","2026-09-28T10:00:00+08:00","PREPARE_TARGET"],
["3 週一09:00仍是當天衝分前準備","2026-09-28T09:00:00+08:00",30,false,"PREPARE","2026-09-28T10:00:00+08:00","PREPARE_TARGET"],
["4 週一10:00進入衝分","2026-09-28T10:00:00+08:00",30,false,"SCORING","2026-09-28T10:00:00+08:00","CLEAR_AND_HARVEST"],
["5 週一15:00仍是衝分","2026-09-28T15:00:00+08:00",30,true,"SCORING","2026-09-28T10:00:00+08:00","CLEAR_AND_HARVEST"],
["6 週一23:00仍是衝分","2026-09-28T23:00:00+08:00",30,false,"SCORING","2026-09-28T10:00:00+08:00","CLEAR_AND_HARVEST"],
["7 週二準備週五","2026-09-29T12:00:00+08:00",25,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["8 週三準備週五","2026-09-30T20:00:00+08:00",40,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["9 週四準備週五","2026-10-01T08:00:00+08:00",30,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["10 週五09:59仍是當天衝分前準備","2026-10-02T09:59:00+08:00",30,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["11 週五10:00進入衝分","2026-10-02T10:00:00+08:00",30,false,"SCORING","2026-10-02T10:00:00+08:00","CLEAR_AND_HARVEST"],
["12 週五21:00仍是衝分","2026-10-02T21:00:00+08:00",20,true,"SCORING","2026-10-02T10:00:00+08:00","CLEAR_AND_HARVEST"],
["13 週六準備下一個週一","2026-10-03T10:01:00+08:00",50,false,"PREPARE","2026-10-05T10:00:00+08:00","PREPARE_TARGET"],
["14 MAX=1理想庫存=0","2026-09-29T12:00:00+08:00",1,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["15 Laura未使用→可規劃","2026-09-29T12:00:00+08:00",30,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["16 Laura已使用→不再要求","2026-09-29T12:00:00+08:00",30,true,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["17 MAX=30理想22/11","2026-09-30T12:00:00+08:00",30,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["18 MAX=40理想32/11","2026-09-30T12:00:00+08:00",40,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"],
["19 週日跨週找週一","2026-10-04T23:00:00+08:00",30,false,"PREPARE","2026-10-05T10:00:00+08:00","PREPARE_TARGET"],
["20 過去設定時間仍依設定時間規劃","2026-09-29T12:00:00+08:00",30,false,"PREPARE","2026-10-02T10:00:00+08:00","PREPARE_TARGET"]
];

function runAll(){
  let pass=0,out="";
  tests.forEach((t,i)=>{
    const [name,time,max,used,mode,target,strategy]=t;
    const r=decide({time:parse(time),max,lauraUsedToday:used});

    let ok=r.mode===mode &&
           sameTime(r.target,parse(target)) &&
           r.strategy===strategy;

    if(i===13) ok=ok && r.ideal.inventory===0;
    if(i===16) ok=ok && r.ideal.inventory===22;
    if(i===17) ok=ok && r.ideal.inventory===32;
    if(i===14) ok=ok && r.lauraRequired===true;
    if(i===15) ok=ok && r.lauraRequired===false;

    if(ok)pass++;

    out+=`<div class="test ${ok?"pass":"fail"}">${ok?"✅":"❌"} ${name}${
      ok?"":"<pre>"+JSON.stringify({
        expected:{mode,target,strategy},
        actual:{
          mode:r.mode,
          target:r.target.toISOString(),
          strategy:r.strategy,
          ideal:r.ideal,
          lauraRequired:r.lauraRequired
        },
        index:i+1
      },null,2)+"</pre>"
    }</div>`;
  });

  document.getElementById("summary").innerHTML=`<b>${pass}/${tests.length} 通過</b>`;
  document.getElementById("results").innerHTML=out;
}
</script>
</body>
</html>
