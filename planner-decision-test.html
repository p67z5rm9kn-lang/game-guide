<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>規劃器資源計算測試 v1</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#eee;padding:16px;line-height:1.5}
button{font-size:18px;padding:12px 18px;border:0;border-radius:10px;margin:8px 0;font-weight:700}
#summary{font-size:20px;margin:12px 0}.test{padding:10px 0;border-bottom:1px solid #333}
.pass{color:#7ee787}.fail{color:#ff7b72}pre{background:#1b1b1b;padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>規劃器資源計算測試 v1</h1>
<p>這一批確認「準備／衝分時到底有多少可用雷達資源」，下一批再進入實際操作順序最佳化。</p>
<button onclick="runAll()">全部執行</button>
<div id="summary">尚未執行</div>
<div id="results"></div>

<script>
/*
  本批測試重點：
  1. 理想準備狀態 = 庫存 MAX-8、場上 11
  2. 衝分日估算來源：
     跨日前場上 + 跨日前庫存 + 當天系統 +24 + Laura
  3. 系統免費雷達只計入衝分日 10:00、18:00、隔日02:00，共24
  4. 不計入下一個10:00
  5. 不把盟友瞬間幫助當成額外雷達來源
  6. Laura依目前星級提供固定數量
  7. Laura寶箱與Laura雷達數量彼此獨立
*/

function idealState(max){
  return {inventory:Math.max(0,max-8),field:11};
}

function lauraAmount(star){
  return {0:5,1:10,2:10,3:10,4:20,5:20}[star] ?? 0;
}

function estimateScoringHarvest(input){
  return {
    before: input.field + input.inventory,
    system: 24,
    laura: lauraAmount(input.lauraStar),
    total: input.field + input.inventory + 24 + lauraAmount(input.lauraStar)
  };
}

function systemEventsOnScoringDay(){
  return [
    "10:00 +8",
    "18:00 +8",
    "02:00 +8"
  ];
}

function normalizedTaskProgress(current,target){
  if(current<0 || target<0) return null;
  return Math.min(current,target);
}

const tests = [
  {
    name:"1. MAX=30理想狀態",
    fn:()=>JSON.stringify(idealState(30))===JSON.stringify({inventory:22,field:11})
  },
  {
    name:"2. MAX=40理想狀態",
    fn:()=>JSON.stringify(idealState(40))===JSON.stringify({inventory:32,field:11})
  },
  {
    name:"3. MAX=8理想庫存=0",
    fn:()=>JSON.stringify(idealState(8))===JSON.stringify({inventory:0,field:11})
  },
  {
    name:"4. MAX=1時理想庫存不低於0",
    fn:()=>JSON.stringify(idealState(1))===JSON.stringify({inventory:0,field:11})
  },
  {
    name:"5. 衝分日估算：場上11+庫存10+系統24+Laura20=65",
    fn:()=>estimateScoringHarvest({field:11,inventory:10,lauraStar:4}).total===65
  },
  {
    name:"6. 衝分日估算：場上8+庫存0+系統24+Laura5=37",
    fn:()=>estimateScoringHarvest({field:8,inventory:0,lauraStar:0}).total===37
  },
  {
    name:"7. Laura 0星提供5",
    fn:()=>lauraAmount(0)===5
  },
  {
    name:"8. Laura 1星提供10",
    fn:()=>lauraAmount(1)===10
  },
  {
    name:"9. Laura 2星提供10",
    fn:()=>lauraAmount(2)===10
  },
  {
    name:"10. Laura 3星提供10",
    fn:()=>lauraAmount(3)===10
  },
  {
    name:"11. Laura 4星提供20",
    fn:()=>lauraAmount(4)===20
  },
  {
    name:"12. Laura 5星提供20",
    fn:()=>lauraAmount(5)===20
  },
  {
    name:"13. 衝分日系統固定只有三次+8",
    fn:()=>systemEventsOnScoringDay().length===3
  },
  {
    name:"14. 三次系統總量=24",
    fn:()=>systemEventsOnScoringDay().length*8===24
  },
  {
    name:"15. 系統事件時間順序正確",
    fn:()=>JSON.stringify(systemEventsOnScoringDay())===JSON.stringify(["10:00 +8","18:00 +8","02:00 +8"])
  },
  {
    name:"16. 衝分日估算不加入下一個10:00的+8",
    fn:()=>estimateScoringHarvest({field:11,inventory:10,lauraStar:5}).total===65
  },
  {
    name:"17. 盟友瞬間幫助不增加預計雷達總量",
    fn:()=>{
      const base=estimateScoringHarvest({field:11,inventory:10,lauraStar:4}).total;
      const withHelp=base; // 幫助只改未完成→已完成，不創造新雷達
      return withHelp===base;
    }
  },
  {
    name:"18. Laura寶箱進度不增加預計雷達總量",
    fn:()=>{
      const a=estimateScoringHarvest({field:11,inventory:10,lauraStar:5}).total;
      const b=estimateScoringHarvest({field:11,inventory:10,lauraStar:5}).total;
      return a===b;
    }
  },
  {
    name:"19. 任務進度超過目標時顯示封頂",
    fn:()=>normalizedTaskProgress(25,20)===20
  },
  {
    name:"20. 任務進度等於目標時維持目標值",
    fn:()=>normalizedTaskProgress(20,20)===20
  }
];

function runAll(){
  let pass=0,out="";
  tests.forEach((t,i)=>{
    let ok=false,error="";
    try{ok=!!t.fn();}catch(e){error=String(e);}
    if(ok)pass++;
    out+=`<div class="test ${ok?"pass":"fail"}">${ok?"✅":"❌"} ${i+1}. ${t.name}${
      ok?"":"<pre>"+(error||"測試結果不符合預期")+"</pre>"
    }</div>`;
  });
  document.getElementById("summary").innerHTML=`<b>${pass}/${tests.length} 通過</b>`;
  document.getElementById("results").innerHTML=out;
}
</script>
</body>
</html>
