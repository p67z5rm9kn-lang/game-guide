<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃器 Production v11</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px}
h1{font-size:25px;margin:0 0 8px}.desc{color:#aaa;line-height:1.55;margin-bottom:18px}
.card{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:15px;margin:12px 0}
h2{font-size:19px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#bbb;font-size:14px;margin-bottom:5px}
input,select{width:100%;box-sizing:border-box;background:#292929;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;font-size:16px}
input[type="number"]{text-align:center}
.state-list,.task-list{display:flex;flex-direction:column;gap:10px}
.state-row,.task-row,.laura-row{display:flex;align-items:center;gap:10px;min-height:42px}
.state-label,.task-label{color:#bbb;font-size:15px;flex:1;min-width:0}
.state-value,.task-value{display:flex;align-items:center;gap:6px;white-space:nowrap}
.compact-input{width:86px!important;flex:0 0 86px}
.fixed-target{min-width:22px;text-align:center;color:#ddd;font-weight:700}
.time-line{display:flex;align-items:center;gap:10px}
.time-line label{margin:0;white-space:nowrap}
.time-input{flex:1;min-width:0}
.time-preview{margin-top:7px;font-size:13px;color:#aaa}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#555;border-radius:28px;cursor:pointer;transition:.18s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
.switch input:checked + .slider{background:#1683ff}
.switch input:checked + .slider:before{transform:translateX(20px)}
.switch-text{font-size:14px;color:#bbb;min-width:54px}
.time-segment{display:flex;gap:0;margin-top:8px}
.time-segment button{flex:1;border-radius:0;background:#292929;border:1px solid #444;color:#bbb;padding:9px 8px;font-size:14px}
.time-segment button:first-child{border-radius:9px 0 0 9px}
.time-segment button:last-child{border-radius:0 9px 9px 0}
.time-segment button.active{background:#1683ff;color:#fff;border-color:#1683ff}
button{font-size:17px;font-weight:700;padding:12px 18px;border:0;border-radius:11px;background:#1683ff;color:#fff}
button.secondary{background:#444}
button:disabled{opacity:.72;cursor:wait}
button.planning{position:relative;transform:scale(.97);filter:brightness(.88);box-shadow:0 0 0 3px rgba(22,131,255,.18);transition:all .15s ease}
button.plan-done{background:#168f55;box-shadow:0 0 0 3px rgba(32,216,121,.14)}
button.planning::before{content:"";display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:9px;flex-wrap:wrap}.result{font-size:17px;line-height:1.65}
.good{color:#20d879}.warn{color:#ffc44d}.bad{color:#ff5964}
.big{font-size:23px;font-weight:800}.muted{color:#aaa}
ul{margin:8px 0;padding-left:22px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.state-label,.task-label{font-size:14px}.compact-input{width:78px!important;flex-basis:78px}.state-row,.task-row{gap:7px}}
</style>
</head>
<body>
<h1>雷達規劃器</h1>
<div class="desc">Production v11｜純公式規劃核心：直接計算到下一個衝分日，不進行搜尋、排列組合或長時間模擬。</div>

<div class="card">
<h2>① 目前狀態</h2>
<div class="state-list">
<div class="state-row">
  <div class="state-label">庫存 / 庫存上限</div>
  <div class="state-value">
    <input id="inventory" class="compact-input" type="number" min="0" value="22" aria-label="庫存">
    <span>/</span>
    <input id="maxInventory" class="compact-input" type="number" min="1" value="30" aria-label="庫存上限">
  </div>
</div>
<div class="state-row">
  <div class="state-label">場上已完成 / 場上雷達總數</div>
  <div class="state-value">
    <input id="completed" class="compact-input" type="number" min="0" value="8" aria-label="場上已完成">
    <span>/</span>
    <input id="field" class="compact-input" type="number" min="0" value="11" aria-label="場上雷達總數">
  </div>
</div>
<div class="state-row">
  <div class="state-label">勞拉</div>
  <div class="state-value">
    <span id="lauraAvailableText" class="switch-text">無</span>
    <label class="switch" aria-label="是否有勞拉">
      <input id="lauraAvailable" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
</div>
<div id="lauraDetailRow" class="state-row" style="display:none">
  <div class="state-label">星級 / 今日狀態</div>
  <div class="state-value">
    <select id="lauraStar" class="compact-input" aria-label="勞拉星級">
      <option value="0">0 星</option><option value="1">1 星</option><option value="2">2 星</option>
      <option value="3">3 星</option><option value="4" selected>4 星</option><option value="5">5 星</option>
    </select>
    <span id="lauraUsedText" class="switch-text">未點擊</span>
    <label class="switch" aria-label="勞拉今日狀態">
      <input id="lauraUsed" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
</div>
</div>
</div>

<div class="card">
<h2>② 每日任務</h2>
<div class="task-list">
<div class="task-row">
  <div class="task-label">勇士戰令</div>
  <label class="switch">
    <input id="warActive" type="checkbox">
    <span class="slider"></span>
  </label>
  <span id="warActiveText" class="switch-text">未啟用</span>
  <div class="task-value">
    <input id="warCurrent" class="compact-input" type="number" min="0" value="0" placeholder="—" aria-label="勇士戰令目前進度">
    <span>/</span><span class="fixed-target">10</span>
  </div>
</div>
<div class="task-row">
  <div class="task-label">黎明曙光</div>
  <label class="switch">
    <input id="dawnActive" type="checkbox">
    <span class="slider"></span>
  </label>
  <span id="dawnActiveText" class="switch-text">未啟用</span>
  <div class="task-value">
    <input id="dawnCurrent" class="compact-input" type="number" min="0" value="0" placeholder="—" aria-label="黎明曙光目前進度">
    <span>/</span><span class="fixed-target">20</span>
  </div>
</div>
<div id="treasureRow" class="task-row" style="display:none">
  <div class="task-label">勞拉寶箱</div>
  <div class="task-value">
    <input id="treasure" class="compact-input" type="number" min="0" max="10" value="0" aria-label="勞拉寶箱目前進度">
    <span>/</span><span class="fixed-target">10</span>
  </div>
</div>
</div>
</div>

<div class="card">
<h2>③ 規劃時間</h2>
<div class="time-line">
  <label for="baseTime">計算基準時間</label>
  <input id="baseTime" class="time-input" type="datetime-local">
</div>
<div id="baseTimePreview" class="time-preview">尚未設定</div>
<input id="timeMode" type="hidden" value="local">
<div class="time-segment">
  <button type="button" id="localTimeBtn" class="active">當地時間</button>
  <button type="button" id="doomTimeBtn">末日時間（UTC−2）</button>
</div>
<div id="timeInfo" class="muted" style="margin-top:8px">尚未規劃</div>
<div class="row" style="margin-top:12px">
<button id="now">使用現在時間</button>
<button id="plan">開始規劃</button>
</div>
</div>

<div id="output" class="card">
<h2>規劃結果</h2>
<div class="muted">尚未執行規劃。</div>
</div>

<script>
const $=id=>document.getElementById(id);
function makeState(){
 return {
  field:+$("field").value, completed:+$("completed").value,
  inventory:+$("inventory").value, maxInventory:+$("maxInventory").value,
  lauraAvailable:$("lauraAvailable").checked,
  lauraStar:$("lauraAvailable").checked ? +$("lauraStar").value : 0,
  lauraUsed:$("lauraAvailable").checked && $("lauraUsed").checked,
  treasure:Math.min(10,Math.max(0,+$("treasure").value)),
  tasks:{
   warriors:{active:$("warActive").checked,target:10,current:+$("warCurrent").value},
   dawn:{active:$("dawnActive").checked,target:20,current:+$("dawnCurrent").value}
  }
 };
}
function unfinished(s){return Math.max(0,s.field-s.completed);}
function ideal(max){return {field:11,inventory:max-8};}
function requiredToday(s){
 const w=s.tasks.warriors,d=s.tasks.dawn;
 const rw=w.active?Math.max(0,10-w.current):0;
 const rd=d.active?Math.max(0,20-d.current):0;
 return Math.max(rw,rd);
}
function validate(s){
 const e=[];
 if(!Number.isFinite(s.maxInventory)||s.maxInventory<=0)e.push("庫存上限 必須大於 0");
 if(!Number.isFinite(s.inventory)||s.inventory<0)e.push("庫存不可小於 0");
 if(!Number.isFinite(s.field)||s.field<0)e.push("場上雷達總數不可小於 0");
 if(!Number.isFinite(s.completed)||s.completed<0)e.push("已完成數不可小於 0");
 if(s.completed>s.field)e.push("已完成數不可大於場上總數");
 for(const k of ["warriors","dawn"]){
  const t=s.tasks[k];
  if(!Number.isFinite(t.current)||t.current<0)e.push("每日任務目前進度不可小於 0");
 }
 if(s.lauraAvailable&&!(s.lauraStar>=0&&s.lauraStar<=5))e.push("勞拉星級無效");
 if(s.treasure<0)e.push("勞拉寶箱不可小於 0");
 return e;
}
function nextScoring(base){
 const p=taiwanParts(base), day=taiwanWeekday(base), h=p.h;
 if((day===1||day===5)&&h<10)return new Date(taiwanDateMs(p.y,p.m,p.d,10));
 const add=(day===0?1:day===1?4:day===2?3:day===3?2:day===4?1:day===5?3:2);
 return new Date(taiwanDateMs(p.y,p.m,p.d+add,10));
}
function modeText(base){
 const p=taiwanParts(base), day=taiwanWeekday(base), h=p.h;
 if((day===1||day===5)&&h>=10)return "衝分日";
 if((day===1||day===5)&&h<10)return "衝分日前準備";
 return "準備期";
}
const FMT_LOCAL=new Intl.DateTimeFormat("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false});
const FMT_DOOM=new Intl.DateTimeFormat("zh-TW",{timeZone:"Etc/GMT+2",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false});
function fmt(d){
 const parts=($("timeMode").value==="doom"?FMT_DOOM:FMT_LOCAL).formatToParts(d);
 const get=k=>parts.find(x=>x.type===k)?.value||"";
 const wm={"星期日":"日","星期一":"一","星期二":"二","星期三":"三","星期四":"四","星期五":"五","星期六":"六"};
 return `${get("year")}/${get("month")}/${get("day")}（${wm[get("weekday")]||get("weekday").replace("星期","")}） ${get("hour")}:${get("minute")}`;
}
function taiwanDateMs(y,m,d,h){return Date.UTC(y,m-1,d,h,0,0,0)-8*3600000;}
function taiwanParts(ms){const d=new Date(ms+8*3600000);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours()};}
function taiwanWeekday(ms){return new Date(ms+8*3600000).getUTCDay();}
function addDaysTaiwan(ms,n){const p=taiwanParts(ms);return taiwanDateMs(p.y,p.m,p.d+n,p.h);}
function eventMsForDay(ms,offsetDays,hour){const p=taiwanParts(ms);return taiwanDateMs(p.y,p.m,p.d+offsetDays,hour);}
function nextSystemEvents(startMs,scoreMs){
 // Fixed maximum horizon: the planner only needs the short interval to the next Monday/Friday 10:00.
 // Build the candidate Taiwan 02:00/10:00/18:00 nodes directly; no search, recursion, or simulation loop.
 const offsets=[-1,0,1,2,3,4];
 const a=offsets.flatMap(d=>[2,10,18].map(h=>eventMsForDay(startMs,d,h))).filter(t=>t>startMs&&t<=scoreMs).sort((x,y)=>x-y);
 // Deduplicate without a loop by converting to a Set.
 return [...new Set(a)];
}
function addComplete(s,n,actions,t,day){
 const n0=Math.max(0,Math.min(n,unfinished(s)));
 if(!n0)return 0;
 s.completed+=n0;
 for(const k of ["warriors","dawn"]){const q=s.tasks[k];if(q.active)q.current=Math.min(q.target,q.current+n0);}
 actions.push({t,kind:"complete",n:n0,day});
 return n0;
}
function addHarvest(s,n,actions,t,day){
 const n0=Math.max(0,Math.min(n,s.completed));
 if(!n0)return 0;
 s.completed-=n0;s.field-=n0;
 if(s.lauraStar===5)s.treasure=Math.min(10,s.treasure+n0);
 if(s.field<8&&s.inventory>0){
  const refill=Math.min(8-s.field,s.inventory);
  s.field+=refill;s.inventory-=refill;
 }
 actions.push({t,kind:"harvest",n:n0,day});
 return n0;
}
function applySystem8Formula(s,actions,t,day){
 const fill=Math.min(8,Math.max(0,8-s.field));
 s.field+=fill;
 const remainder=8-fill;
 const room=Math.max(0,s.maxInventory-s.inventory);
 const stored=Math.min(remainder,room);
 s.inventory+=stored;
 actions.push({t,kind:"system8",n:8,day,fieldAdd:fill,inventoryAdd:stored});
}
function applyLauraFormula(s,actions,t,day){
 if(!s.lauraAvailable||s.lauraUsed)return 0;
 const amount=[5,10,10,10,20,20][s.lauraStar]||0;
 const fieldAdd=s.field<8?Math.min(8-s.field,amount):Math.min(3,amount);
 s.field+=fieldAdd;s.inventory+=amount-fieldAdd;s.lauraUsed=true;
 actions.push({t,kind:"laura",n:amount,day});
 return amount;
}
function taskStateForFutureDay(){return {warriors:{active:true,target:10,current:0},dawn:{active:true,target:20,current:0}};}
function planCrossDayFormula(startMs,state){
 const score=nextScoring(startMs), scoreMs=score.getTime();
 const s=JSON.parse(JSON.stringify(state));
 const actions=[]; const target=ideal(s.maxInventory);
 const baseDay=taiwanWeekday(startMs);
 const startParts=taiwanParts(startMs);
 const beforeScoring=(baseDay===1||baseDay===5)&&startParts.h<10;
 const events=nextSystemEvents(startMs,scoreMs);
 // Current day: only actual active tasks matter. No future-day assumptions are mixed in here.
 const currentNeed=requiredToday(s);
 if(currentNeed>0){
  const c=addComplete(s,currentNeed,actions,startMs,fmt(startMs));
  const left=currentNeed-c;
  if(left>0&&s.completed>0&&s.inventory>0){
   const n=Math.min(left,s.completed,s.inventory);
   addHarvest(s,n,actions,startMs,fmt(startMs));
   addComplete(s,left,actions,startMs,fmt(startMs));
  }
 }
 // If we are not already in the scoring-day window, use today's Laura opportunity now when available.
 if(!beforeScoring && s.lauraAvailable&&!s.lauraUsed)applyLauraFormula(s,actions,startMs,fmt(startMs));
 // Directly process each fixed event. There are only the known 02/10/18 nodes before the score.
 function processEvent(t){
  const p=taiwanParts(t), h=p.h;
  const isRollover=h===10, isScore=t===scoreMs;
  if(isRollover){
   if(!isScore){
    s.lauraUsed=false;s.treasure=0;s.tasks=taskStateForFutureDay();
    actions.push({t,kind:"reset",day:fmt(t)});
    if(s.lauraAvailable)applyLauraFormula(s,actions,t,fmt(t));
   }
   applySystem8Formula(s,actions,t,fmt(t));
   if(!isScore){
    const need=Math.max(0,20-Math.max(s.tasks.warriors.current,s.tasks.dawn.current));
    const c=addComplete(s,need,actions,t,fmt(t));
    const left=need-c;
    if(left>0&&s.completed>0&&s.inventory>0){
     const n=Math.min(left,s.completed,s.inventory);
     addHarvest(s,n,actions,t,fmt(t));
     addComplete(s,left,actions,t,fmt(t));
    }
   }
  }else if(h===18){
   // 18:00 system +8. Future-day task planning is handled at the day's 10:00 reset;
   // current-day tasks use only the actual input state and are not invented here.
   applySystem8Formula(s,actions,t,fmt(t));
  }else if(h===2){
   // 02:00 system +8. It belongs to the same game day that started at the previous 10:00.
   applySystem8Formula(s,actions,t,fmt(t));
  }
 }
 events.forEach(processEvent);
 // Scoring day 10:00 may be the third event. It is a scoring point, not a future task day.
 // Do not invent task requirements for it.
 if(s.field>11&&s.completed>0){
  const n=Math.min(s.completed,s.field-11);
  if(n)addHarvest(s,n,actions,scoreMs,fmt(score));
 }
 return {score,state:s,actions,target,taskOK:requiredToday(s)===0,finalOK:s.field>=target.field&&s.inventory>=target.inventory};
}
function planner(s,baseMs){
 const target=ideal(s.maxInventory);
 return {target,done:s.field>=target.field&&s.inventory>=target.inventory,needsField:Math.max(0,target.field-s.field),needsInventory:Math.max(0,target.inventory-s.inventory),score:nextScoring(baseMs)};
}
function updateTimePreview(){const base=$("baseTime").value?new Date($("baseTime").value):null;$("baseTimePreview").textContent=base?`顯示：${fmt(base)}`:"尚未設定";}
function setNow(){const d=new Date(),pad=n=>String(n).padStart(2,"0");$("baseTime").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
const planInputs=["maxInventory","inventory","field","completed","lauraAvailable","lauraStar","lauraUsed","treasure","warActive","warCurrent","dawnActive","dawnCurrent","baseTime"];
function markPlanDirty(){const btn=$("plan");if(btn.classList.contains("planning"))return;btn.classList.remove("plan-done");btn.textContent="開始規劃";}
function syncTaskUI(){const w=$("warActive").checked,d=$("dawnActive").checked;$("warActiveText").textContent=w?"啟用":"未啟用";$("dawnActiveText").textContent=d?"啟用":"未啟用";$("warCurrent").disabled=!w;$("dawnCurrent").disabled=!d;$("warCurrent").placeholder=w?"目前":"—";$("dawnCurrent").placeholder=d?"目前":"—";}
function syncLauraUI(){const a=$("lauraAvailable").checked,u=$("lauraUsed").checked,star=+$("lauraStar").value;$("lauraAvailableText").textContent=a?"有":"無";$("lauraDetailRow").style.display=a?"flex":"none";$("lauraStar").disabled=!a;$("lauraUsed").disabled=!a;$("lauraUsedText").textContent=u?"已點擊":"未點擊";$("treasureRow").style.display=a&&star===5?"flex":"none";$("treasure").disabled=!(a&&star===5);}
for(const id of planInputs){const el=$(id);el.addEventListener("input",()=>{syncTaskUI();syncLauraUI();updateTimePreview();markPlanDirty();});el.addEventListener("change",()=>{syncTaskUI();syncLauraUI();updateTimePreview();markPlanDirty();});}
$("now").onclick=()=>{setNow();updateTimePreview();markPlanDirty();};
$("localTimeBtn").onclick=()=>{$("timeMode").value="local";$("localTimeBtn").classList.add("active");$("doomTimeBtn").classList.remove("active");updateTimePreview();markPlanDirty();};
$("doomTimeBtn").onclick=()=>{$("timeMode").value="doom";$("doomTimeBtn").classList.add("active");$("localTimeBtn").classList.remove("active");updateTimePreview();markPlanDirty();};
$("plan").onclick=()=>{
 const planBtn=$("plan");planBtn.disabled=true;planBtn.classList.add("planning");planBtn.textContent="規劃中…";
 const s=makeState(),errors=validate(s);
 if(errors.length){$("output").innerHTML=`<h2>規劃結果</h2><div class="bad">❌ 無法規劃</div><ul>${errors.map(e=>`<li>${e}</li>`).join("")}</ul>`;planBtn.disabled=false;planBtn.classList.remove("planning");planBtn.textContent="規劃失敗，請檢查輸入";setTimeout(()=>{planBtn.textContent="開始規劃";},1400);return;}
 const base=$("baseTime").value?new Date($("baseTime").value):new Date();
 const p=planner(s,base.getTime()),mode=modeText(base),score=nextScoring(base),cp=mode==="衝分日"?null:planCrossDayFormula(base.getTime(),s);
 let html=`<h2>規劃結果</h2><div class="big">${mode}</div><div class="muted">計算基準：${fmt(base)}<br>下一個衝分時間：${fmt(score)}</div><hr style="border:0;border-top:1px solid #333;margin:14px 0"><div><b>理想狀態</b></div><div class="result">場上：<b>${p.target.field}</b> 個<br>庫存：<b>${p.target.inventory}</b> 個</div>`;
 if(p.done)html+=`<div class="good big" style="margin-top:12px">✅ 目前已達理想準備狀態</div>`;else html+=`<div class="warn big" style="margin-top:12px">⏳ 目前尚未達理想準備狀態</div><div class="result" style="margin-top:8px">目前還需要：場上 ${p.needsField} 個、庫存 ${p.needsInventory} 個</div>`;
 if(mode==="衝分日"){
  const lauraAmount=s.lauraAvailable?[5,10,10,10,20,20][s.lauraStar]:0,estimate=s.field+s.inventory+24+lauraAmount;

 }else{
