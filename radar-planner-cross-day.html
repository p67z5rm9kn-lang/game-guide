<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃器 Production v8</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px}
h1{font-size:25px;margin:0 0 8px}.desc{color:#aaa;line-height:1.55;margin-bottom:18px}
.card{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:15px;margin:12px 0}
h2{font-size:19px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#bbb;font-size:14px;margin-bottom:5px}
input,select{width:100%;box-sizing:border-box;background:#292929;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;font-size:16px}
input[type="number"]{text-align:center}
.state-list,.task-list{display:flex;flex-direction:column;gap:10px}
.state-row,.task-row,.laura-row{display:flex;align-items:center;gap:10px;min-height:42px}
.state-label,.task-label{color:#bbb;font-size:15px;flex:1;min-width:0}
.state-value,.task-value{display:flex;align-items:center;gap:6px;white-space:nowrap}
.compact-input{width:86px!important;flex:0 0 86px}
.fixed-target{min-width:22px;text-align:center;color:#ddd;font-weight:700}
.time-line{display:flex;align-items:center;gap:10px}
.time-line label{margin:0;white-space:nowrap}
.time-input{flex:1;min-width:0}
.time-preview{margin-top:7px;font-size:13px;color:#aaa}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#555;border-radius:28px;cursor:pointer;transition:.18s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
.switch input:checked + .slider{background:#1683ff}
.switch input:checked + .slider:before{transform:translateX(20px)}
.switch-text{font-size:14px;color:#bbb;min-width:54px}
.time-segment{display:flex;gap:0;margin-top:8px}
.time-segment button{flex:1;border-radius:0;background:#292929;border:1px solid #444;color:#bbb;padding:9px 8px;font-size:14px}
.time-segment button:first-child{border-radius:9px 0 0 9px}
.time-segment button:last-child{border-radius:0 9px 9px 0}
.time-segment button.active{background:#1683ff;color:#fff;border-color:#1683ff}
button{font-size:17px;font-weight:700;padding:12px 18px;border:0;border-radius:11px;background:#1683ff;color:#fff}
button.secondary{background:#444}
button:disabled{opacity:.72;cursor:wait}
button.planning{position:relative;transform:scale(.97);filter:brightness(.88);box-shadow:0 0 0 3px rgba(22,131,255,.18);transition:all .15s ease}
button.plan-done{background:#168f55;box-shadow:0 0 0 3px rgba(32,216,121,.14)}
button.planning::before{content:"";display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:9px;flex-wrap:wrap}.result{font-size:17px;line-height:1.65}
.good{color:#20d879}.warn{color:#ffc44d}.bad{color:#ff5964}
.big{font-size:23px;font-weight:800}.muted{color:#aaa}
ul{margin:8px 0;padding-left:22px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.state-label,.task-label{font-size:14px}.compact-input{width:78px!important;flex-basis:78px}.state-row,.task-row{gap:7px}}
</style>
</head>
<body>
<h1>雷達規劃器</h1>
<div class="desc">Production v8｜跨日完整策略規劃／效能修正版：從目前時間一路模擬到下一個衝分日，包含每日任務、系統 +8、勞拉、完成、收割與自動補回。規劃只產生建議，不會直接修改玩家狀態。</div>

<div class="card">
<h2>① 目前狀態</h2>
<div class="state-list">
<div class="state-row">
  <div class="state-label">庫存 / 庫存上限</div>
  <div class="state-value">
    <input id="inventory" class="compact-input" type="number" min="0" value="22" aria-label="庫存">
    <span>/</span>
    <input id="maxInventory" class="compact-input" type="number" min="1" value="30" aria-label="庫存上限">
  </div>
</div>
<div class="state-row">
  <div class="state-label">場上已完成 / 場上雷達總數</div>
  <div class="state-value">
    <input id="completed" class="compact-input" type="number" min="0" value="8" aria-label="場上已完成">
    <span>/</span>
    <input id="field" class="compact-input" type="number" min="0" value="11" aria-label="場上雷達總數">
  </div>
</div>
<div class="state-row">
  <div class="state-label">勞拉</div>
  <div class="state-value">
    <span id="lauraAvailableText" class="switch-text">無</span>
    <label class="switch" aria-label="是否有勞拉">
      <input id="lauraAvailable" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
</div>
<div id="lauraDetailRow" class="state-row" style="display:none">
  <div class="state-label">星級 / 今日狀態</div>
  <div class="state-value">
    <select id="lauraStar" class="compact-input" aria-label="勞拉星級">
      <option value="0">0 星</option><option value="1">1 星</option><option value="2">2 星</option>
      <option value="3">3 星</option><option value="4" selected>4 星</option><option value="5">5 星</option>
    </select>
    <span id="lauraUsedText" class="switch-text">未點擊</span>
    <label class="switch" aria-label="勞拉今日狀態">
      <input id="lauraUsed" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
</div>
</div>
</div>

<div class="card">
<h2>② 每日任務</h2>
<div class="task-list">
<div class="task-row">
  <div class="task-label">勇士戰令</div>
  <label class="switch">
    <input id="warActive" type="checkbox">
    <span class="slider"></span>
  </label>
  <span id="warActiveText" class="switch-text">未啟用</span>
  <div class="task-value">
    <input id="warCurrent" class="compact-input" type="number" min="0" value="0" placeholder="—" aria-label="勇士戰令目前進度">
    <span>/</span><span class="fixed-target">10</span>
  </div>
</div>
<div class="task-row">
  <div class="task-label">黎明曙光</div>
  <label class="switch">
    <input id="dawnActive" type="checkbox">
    <span class="slider"></span>
  </label>
  <span id="dawnActiveText" class="switch-text">未啟用</span>
  <div class="task-value">
    <input id="dawnCurrent" class="compact-input" type="number" min="0" value="0" placeholder="—" aria-label="黎明曙光目前進度">
    <span>/</span><span class="fixed-target">20</span>
  </div>
</div>
<div id="treasureRow" class="task-row" style="display:none">
  <div class="task-label">勞拉寶箱</div>
  <div class="task-value">
    <input id="treasure" class="compact-input" type="number" min="0" max="10" value="0" aria-label="勞拉寶箱目前進度">
    <span>/</span><span class="fixed-target">10</span>
  </div>
</div>
</div>
</div>

<div class="card">
<h2>③ 規劃時間</h2>
<div class="time-line">
  <label for="baseTime">計算基準時間</label>
  <input id="baseTime" class="time-input" type="datetime-local">
</div>
<div id="baseTimePreview" class="time-preview">尚未設定</div>
<input id="timeMode" type="hidden" value="local">
<div class="time-segment">
  <button type="button" id="localTimeBtn" class="active">當地時間</button>
  <button type="button" id="doomTimeBtn">末日時間（UTC−2）</button>
</div>
<div id="timeInfo" class="muted" style="margin-top:8px">尚未規劃</div>
<div class="row" style="margin-top:12px">
<button id="now">使用現在時間</button>
<button id="plan">開始規劃</button>
</div>
</div>

<div id="output" class="card">
<h2>規劃結果</h2>
<div class="muted">尚未執行規劃。</div>
</div>

<script>
const $=id=>document.getElementById(id);
function clone(x){return JSON.parse(JSON.stringify(x));}
function makeState(){
 return {
  field:+$("field").value, completed:+$("completed").value,
  inventory:+$("inventory").value, maxInventory:+$("maxInventory").value,
  lauraAvailable:$("lauraAvailable").checked,
  lauraStar:$("lauraAvailable").checked ? +$("lauraStar").value : 0,
  lauraUsed:$("lauraAvailable").checked && $("lauraUsed").checked,
  treasure:Math.min(10,Math.max(0,+$("treasure").value)),
  tasks:{
   warriors:{active:$("warActive").checked,target:10,current:+$("warCurrent").value},
   dawn:{active:$("dawnActive").checked,target:20,current:+$("dawnCurrent").value}
  }
 };
}
function normalize(s){s=clone(s);s.unfinished=s.field-s.completed;return s;}
function ideal(max){return {field:11,inventory:max-8};}
const PLANNER_LIMITS={maxEvents:32,maxActions:240,maxLoopGuard:120};
function planner(s,baseMs){
 s=normalize(s);
 const target=ideal(s.maxInventory);
 return {target,done:s.field>=target.field&&s.inventory>=target.inventory,needsField:Math.max(0,target.field-s.field),needsInventory:Math.max(0,target.inventory-s.inventory),score:nextScoring(baseMs)};
}
function requiredToday(s){
 let req=0,has=false;
 for(const k of ["warriors","dawn"]){
  const t=s.tasks[k];
  if(t&&t.active){has=true;req=Math.max(req,Math.max(0,t.target-t.current));}
 }
 return has?req:0;
}
function futureTaskReset(s){
 s.lauraUsed=false;s.treasure=0;
 s.tasks={warriors:{active:true,target:10,current:0},dawn:{active:true,target:20,current:0}};
 return s;
}
function addComplete(s,n){
 n=Math.max(0,Math.min(n,s.unfinished));
 if(!n)return 0;
 s.unfinished-=n;s.completed+=n;
 for(const k of ["warriors","dawn"]){
  const t=s.tasks[k];
  if(t&&t.active)t.current=Math.min(t.target,t.current+n);
 }
 return n;
}
function addHarvest(s,n){
 n=Math.max(0,Math.min(n,s.completed));
 if(!n)return 0;
 s.completed-=n;s.field-=n;
 if(s.lauraStar===5)s.treasure=Math.min(10,s.treasure+n);
 if(s.field<8&&s.inventory>0){
  const refill=Math.min(8-s.field,s.inventory);
  s.field+=refill;s.inventory-=refill;
 }
 s.unfinished=s.field-s.completed;
 return n;
}
function applySystem8Fast(s){
 const fieldAdd=Math.min(8,Math.max(0,8-s.field));
 s.field+=fieldAdd;
 const rem=8-fieldAdd;
 if(rem>0)s.inventory+=Math.min(rem,Math.max(0,s.maxInventory-s.inventory));
 s.unfinished=s.field-s.completed;
}
function applyLauraFast(s){
 if(!s.lauraAvailable||s.lauraUsed)return 0;
 const amount={0:5,1:10,2:10,3:10,4:20,5:20}[s.lauraStar]||0;
 if(s.field<8){const add=Math.min(8-s.field,amount);s.field+=add;s.inventory+=amount-add;}
 else{s.field+=3;s.inventory+=amount-3;}
 s.lauraUsed=true;s.unfinished=s.field-s.completed;
 return amount;
}
function satisfyTasksFast(s,required,t,day,actions){
 // Complete what is already on the field. If more completions are required,
 // convert the minimum number of completed radars into fresh field radars via
 // the game's automatic refill, then complete those in bulk.
 let left=Math.max(0,required);
 if(left&&s.unfinished){const n=addComplete(s,left);actions.push({t,kind:"complete",n,day});left-=n;}
 if(left>0&&s.completed>0&&s.inventory>0){
  const first=Math.min(s.completed,Math.max(1,s.field-7));
  const n=addHarvest(s,first);
  if(n)actions.push({t,kind:"harvest",n,day});
  if(left&&s.unfinished){const c=addComplete(s,left);if(c)actions.push({t,kind:"complete",n:c,day});left-=c;}
 }
 if(left>0&&s.completed>0&&s.inventory>0){
  const n=Math.min(left,s.completed,s.inventory);
  if(n){addHarvest(s,n);actions.push({t,kind:"harvest",n,day});}
  if(left&&s.unfinished){const c=addComplete(s,left);if(c)actions.push({t,kind:"complete",n:c,day});left-=c;}
 }
 return left;
}
function crossDayPlan(startMs,state){
 const score=nextScoring(startMs);
 const s=normalize(state),actions=[];
 const dayLabel=ms=>fmt(ms).split(" ")[0];
 let currentDay=gameDayKey(startMs);
 let nextReset=dayEnd(startMs);
 // Today is also a usable game day: if Laura is available and not clicked,
 // use her before satisfying today's task requirement.
 const baseIsScoringDay=((new Date(startMs)).getDay()===1||(new Date(startMs)).getDay()===5);
 const baseBefore10=(new Date(startMs)).getHours()<10;
 if(s.lauraAvailable&&!s.lauraUsed && !(baseIsScoringDay&&!baseBefore10)){
  applyLauraFast(s);
  actions.push({t:startMs,kind:"laura",day:dayLabel(startMs)});
 }
 let remaining=requiredToday(s);
 if(remaining>0) satisfyTasksFast(s,remaining,startMs,dayLabel(startMs),actions);
 
 // Build only the fixed game events between the baseline and the target.
 const events=[];
 const utc2=startMs-2*HOUR;
 const u=new Date(utc2);
 const baseUtc=Date.UTC(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),0,0,0);
 for(let d=-1;d<5;d++){
  for(const h of [0,8,16]){
   const t=baseUtc+d*DAY+h*HOUR;
   if(t>startMs&&t<score)events.push(t);
  }
 }
 events.sort((a,b)=>a-b);
 
 for(const t of events){
  while(nextReset<=t&&nextReset<score){
   futureTaskReset(s);currentDay=gameDayKey(nextReset);
   actions.push({t:nextReset,kind:"reset",day:dayLabel(nextReset)});
   if(s.lauraAvailable){applyLauraFast(s);actions.push({t:nextReset,kind:"laura",day:dayLabel(nextReset)});}
   satisfyTasksFast(s,20,nextReset,dayLabel(nextReset),actions);
   nextReset+=DAY;
  }
  applySystem8Fast(s);
  actions.push({t,kind:"system8",day:dayLabel(t)});
  const req=requiredToday(s);
  if(req)satisfyTasksFast(s,req,t,dayLabel(t),actions);
 }
 // At the scoring checkpoint, do only the minimum cleanup needed to return to
 // the ideal 11 field radars. Completed radars remain available for scoring.
 if(s.field>11&&s.completed>0){
  const n=Math.min(s.completed,s.field-11);
  if(n){addHarvest(s,n);actions.push({t:score,kind:"harvest-final",n,day:dayLabel(score)});}
 }
 const taskOK=requiredToday(s)===0;
 const target=ideal(s.maxInventory);
 const finalOK=s.field>=target.field&&s.inventory>=target.inventory;
 return {score,state:s,actions,taskOK,target,finalOK};
}
function gameDayKey(ms){return new Date(ms-2*HOUR).toISOString().slice(0,10);}
function dayEnd(ms){const p=taiwanParts(ms);return Date.UTC(p.y,p.m-1,p.d,2,0,0);}
function taiwanParts(ms){const d=new Date(ms+8*HOUR);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes()};}
function weekday(ms){return new Date(ms+8*HOUR).getUTCDay();}
function complete(s,n=1){
 s=clone(s);
 for(let i=0;i<n&&s.unfinished>0;i++){
  s.unfinished--;s.completed++;
  for(const k of ["warriors","dawn"]){
   const t=s.tasks[k];if(t&&t.active)t.current=Math.min(t.target,t.current+1);
  }
 }
 return s;
}
function harvest(s,n=1){
 s=clone(s);
 for(let i=0;i<n&&s.completed>0;i++){
  s.completed--;s.field--;
  if(s.lauraStar===5&&s.treasure<10)s.treasure++;
  if(s.field<8&&s.inventory>0){
   const add=Math.min(8-s.field,s.inventory);
   s.field+=add;s.inventory-=add;
  }
 }
 s.unfinished=s.field-s.completed;return s;
}
function system8(s){
 s=clone(s);
 const fieldAdd=Math.min(8,Math.max(0,8-s.field));
 s.field+=fieldAdd;
 const rem=8-fieldAdd;
 s.inventory+=Math.min(rem,Math.max(0,s.maxInventory-s.inventory));
 s.unfinished=s.field-s.completed;return s;
}
function laura(s){
 s=clone(s);if(s.lauraUsed)return s;
 const amount={0:5,1:10,2:10,3:10,4:20,5:20}[s.lauraStar];
 if(s.field<8){
  const add=Math.min(8-s.field,amount);
  s.field+=add;s.inventory+=amount-add;
 }else{
  s.field+=3;s.inventory+=amount-3;
 }
 s.lauraUsed=true;s.unfinished=s.field-s.completed;return s;
}
function validate(s){
 const e=[];
 if(s.maxInventory<=0)e.push("庫存上限 必須大於 0");
 if(s.inventory<0)e.push("庫存不可小於 0");
 if(s.field<0)e.push("場上雷達總數不可小於 0");
 if(s.completed<0)e.push("已完成數不可小於 0");
 if(s.completed>s.field)e.push("已完成數不可大於場上總數");
 for(const k of ["warriors","dawn"]){
  const t=s.tasks[k];
  if(t.target<0||t.current<0)e.push("每日任務數值不可小於 0");
 }
 return e;
}
function nextScoring(base){
 const d=new Date(base);
 const h=d.getHours(), day=d.getDay();
 const before10=h<10;
 if((day===1||day===5)&&before10)return new Date(d.getFullYear(),d.getMonth(),d.getDate(),10,0,0);
 for(let i=0;i<14;i++){
  const x=new Date(d.getTime()+i*86400000);
  if((x.getDay()===1||x.getDay()===5) && (i>0||h>=10))return new Date(x.getFullYear(),x.getMonth(),x.getDate(),10,0,0);
 }
}
function modeText(base){
 const d=new Date(base), day=d.getDay(), h=d.getHours();
 if((day===1||day===5)&&h>=10)return "衝分日";
 if((day===1||day===5)&&h<10)return "衝分日前準備";
 return "準備期";
}
function fmt(d){
 const mode=$("timeMode").value;
 const zone=mode==="doom"?"Etc/GMT+2":undefined;
 const parts=new Intl.DateTimeFormat("zh-TW",{timeZone:zone,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false}).formatToParts(d);
 const get=k=>parts.find(x=>x.type===k)?.value||"";
 const weekdayMap={"星期日":"日","星期一":"一","星期二":"二","星期三":"三","星期四":"四","星期五":"五","星期六":"六"};
 return `${get("year")}/${get("month")}/${get("day")}（${weekdayMap[get("weekday")]||get("weekday").replace("星期","")}） ${get("hour")}:${get("minute")}`;
}
function updateTimePreview(){
 const base=$("baseTime").value?new Date($("baseTime").value):null;
 $("baseTimePreview").textContent=base?`顯示：${fmt(base)}`:"尚未設定";
}
function setNow(){
 const d=new Date(), pad=n=>String(n).padStart(2,"0");
 $("baseTime").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const planInputs=["maxInventory","inventory","field","completed","lauraAvailable","lauraStar","lauraUsed","treasure","warActive","warCurrent","dawnActive","dawnCurrent","baseTime"];
function markPlanDirty(){
  const btn=$("plan");
  if(btn.classList.contains("planning")) return;
  btn.classList.remove("plan-done");
  btn.textContent="開始規劃";
}
function syncTaskUI(){
  const war=$("warActive").checked, dawn=$("dawnActive").checked;
  $("warActiveText").textContent=war?"啟用":"未啟用";
  $("dawnActiveText").textContent=dawn?"啟用":"未啟用";
  $("warCurrent").disabled=!war; $("dawnCurrent").disabled=!dawn;
  $("warCurrent").placeholder=war?"目前":"—"; $("dawnCurrent").placeholder=dawn?"目前":"—";
}
function syncLauraUI(){
  const available=$("lauraAvailable").checked;
  const used=$("lauraUsed").checked, star=+$("lauraStar").value;
  $("lauraAvailableText").textContent=available?"有":"無";
  $("lauraDetailRow").style.display=available?"flex":"none";
  $("lauraStar").disabled=!available;
  $("lauraUsed").disabled=!available;
  $("lauraUsedText").textContent=used?"已點擊":"未點擊";
  $("treasureRow").style.display=available && star===5?"flex":"none";
  $("treasure").disabled=!(available && star===5);
}
for(const id of planInputs){
  const el=$(id);
  el.addEventListener("input",()=>{syncTaskUI();syncLauraUI();updateTimePreview();markPlanDirty();});
  el.addEventListener("change",()=>{syncTaskUI();syncLauraUI();updateTimePreview();markPlanDirty();});
}
$("now").onclick=()=>{setNow();updateTimePreview();markPlanDirty();};
$("localTimeBtn").onclick=()=>{ $("timeMode").value="local"; $("localTimeBtn").classList.add("active"); $("doomTimeBtn").classList.remove("active"); updateTimePreview(); markPlanDirty(); };
$("doomTimeBtn").onclick=()=>{ $("timeMode").value="doom"; $("doomTimeBtn").classList.add("active"); $("localTimeBtn").classList.remove("active"); updateTimePreview(); markPlanDirty(); };
$("plan").onclick=async()=>{
 const planBtn=$("plan");
 planBtn.disabled=true;
 planBtn.classList.add("planning");
 planBtn.dataset.originalText=planBtn.textContent;
 planBtn.textContent="規劃中…";
 const s=makeState(), errors=validate(s);
 if(errors.length){$("output").innerHTML=`<h2>規劃結果</h2><div class="bad">❌ 無法規劃</div><ul>${errors.map(e=>`<li>${e}</li>`).join("")}</ul>`; planBtn.disabled=false; planBtn.classList.remove("planning"); planBtn.textContent="規劃失敗，請檢查輸入"; setTimeout(()=>{planBtn.textContent=planBtn.dataset.originalText||"開始規劃";},1400); return;}
 const base=$("baseTime").value?new Date($("baseTime").value):new Date();
 await new Promise(resolve=>setTimeout(resolve,0));
 const p=planner(s,base.getTime()), mode=modeText(base), score=nextScoring(base);
 let html=`<h2>規劃結果</h2>`;
 html+=`<div class="big">${mode}</div>`;
 html+=`<div class="muted">計算基準：${fmt(base)}<br>下一個衝分時間：${fmt(score)}</div>`;
 html+=`<hr style="border:0;border-top:1px solid #333;margin:14px 0">`;
 html+=`<div><b>理想狀態</b></div><div class="result">場上：<b>${p.target.field}</b> 個<br>庫存：<b>${p.target.inventory}</b> 個</div>`;
 if(p.done){
  html+=`<div class="good big" style="margin-top:12px">✅ 目前已達理想準備狀態</div>`;
 }else{
  html+=`<div class="warn big" style="margin-top:12px">⏳ 目前尚未達理想準備狀態</div>`;
  html+=`<div class="result" style="margin-top:8px">目前還需要：場上 ${p.needsField} 個、庫存 ${p.needsInventory} 個</div>`;
 }
 if(mode==="衝分日"){
  const lauraAmount=s.lauraAvailable?({0:5,1:10,2:10,3:10,4:20,5:20}[s.lauraStar]):0;
  const estimate=s.field+s.inventory+24+lauraAmount;
  html+=`<div class="card" style="margin-top:14px"><div class="big">🏆 本次衝分日預計可收割：${estimate} 個</div><div class="muted">基準：目前場上＋目前庫存＋本次衝分日系統 +24＋勞拉 ${lauraAmount}<br>不預設盟友瞬間幫助；自動補回不視為新增資源。</div></div>`;
  html+=`<div class="result"><b>衝分日操作方向</b><ul><li>完成可完成的未完成雷達</li><li>收割已完成雷達</li><li>不需要為下一個衝分日保留資源</li></ul></div>`;
 }else{
  const cp=crossDayPlan(base.getTime(),s);
  const grouped={};
  for(const a of cp.actions){const key=a.day||fmt(a.t);(grouped[key]??=[]).push(a);}
  html+=`<div class="result"><b>跨日完整規劃</b>`;
  html+=`<div class="muted" style="margin-top:6px">不是只計算下一次 +8，而是一路模擬到 ${fmt(cp.score)}；未來完整遊戲日自動假設勇士戰令 10、黎明曙光 20 都要完成。</div>`;
  const entries=Object.entries(grouped);
  if(!entries.length){html+=`<div class="muted" style="margin-top:10px">目前沒有需要安排的跨日操作。</div>`;}
  for(const [day,acts] of entries){
   html+=`<div style="margin-top:12px"><b>📅 ${day}</b><ul>`;
   for(const a of acts){
    if(a.kind==="reset") html+=`<li><b>${fmt(a.t)}｜10:00 新一天</b>：每日任務重置 0/10、0/20；勞拉重新可點擊；勞拉寶箱歸零。</li>`;
    else if(a.kind==="laura") html+=`<li><b>${fmt(a.t)}｜點擊勞拉</b>：使用今日勞拉資源，支援後續任務完成與資源準備。</li>`;
    else if(a.kind==="system8") html+=`<li><b>${fmt(a.t)}｜系統 +8</b>：新增 8 個雷達，依場上 8 個優先、剩餘進庫存。</li>`;
    else if(a.kind==="complete") html+=`<li><b>${fmt(a.t)}｜完成雷達 ×${a.n}</b>：同時推進啟用中的每日任務。</li>`;
    else if(a.kind==="harvest") html+=`<li><b>${fmt(a.t)}｜收割 ×${a.n}</b>：需要時用已完成雷達觸發場上自動補回，取得新的未完成雷達。</li>`;
    else if(a.kind==="harvest-final") html+=`<li><b>${fmt(a.t)}｜衝分前整理：收割 ×${a.n}</b>，將場上整理回理想 11 個。</li>`;
   }
   html+=`</ul></div>`;
  }
  const finalOK=cp.finalOK;
  html+=`<div class="${finalOK?"good":"warn"}" style="margin-top:10px"><b>${finalOK?"預計可在衝分前達到理想準備狀態。":"目前已知資源模擬後，仍未能保證達到理想準備狀態；請依序執行並在新狀態下重新規劃。"}</b></div>`;
  html+=`<div class="muted" style="margin-top:10px">模擬終點：場上 ${cp.state.field}、已完成 ${cp.state.completed}、未完成 ${cp.state.unfinished}、庫存 ${cp.state.inventory}。不預設盟友瞬間幫助，也不預測未完成雷達提前消失。</div>`;
  html+=`</div>`;
 } $("output").innerHTML=html;
 $("timeInfo").textContent=`${mode}｜基準 ${fmt(base)}`;
 planBtn.classList.remove("planning");
 planBtn.disabled=false;
 planBtn.classList.add("plan-done");
 planBtn.textContent="✓ 已完成規劃";
};
setNow(); syncTaskUI(); syncLauraUI(); updateTimePreview();
</script>
</body>
</html>
