<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷達規則引擎測試</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
                 "PingFang TC", sans-serif;
    background: #111827;
    color: #f9fafb;
    padding: 20px;
    line-height: 1.6;
}

.card {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    background: #1f2937;
    border-radius: 16px;
}

h1 {
    font-size: 22px;
    margin-top: 0;
}

.test {
    background: #111827;
    padding: 16px;
    border-radius: 12px;
    margin-top: 16px;
}

.test h2 {
    font-size: 16px;
    margin-top: 0;
}

.state {
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    background: #d9821b;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.result {
    margin-top: 12px;
    padding: 14px;
    background: #111827;
    border-radius: 12px;
}

.pass {
    color: #22c55e;
    font-weight: bold;
}

.fail {
    color: #ef4444;
    font-weight: bold;
}

.summary {
    margin-top: 20px;
    padding: 14px;
    background: #111827;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="card">

<h1>雷達規則引擎測試</h1>

<div id="tests"></div>

<div class="summary" id="summary">
尚未執行測試
</div>

</div>

<script>

/* =========================================================
   雷達規則引擎 v1.0
   第 21～30 測試
   ========================================================= */


/* ---------------------------------------------------------
   建立狀態
--------------------------------------------------------- */

function createState({
    field = 0,
    completed = 0,
    inventory = 0,
    maxInventory = 30,

    warriorPassEnabled = false,
    warriorTarget = 0,
    warriorProgress = 0,

    dawnEnabled = false,
    dawnTarget = 0,
    dawnProgress = 0

} = {}) {

    return {
        field,
        completed,
        inventory,
        maxInventory,

        warriorPassEnabled,
        warriorTarget,
        warriorProgress,

        dawnEnabled,
        dawnTarget,
        dawnProgress
    };
}


/* ---------------------------------------------------------
   任務進度增加
--------------------------------------------------------- */

function addCompletionProgress(state) {

    /*
       一次「完成事件」：

       未完成 → 已完成

       同時：
       勇士戰令 +1（如果啟用）
       黎明曙光 +1（如果啟用）

       兩個任務彼此獨立。
    */

    if (state.warriorPassEnabled) {

        state.warriorProgress = Math.min(
            state.warriorProgress + 1,
            state.warriorTarget
        );
    }

    if (state.dawnEnabled) {

        state.dawnProgress = Math.min(
            state.dawnProgress + 1,
            state.dawnTarget
        );
    }
}


/* ---------------------------------------------------------
   玩家完成一個未完成雷達
--------------------------------------------------------- */

function completeRadar(state) {

    if (state.field - state.completed <= 0) {

        return {
            success: false,
            reason: "沒有未完成雷達"
        };
    }

    /*
       未完成 -1
       已完成 +1

       場上總數不變。
       庫存不變。
       不觸發自動補回。
    */

    state.completed++;

    addCompletionProgress(state);

    return {
        success: true
    };
}


/* ---------------------------------------------------------
   盟友瞬間幫助
--------------------------------------------------------- */

function allyInstantHelp(state) {

    if (state.field - state.completed <= 0) {

        return {
            success: false,
            reason: "沒有未完成雷達"
        };
    }

    /*
       盟友瞬間幫助與玩家完成
       在規則引擎中視為相同的「完成事件」。

       未完成 -1
       已完成 +1
       場上總數不變
       庫存不變
       任務進度 +1
    */

    state.completed++;

    addCompletionProgress(state);

    return {
        success: true
    };
}


/* ---------------------------------------------------------
   收割一個已完成雷達
--------------------------------------------------------- */

function harvestRadar(state) {

    if (state.completed <= 0) {

        return {
            success: false,
            reason: "沒有已完成雷達"
        };
    }

    state.completed--;
    state.field--;

    /*
       場上低於 8 時，
       才從庫存自動補回。
    */

    if (state.field < 8 && state.inventory > 0) {

        const need = 8 - state.field;

        const refill = Math.min(
            need,
            state.inventory
        );

        state.field += refill;
        state.inventory -= refill;
    }

    /*
       重要：
       收割不增加勇士戰令
       收割不增加黎明曙光
    */

    return {
        success: true
    };
}


/* =========================================================
   測試資料
   ========================================================= */

const tests = [];


function addTest(title, initialState, action, expected) {

    tests.push({
        title,
        initialState,
        action,
        expected
    });
}


/* =========================================================
   第 21～30 測試
   ========================================================= */


/* ---------------------------------------------------------
   21
   玩家完成一個未完成雷達

   場上10
   已完成2
   → 未完成8

   完成後：
   場上10
   已完成3
--------------------------------------------------------- */

addTest(
    "第二十一個測試：玩家完成一個未完成雷達",

    createState({
        field: 10,
        completed: 2
    }),

    state => completeRadar(state),

    {
        field: 10,
        completed: 3
    }
);


/* ---------------------------------------------------------
   22
   完成雷達不改變場上總數，也不改變庫存
--------------------------------------------------------- */

addTest(
    "第二十二個測試：完成雷達不改變場上總數與庫存",

    createState({
        field: 8,
        completed: 0,
        inventory: 15
    }),

    state => completeRadar(state),

    {
        field: 8,
        completed: 1,
        inventory: 15
    }
);


/* ---------------------------------------------------------
   23
   勇士戰令啟用

   17/20
   完成一次
   → 18/20
--------------------------------------------------------- */

addTest(
    "第二十三個測試：完成雷達增加勇士戰令",

    createState({
        field: 8,
        completed: 0,

        warriorPassEnabled: true,
        warriorTarget: 20,
        warriorProgress: 17
    }),

    state => completeRadar(state),

    {
        completed: 1,
        warriorProgress: 18
    }
);


/* ---------------------------------------------------------
   24
   黎明曙光啟用

   5/10
   完成一次
   → 6/10
--------------------------------------------------------- */

addTest(
    "第二十四個測試：完成雷達增加黎明曙光",

    createState({
        field: 8,
        completed: 0,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 5
    }),

    state => completeRadar(state),

    {
        completed: 1,
        dawnProgress: 6
    }
);


/* ---------------------------------------------------------
   25
   兩個任務同時啟用

   一次完成事件
   → 勇士戰令 +1
   → 黎明曙光 +1
--------------------------------------------------------- */

addTest(
    "第二十五個測試：一次完成同時增加兩個任務",

    createState({
        field: 8,
        completed: 0,

        warriorPassEnabled: true,
        warriorTarget: 20,
        warriorProgress: 10,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 5
    }),

    state => completeRadar(state),

    {
        completed: 1,
        warriorProgress: 11,
        dawnProgress: 6
    }
);


/* ---------------------------------------------------------
   26
   勇士戰令已經 20/20

   再完成雷達：
   顯示仍然 20/20
--------------------------------------------------------- */

addTest(
    "第二十六個測試：勇士戰令達標後進度封頂",

    createState({
        field: 8,
        completed: 0,

        warriorPassEnabled: true,
        warriorTarget: 20,
        warriorProgress: 20
    }),

    state => completeRadar(state),

    {
        completed: 1,
        warriorProgress: 20
    }
);


/* ---------------------------------------------------------
   27
   黎明曙光已經 10/10

   再完成雷達：
   仍然 10/10
--------------------------------------------------------- */

addTest(
    "第二十七個測試：黎明曙光達標後進度封頂",

    createState({
        field: 8,
        completed: 0,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 10
    }),

    state => completeRadar(state),

    {
        completed: 1,
        dawnProgress: 10
    }
);


/* ---------------------------------------------------------
   28
   盟友瞬間幫助

   未完成 → 已完成

   任務也 +1
--------------------------------------------------------- */

addTest(
    "第二十八個測試：盟友瞬間幫助視為完成事件",

    createState({
        field: 11,
        completed: 2,

        warriorPassEnabled: true,
        warriorTarget: 20,
        warriorProgress: 17,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 5
    }),

    state => allyInstantHelp(state),

    {
        field: 11,
        completed: 3,
        warriorProgress: 18,
        dawnProgress: 6
    }
);


/* ---------------------------------------------------------
   29
   收割不增加任務進度

   勇士戰令 17/20
   黎明曙光 5/10

   收割已完成雷達
   → 任務都不變
--------------------------------------------------------- */

addTest(
    "第二十九個測試：收割不增加勇士戰令與黎明曙光",

    createState({
        field: 8,
        completed: 1,
        inventory: 5,

        warriorPassEnabled: true,
        warriorTarget: 20,
        warriorProgress: 17,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 5
    }),

    state => harvestRadar(state),

    {
        field: 8,
        completed: 0,
        inventory: 4,
        warriorProgress: 17,
        dawnProgress: 5
    }
);


/* ---------------------------------------------------------
   30
   完成事件不會觸發自動補回

   場上8
   庫存20

   完成一個未完成雷達：
   場上仍然8
   庫存仍然20
--------------------------------------------------------- */

addTest(
    "第三十個測試：完成雷達不觸發庫存自動補回",

    createState({
        field: 8,
        completed: 0,
        inventory: 20
    }),

    state => completeRadar(state),

    {
        field: 8,
        completed: 1,
        inventory: 20
    }
);


/* =========================================================
   執行測試
   ========================================================= */

function runTest(test) {

    const state = JSON.parse(
        JSON.stringify(test.initialState)
    );

    let actionResult = null;

    try {

        actionResult = test.action(state);

    } catch (error) {

        return {
            pass: false,
            state,
            error: error.message
        };
    }

    let pass = true;

    for (const key in test.expected) {

        if (state[key] !== test.expected[key]) {
            pass = false;
        }
    }

    return {
        pass,
        state,
        actionResult
    };
}


/* =========================================================
   顯示
   ========================================================= */

function renderTests() {

    const container = document.getElementById("tests");

    container.innerHTML = "";

    tests.forEach((test, index) => {

        const box = document.createElement("div");

        box.className = "test";

        box.innerHTML = `
            <h2>${test.title}</h2>

            <div class="state">
                <strong>初始狀態：</strong><br>

                場上：${test.initialState.field}<br>

                已完成：${test.initialState.completed}<br>

                庫存：${test.initialState.inventory}<br>

                勇士戰令：
                ${
                    test.initialState.warriorPassEnabled
                    ? test.initialState.warriorProgress
                      + "/"
                      + test.initialState.warriorTarget
                    : "未啟用"
                }<br>

                黎明曙光：
                ${
                    test.initialState.dawnEnabled
                    ? test.initialState.dawnProgress
                      + "/"
                      + test.initialState.dawnTarget
                    : "未啟用"
                }
            </div>

            <button onclick="executeSingleTest(${index})">
                執行測試
            </button>

            <div
                class="result"
                id="result-${index}"
            >
                尚未執行測試
            </div>
        `;

        container.appendChild(box);
    });
}


/* =========================================================
   執行單項
   ========================================================= */

function executeSingleTest(index) {

    const test = tests[index];

    const result = runTest(test);

    const el =
        document.getElementById(
            `result-${index}`
        );

    el.dataset.executed = "true";

    el.dataset.pass =
        result.pass ? "true" : "false";


    if (result.pass) {

        el.innerHTML = `
            <strong>測試結果</strong><br><br>

            場上：${result.state.field}<br>

            已完成：${result.state.completed}<br>

            庫存：${result.state.inventory}<br>

            勇士戰令：
            ${
                result.state.warriorPassEnabled
                ? result.state.warriorProgress
                  + "/"
                  + result.state.warriorTarget
                : "未啟用"
            }<br>

            黎明曙光：
            ${
                result.state.dawnEnabled
                ? result.state.dawnProgress
                  + "/"
                  + result.state.dawnTarget
                : "未啟用"
            }

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>
        `;

    } else {

        el.innerHTML = `
            <strong>測試結果</strong><br><br>

            場上：${result.state.field}<br>

            已完成：${result.state.completed}<br>

            庫存：${result.state.inventory}<br>

            <br>

            <span class="fail">
                ❌ 測試失敗
            </span>
        `;
    }

    updateSummary();
}


/* =========================================================
   更新總進度
   ========================================================= */

function updateSummary() {

    let executed = 0;
    let passed = 0;
    let failed = 0;

    tests.forEach((_, index) => {

        const el =
            document.getElementById(
                `result-${index}`
            );

        if (!el.dataset.executed) {
            return;
        }

        executed++;

        if (el.dataset.pass === "true") {
            passed++;
        } else {
            failed++;
        }
    });


    document.getElementById("summary").innerHTML = `
        <strong>目前測試進度</strong><br><br>

        已執行：${executed} 個<br>

        <span class="pass">
            ✅ 通過：${passed} 個
        </span><br>

        <span class="fail">
            ❌ 失敗：${failed} 個
        </span>
    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
