<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雷達規則引擎測試 51-60</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #d98224;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;

    padding: 12px;

    border-radius: 10px;

    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;

    padding: 16px;

    margin-top: 24px;
    margin-bottom: 30px;
}

</style>
</head>


<body>

<div class="container">

<h1>雷達規則引擎測試 51～60</h1>

<div class="subtitle">
最後一批核心交互規則：完成、任務、收割
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>


/* =========================================================
   建立狀態
   ========================================================= */

function createState(options = {}) {

    return {

        field:
            options.field ?? 0,

        completed:
            options.completed ?? 0,

        inventory:
            options.inventory ?? 0,

        maxInventory:
            options.maxInventory ?? 30,


        lauraStar:
            options.lauraStar ?? 5,

        treasure:
            options.treasure ?? 0,


        warriorEnabled:
            options.warriorEnabled ?? false,

        warriorTarget:
            options.warriorTarget ?? 0,

        warriorProgress:
            options.warriorProgress ?? 0,


        dawnEnabled:
            options.dawnEnabled ?? false,

        dawnTarget:
            options.dawnTarget ?? 0,

        dawnProgress:
            options.dawnProgress ?? 0
    };
}


/* =========================================================
   完成一個未完成雷達
   ========================================================= */

function completeRadar(state) {

    const unfinished =
        state.field - state.completed;


    if (unfinished <= 0) {
        return false;
    }


    /*
       未完成 → 已完成

       場上總數不變
       已完成 +1
    */

    state.completed++;


    /*
       勇士戰令
    */

    if (state.warriorEnabled) {

        state.warriorProgress =
            Math.min(
                state.warriorTarget,
                state.warriorProgress + 1
            );
    }


    /*
       黎明曙光
    */

    if (state.dawnEnabled) {

        state.dawnProgress =
            Math.min(
                state.dawnTarget,
                state.dawnProgress + 1
            );
    }


    /*
       寶箱不增加
    */

    return true;
}


/* =========================================================
   收割一個已完成雷達
   ========================================================= */

function harvestRadar(state) {

    if (state.completed <= 0) {
        return false;
    }


    state.completed--;
    state.field--;


    /*
       5 星 Laura：
       收割 → 寶箱 +1
       每日最多 10
    */

    if (state.lauraStar === 5) {

        state.treasure =
            Math.min(
                10,
                state.treasure + 1
            );
    }


    /*
       場上 < 8：
       從庫存自動補場
    */

    if (
        state.field < 8 &&
        state.inventory > 0
    ) {

        const need =
            8 - state.field;

        const refill =
            Math.min(
                need,
                state.inventory
            );

        state.field += refill;
        state.inventory -= refill;
    }


    return true;
}


/* =========================================================
   測試工具
   ========================================================= */

const tests = [];


function addTest(
    title,
    initial,
    expected,
    action
) {

    tests.push({
        title,
        initial,
        expected,
        action
    });

}


/* =========================================================
   51
   完成一個雷達：
   場上不變
   已完成 +1
   ========================================================= */

addTest(

    "第五十一個測試：完成雷達不改變場上總數",

    createState({

        field: 8,
        completed: 0,
        inventory: 0,

        warriorEnabled: false,
        dawnEnabled: false
    }),

    {
        field: 8,
        completed: 1
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   52
   勇士戰令啟用：
   完成 1 個
   → 任務 +1
   ========================================================= */

addTest(

    "第五十二個測試：完成雷達增加勇士戰令進度",

    createState({

        field: 8,
        completed: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 5,

        dawnEnabled: false
    }),

    {
        warriorProgress: 6
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   53
   黎明曙光啟用：
   完成 1 個
   → 任務 +1
   ========================================================= */

addTest(

    "第五十三個測試：完成雷達增加黎明曙光進度",

    createState({

        field: 8,
        completed: 0,

        warriorEnabled: false,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 4
    }),

    {
        dawnProgress: 5
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   54
   兩個任務同時啟用：

   完成一個雷達
   → 勇士 +1
   → 黎明 +1
   ========================================================= */

addTest(

    "第五十四個測試：一次完成同時增加兩個任務",

    createState({

        field: 8,
        completed: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 7,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 3
    }),

    {
        warriorProgress: 8,
        dawnProgress: 4
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   55
   勇士戰令已經 20/20：

   再完成雷達
   → 不變成 21
   → 維持 20
   ========================================================= */

addTest(

    "第五十五個測試：勇士戰令達標後進度封頂",

    createState({

        field: 8,
        completed: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 20,

        dawnEnabled: false
    }),

    {
        warriorProgress: 20
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   56
   黎明曙光已經 10/10：

   再完成雷達
   → 維持 10
   ========================================================= */

addTest(

    "第五十六個測試：黎明曙光達標後進度封頂",

    createState({

        field: 8,
        completed: 0,

        warriorEnabled: false,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 10
    }),

    {
        dawnProgress: 10
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   57
   已完成雷達不能再次完成

   場上 8
   已完成 8
   → 沒有未完成雷達

   執行完成
   → 已完成仍為 8
   ========================================================= */

addTest(

    "第五十七個測試：已完成雷達不能再次完成",

    createState({

        field: 8,
        completed: 8,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 5,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 4
    }),

    {
        completed: 8,
        warriorProgress: 5,
        dawnProgress: 4
    },

    state => {

        completeRadar(state);

        return state;
    }
);


/* =========================================================
   58
   收割不增加勇士戰令

   3 個已完成
   勇士 7/20

   收割 1
   → 勇士仍 7
   ========================================================= */

addTest(

    "第五十八個測試：收割不增加勇士戰令",

    createState({

        field: 8,
        completed: 3,
        inventory: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 7,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 4
    }),

    {
        field: 7,
        completed: 2,
        warriorProgress: 7,
        dawnProgress: 4
    },

    state => {

        harvestRadar(state);

        return state;
    }
);


/* =========================================================
   59
   收割不增加黎明曙光

   3 個已完成
   黎明 6/10

   收割 1
   → 黎明仍 6
   ========================================================= */

addTest(

    "第五十九個測試：收割不增加黎明曙光",

    createState({

        field: 8,
        completed: 3,
        inventory: 0,

        warriorEnabled: false,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 6
    }),

    {
        field: 7,
        completed: 2,
        dawnProgress: 6
    },

    state => {

        harvestRadar(state);

        return state;
    }
);


/* =========================================================
   60
   完成與收割是兩個不同事件

   初始：
   場上 8
   已完成 0
   勇士 5/20
   黎明 3/10
   寶箱 0/10

   第一步：完成 1
   → 已完成 1
   → 勇士 6
   → 黎明 4
   → 寶箱 0

   第二步：收割 1
   → 已完成 0
   → 勇士仍 6
   → 黎明仍 4
   → 5星 Laura 寶箱 1
   ========================================================= */

addTest(

    "第六十個測試：完成與收割的完整事件分離",

    createState({

        field: 8,
        completed: 0,
        inventory: 0,

        lauraStar: 5,
        treasure: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 5,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 3
    }),

    {
        field: 8,
        completed: 0,

        warriorProgress: 6,
        dawnProgress: 4,

        treasure: 1
    },

    state => {

        /* 完成 */
        completeRadar(state);

        /* 收割 */
        harvestRadar(state);

        return state;
    }
);


/* =========================================================
   執行測試
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


/* =========================================================
   比對
   ========================================================= */

function checkExpected(
    actual,
    expected
) {

    for (const key in expected) {

        if (
            actual[key] !==
            expected[key]
        ) {

            return false;
        }
    }

    return true;
}


/* =========================================================
   執行單一測試
   ========================================================= */

function runTest(index) {

    const test = tests[index];


    const state =
        JSON.parse(
            JSON.stringify(
                test.initial
            )
        );


    let error = null;


    try {

        test.action(state);

    } catch (e) {

        error = e;
    }


    const success =
        !error &&
        checkExpected(
            state,
            test.expected
        );


    executed++;


    if (success) {

        passed++;

    } else {

        failed++;
    }


    const result =
        document.getElementById(
            `result-${index}`
        );


    if (success) {

        result.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            場上：
            ${state.field}

            <br>

            已完成：
            ${state.completed}

            <br>

            勇士戰令：
            ${state.warriorProgress}/${state.warriorTarget}

            <br>

            黎明曙光：
            ${state.dawnProgress}/${state.dawnTarget}

            <br>

            寶箱：
            ${state.treasure}/10

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>

        `;

    } else {

        result.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            ${
                error
                ? `
                    <span class="fail">
                        ❌ 程式錯誤
                    </span>

                    <br>

                    ${error.message}
                `
                : `
                    <span class="fail">
                        ❌ 測試失敗
                    </span>

                    <br><br>

                    實際：

                    <br>

                    場上：
                    ${state.field}

                    <br>

                    已完成：
                    ${state.completed}

                    <br>

                    勇士：
                    ${state.warriorProgress}/${state.warriorTarget}

                    <br>

                    黎明：
                    ${state.dawnProgress}/${state.dawnTarget}

                    <br>

                    寶箱：
                    ${state.treasure}/10
                `
            }

        `;
    }


    updateSummary();
}


/* =========================================================
   建立測試畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById(
            "tests"
        );


    tests.forEach(
        (test, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "test";


            div.innerHTML = `

                <div class="test-title">

                    ${test.title}

                </div>


                <div class="state">

                    <strong>
                        初始狀態
                    </strong>

                    <br>

                    場上：
                    ${test.initial.field}

                    <br>

                    已完成：
                    ${test.initial.completed}

                    <br>

                    庫存：
                    ${test.initial.inventory}

                    <br>

                    勇士戰令：
                    ${
                        test.initial.warriorProgress
                    } /
                    ${
                        test.initial.warriorTarget
                    }

                    <br>

                    黎明曙光：
                    ${
                        test.initial.dawnProgress
                    } /
                    ${
                        test.initial.dawnTarget
                    }

                    <br>

                    寶箱：
                    ${test.initial.treasure}/10

                </div>


                <button
                    onclick="runTest(${index})"
                >
                    執行測試
                </button>


                <div
                    class="result"
                    id="result-${index}"
                >

                    尚未執行

                </div>

            `;


            container.appendChild(div);
        }
    );
}


/* =========================================================
   更新總結
   ========================================================= */

function updateSummary() {

    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            目前測試進度
        </strong>

        <br><br>

        已執行：
        ${executed} 個

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed} 個
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed} 個
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
