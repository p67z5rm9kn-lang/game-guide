<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雷達規則引擎測試 41-50</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #d98224;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;

    padding: 12px;

    border-radius: 10px;

    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;

    padding: 16px;

    margin-top: 24px;
    margin-bottom: 30px;
}

.valid {
    color: #4ade80;
}

.invalid {
    color: #f87171;
}

</style>
</head>


<body>

<div class="container">

<h1>雷達規則引擎測試 41～50</h1>

<div class="subtitle">
本批測試：輸入驗證、邊界值、資料正規化
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>


/* =========================================================
   輸入驗證
   ========================================================= */

function validateInput(data) {

    const errors = [];


    /* -----------------------------------------------------
       庫存
       ----------------------------------------------------- */

    if (data.inventory < 0) {
        errors.push("庫存不能小於 0");
    }


    /* -----------------------------------------------------
       庫存 MAX
       ----------------------------------------------------- */

    if (data.maxInventory <= 0) {
        errors.push("庫存上限 MAX 必須大於 0");
    }


    /* -----------------------------------------------------
       場上
       ----------------------------------------------------- */

    if (data.field < 0) {
        errors.push("場上雷達總數不能小於 0");
    }


    /* -----------------------------------------------------
       已完成
       ----------------------------------------------------- */

    if (data.completed < 0) {
        errors.push("已完成雷達不能小於 0");
    }


    if (data.completed > data.field) {
        errors.push("已完成雷達不能大於場上雷達總數");
    }


    /* -----------------------------------------------------
       寶箱
       ----------------------------------------------------- */

    if (data.treasure < 0) {
        errors.push("寶箱進度不能小於 0");
    }


    /* -----------------------------------------------------
       勇士戰令
       ----------------------------------------------------- */

    if (data.warriorEnabled) {

        if (data.warriorTarget < 0) {
            errors.push("勇士戰令目標不能小於 0");
        }

        if (data.warriorProgress < 0) {
            errors.push("勇士戰令目前進度不能小於 0");
        }
    }


    /* -----------------------------------------------------
       黎明曙光
       ----------------------------------------------------- */

    if (data.dawnEnabled) {

        if (data.dawnTarget < 0) {
            errors.push("黎明曙光目標不能小於 0");
        }

        if (data.dawnProgress < 0) {
            errors.push("黎明曙光目前進度不能小於 0");
        }
    }


    return {
        valid: errors.length === 0,
        errors
    };
}


/* =========================================================
   資料正規化
   ========================================================= */

function normalizeInput(data) {

    const result =
        JSON.parse(
            JSON.stringify(data)
        );


    /* -----------------------------------------------------
       寶箱 > 10
       → 10
       ----------------------------------------------------- */

    if (result.treasure > 10) {
        result.treasure = 10;
    }


    /* -----------------------------------------------------
       任務進度超過目標
       → 視為已完成
       → 顯示封頂於目標
       ----------------------------------------------------- */

    if (
        result.warriorEnabled &&
        result.warriorProgress >= result.warriorTarget
    ) {

        result.warriorProgress =
            result.warriorTarget;
    }


    if (
        result.dawnEnabled &&
        result.dawnProgress >= result.dawnTarget
    ) {

        result.dawnProgress =
            result.dawnTarget;
    }


    return result;
}


/* =========================================================
   建立測試資料
   ========================================================= */

function createData(options = {}) {

    return {

        field:
            options.field ?? 0,

        completed:
            options.completed ?? 0,

        inventory:
            options.inventory ?? 0,

        maxInventory:
            options.maxInventory ?? 30,


        treasure:
            options.treasure ?? 0,


        warriorEnabled:
            options.warriorEnabled ?? false,

        warriorTarget:
            options.warriorTarget ?? 0,

        warriorProgress:
            options.warriorProgress ?? 0,


        dawnEnabled:
            options.dawnEnabled ?? false,

        dawnTarget:
            options.dawnTarget ?? 0,

        dawnProgress:
            options.dawnProgress ?? 0
    };
}


/* =========================================================
   測試工具
   ========================================================= */

const tests = [];


function addTest(
    title,
    initial,
    expected
) {

    tests.push({
        title,
        initial,
        expected
    });

}


/* =========================================================
   41
   場上 0 / 已完成 0
   應該是有效資料
   ========================================================= */

addTest(

    "第四十一個測試：場上0、已完成0為有效資料",

    createData({
        field: 0,
        completed: 0,
        inventory: 0,
        maxInventory: 30
    }),

    {
        valid: true
    }
);


/* =========================================================
   42
   場上有雷達
   已完成 0
   → 有效
   ========================================================= */

addTest(

    "第四十二個測試：場上有雷達、已完成0為有效資料",

    createData({
        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30
    }),

    {
        valid: true
    }
);


/* =========================================================
   43
   任務目標 = 0
   → 有效
   ========================================================= */

addTest(

    "第四十三個測試：每日任務目標0為有效資料",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30,

        warriorEnabled: true,
        warriorTarget: 0,
        warriorProgress: 0
    }),

    {
        valid: true
    }
);


/* =========================================================
   44
   勇士戰令：
   目前進度 25/20
   → 正規化成 20/20
   ========================================================= */

addTest(

    "第四十四個測試：任務進度超過目標時封頂",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 25
    }),

    {
        warriorProgress: 20
    }
);


/* =========================================================
   45
   寶箱：
   15/10
   → 10/10
   ========================================================= */

addTest(

    "第四十五個測試：寶箱超過10時封頂",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30,

        treasure: 15
    }),

    {
        treasure: 10
    }
);


/* =========================================================
   46
   寶箱 -1
   → 無效
   ========================================================= */

addTest(

    "第四十六個測試：寶箱負數為無效資料",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30,

        treasure: -1
    }),

    {
        valid: false
    }
);


/* =========================================================
   47
   MAX = 0
   → 無效
   ========================================================= */

addTest(

    "第四十七個測試：庫存MAX等於0為無效資料",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 0
    }),

    {
        valid: false
    }
);


/* =========================================================
   48
   場上 = -1
   → 無效
   ========================================================= */

addTest(

    "第四十八個測試：場上雷達負數為無效資料",

    createData({

        field: -1,
        completed: 0,
        inventory: 0,
        maxInventory: 30
    }),

    {
        valid: false
    }
);


/* =========================================================
   49
   已完成 > 場上
   → 無效
   ========================================================= */

addTest(

    "第四十九個測試：已完成不能大於場上總數",

    createData({

        field: 5,
        completed: 6,
        inventory: 0,
        maxInventory: 30
    }),

    {
        valid: false
    }
);


/* =========================================================
   50
   任務未啟用
   即使裡面的目標/進度數值異常
   也不應阻擋

   注意：
   這裡測的是「未啟用任務不參與驗證」
   ========================================================= */

addTest(

    "第五十個測試：未啟用的每日任務不阻擋",

    createData({

        field: 8,
        completed: 0,
        inventory: 0,
        maxInventory: 30,

        warriorEnabled: false,
        warriorTarget: -5,
        warriorProgress: -10,

        dawnEnabled: false,
        dawnTarget: -3,
        dawnProgress: -7
    }),

    {
        valid: true
    }
);


/* =========================================================
   執行測試
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


/* =========================================================
   測試執行
   ========================================================= */

function runTest(index) {

    const test = tests[index];

    let resultData;
    let error = null;

    try {

        const validation =
            validateInput(test.initial);

        const normalized =
            normalizeInput(test.initial);


        resultData = {

            valid:
                validation.valid,

            errors:
                validation.errors,

            normalized
        };

    } catch (e) {

        error = e;
    }


    let success = false;


    if (!error) {

        if (
            test.expected.valid !== undefined
        ) {

            success =
                resultData.valid ===
                test.expected.valid;

        } else {

            success = true;

            for (
                const key in test.expected
            ) {

                if (
                    resultData.normalized[key]
                    !==
                    test.expected[key]
                ) {

                    success = false;
                    break;
                }
            }
        }
    }


    executed++;


    if (success) {
        passed++;
    } else {
        failed++;
    }


    const result =
        document.getElementById(
            `result-${index}`
        );


    if (success) {

        result.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            ${
                resultData.valid
                ? "資料有效"
                : "資料無效"
            }

            <br><br>

            ${
                test.expected.valid !== undefined
                ? `
                    預期：
                    ${
                        test.expected.valid
                        ? "有效"
                        : "無效"
                    }
                `
                : `
                    正規化後：

                    <br>

                    寶箱：
                    ${resultData.normalized.treasure}/10

                    <br>

                    勇士戰令：
                    ${
                        resultData.normalized.warriorProgress
                    } /
                    ${
                        resultData.normalized.warriorTarget
                    }

                    <br>

                    黎明曙光：
                    ${
                        resultData.normalized.dawnProgress
                    } /
                    ${
                        resultData.normalized.dawnTarget
                    }
                `
            }

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>
        `;

    } else {

        result.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            ${
                error
                ? `
                    <span class="fail">
                        ❌ 程式錯誤
                    </span>

                    <br>

                    ${error.message}
                `
                : `
                    <span class="fail">
                        ❌ 測試失敗
                    </span>

                    <br><br>

                    實際：

                    <br>

                    ${
                        resultData.valid
                        ? "資料有效"
                        : "資料無效"
                    }

                    <br><br>

                    ${
                        resultData.errors.length
                        ? resultData.errors.join("<br>")
                        : ""
                    }
                `
            }
        `;
    }


    updateSummary();
}


/* =========================================================
   建立畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById("tests");


    tests.forEach(
        (test, index) => {

            const div =
                document.createElement("div");

            div.className = "test";


            div.innerHTML = `

                <div class="test-title">

                    ${test.title}

                </div>


                <div class="state">

                    <strong>測試資料</strong>

                    <br>

                    場上：
                    ${test.initial.field}

                    <br>

                    已完成：
                    ${test.initial.completed}

                    <br>

                    庫存：
                    ${test.initial.inventory}

                    <br>

                    MAX：
                    ${test.initial.maxInventory}

                    <br>

                    寶箱：
                    ${test.initial.treasure}/10

                </div>


                <button
                    onclick="runTest(${index})"
                >
                    執行測試
                </button>


                <div
                    class="result"
                    id="result-${index}"
                >

                    尚未執行

                </div>
            `;


            container.appendChild(div);
        }
    );
}


/* =========================================================
   更新總結
   ========================================================= */

function updateSummary() {

    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            目前測試進度
        </strong>

        <br><br>

        已執行：
        ${executed} 個

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed} 個
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed} 個
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
