<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷達規則引擎測試 31-40</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #111827;
    color: #f9fafb;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;
    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #d98224;
    color: white;
    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    margin-bottom: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>雷達規則引擎測試 31～40</h1>

<div class="subtitle">
本批測試：寶箱、每日重置、10:00 換日
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>

/* =========================================================
   雷達規則引擎
   第 31～40 測試
   ========================================================= */


/* =========================================================
   建立狀態
   ========================================================= */

function createState({
    field = 0,
    completed = 0,
    inventory = 0,
    maxInventory = 30,

    lauraStar = 5,
    lauraUsed = false,

    treasure = 0,

    warriorEnabled = false,
    warriorTarget = 0,
    warriorProgress = 0,

    dawnEnabled = false,
    dawnTarget = 0,
    dawnProgress = 0

} = {}) {

    return {
        field,
        completed,
        inventory,
        maxInventory,

        lauraStar,
        lauraUsed,

        treasure,

        warriorEnabled,
        warriorTarget,
        warriorProgress,

        dawnEnabled,
        dawnTarget,
        dawnProgress
    };
}


/* =========================================================
   收割
   ========================================================= */

function harvestRadar(state) {

    if (state.completed <= 0) {
        return false;
    }

    state.completed--;
    state.field--;

    /*
       5 星 Laura：
       每收割一個已完成雷達
       寶箱 +1

       每日最多 10/10
    */

    if (state.lauraStar === 5) {

        state.treasure =
            Math.min(
                10,
                state.treasure + 1
            );
    }


    /*
       收割後：
       如果場上 < 8 且庫存 > 0
       自動從庫存補回
    */

    if (
        state.field < 8 &&
        state.inventory > 0
    ) {

        const need = 8 - state.field;

        const refill =
            Math.min(
                need,
                state.inventory
            );

        state.field += refill;
        state.inventory -= refill;
    }

    return true;
}


/* =========================================================
   10:00 換日
   ========================================================= */

function rolloverAt10AM(state) {

    /*
       -----------------------------------------------------
       ① 未完成雷達消失
       -----------------------------------------------------

       本測試採用我們之前確認的模型假設：

       10:00 時：
       未完成雷達先消失
       再處理系統 +8
       -----------------------------------------------------
    */

    const unfinished =
        Math.max(
            0,
            state.field - state.completed
        );

    state.field -= unfinished;


    /*
       如果場上因此低於 8，
       庫存立即自動補回。
    */

    if (
        state.field < 8 &&
        state.inventory > 0
    ) {

        const need = 8 - state.field;

        const refill =
            Math.min(
                need,
                state.inventory
            );

        state.field += refill;
        state.inventory -= refill;
    }


    /*
       -----------------------------------------------------
       ② 新的一天開始
       -----------------------------------------------------
    */

    state.lauraUsed = false;

    state.treasure = 0;


    /*
       每日任務重置
    */

    if (state.warriorEnabled) {
        state.warriorProgress = 0;
    }

    if (state.dawnEnabled) {
        state.dawnProgress = 0;
    }


    /*
       -----------------------------------------------------
       ③ 新遊戲日的 00:00 系統 +8
       -----------------------------------------------------

       由於 10:00 就是新遊戲日 00:00，
       因此換日後立即處理一次系統 +8。

       系統 +8：
       先補場上到 8，
       剩餘進庫存，
       但庫存不能超過 MAX。
    */

    let generated = 8;


    if (state.field < 8) {

        const need = 8 - state.field;

        const toField =
            Math.min(
                generated,
                need
            );

        state.field += toField;
        generated -= toField;
    }


    if (generated > 0) {

        const space =
            Math.max(
                0,
                state.maxInventory - state.inventory
            );

        const toInventory =
            Math.min(
                generated,
                space
            );

        state.inventory += toInventory;
    }


    return state;
}


/* =========================================================
   測試工具
   ========================================================= */

const tests = [];


function addTest(
    title,
    initial,
    expected,
    action
) {

    tests.push({
        title,
        initial,
        expected,
        action
    });

}


/* =========================================================
   第 31～40 測試
   ========================================================= */


/* ---------------------------------------------------------
   31
   5 星 Laura：
   收割 1 個
   寶箱 0 → 1
   --------------------------------------------------------- */

addTest(
    "第三十一個測試：5星 Laura 收割增加寶箱",

    createState({
        field: 8,
        completed: 1,
        inventory: 0,
        treasure: 0,
        lauraStar: 5
    }),

    {
        field: 7,
        completed: 0,
        inventory: 0,
        treasure: 1
    },

    state => {
        harvestRadar(state);
        return state;
    }
);


/* ---------------------------------------------------------
   32
   5 星 Laura：
   寶箱 9/10
   收割 2 個
   → 10/10
   --------------------------------------------------------- */

addTest(
    "第三十二個測試：寶箱最多 10/10",

    createState({
        field: 11,
        completed: 2,
        inventory: 0,
        treasure: 9,
        lauraStar: 5
    }),

    {
        field: 9,
        completed: 0,
        inventory: 0,
        treasure: 10
    },

    state => {
        harvestRadar(state);
        harvestRadar(state);
        return state;
    }
);


/* ---------------------------------------------------------
   33
   不是 5 星 Laura：
   收割不增加寶箱
   --------------------------------------------------------- */

addTest(
    "第三十三個測試：非5星 Laura 不增加寶箱",

    createState({
        field: 8,
        completed: 1,
        inventory: 0,
        treasure: 3,
        lauraStar: 4
    }),

    {
        field: 7,
        completed: 0,
        inventory: 0,
        treasure: 3
    },

    state => {
        harvestRadar(state);
        return state;
    }
);


/* ---------------------------------------------------------
   34
   5 星 Laura：
   沒有使用 Laura
   仍然可以透過收割取得寶箱
   --------------------------------------------------------- */

addTest(
    "第三十四個測試：不使用 Laura 也能取得寶箱",

    createState({
        field: 8,
        completed: 1,
        inventory: 0,
        treasure: 0,
        lauraStar: 5,
        lauraUsed: false
    }),

    {
        treasure: 1
    },

    state => {
        harvestRadar(state);
        return state;
    }
);


/* ---------------------------------------------------------
   35
   10:00：
   寶箱 10/10 → 0/10
   --------------------------------------------------------- */

addTest(
    "第三十五個測試：10:00 寶箱重置",

    createState({
        field: 0,
        completed: 0,
        inventory: 0,
        treasure: 10,
        maxInventory: 30
    }),

    {
        treasure: 0
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* ---------------------------------------------------------
   36
   10:00：
   Laura 已使用 → 新的一天恢復可使用
   --------------------------------------------------------- */

addTest(
    "第三十六個測試：10:00 Laura 使用狀態重置",

    createState({
        field: 0,
        completed: 0,
        inventory: 0,
        lauraUsed: true
    }),

    {
        lauraUsed: false
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* ---------------------------------------------------------
   37
   勇士戰令每日重置
   17/20 → 0
   --------------------------------------------------------- */

addTest(
    "第三十七個測試：勇士戰令每日重置",

    createState({
        field: 0,
        completed: 0,
        inventory: 0,

        warriorEnabled: true,
        warriorTarget: 20,
        warriorProgress: 17
    }),

    {
        warriorProgress: 0
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* ---------------------------------------------------------
   38
   黎明曙光每日重置
   8/10 → 0
   --------------------------------------------------------- */

addTest(
    "第三十八個測試：黎明曙光每日重置",

    createState({
        field: 0,
        completed: 0,
        inventory: 0,

        dawnEnabled: true,
        dawnTarget: 10,
        dawnProgress: 8
    }),

    {
        dawnProgress: 0
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* ---------------------------------------------------------
   39
   10:00 未完成雷達消失

   場上 11
   已完成 3
   未完成 8

   → 未完成消失
   → 場上剩已完成 3

   然後系統 +8：
   場上重新補到 8
   --------------------------------------------------------- */

addTest(
    "第三十九個測試：10:00 未完成雷達先消失，再系統 +8",

    createState({
        field: 11,
        completed: 3,
        inventory: 0,
        maxInventory: 30
    }),

    {
        field: 8,
        completed: 3,
        inventory: 3
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* ---------------------------------------------------------
   40
   10:00 未完成雷達消失後：

   場上 11
   已完成 3
   未完成 8

   庫存 10

   先消失 8：
   場上 3

   自動補場：
   從庫存補 5
   場上 8
   庫存 5

   然後系統 +8：
   場上已 8
   所以 +8 進庫存
   庫存 13
   --------------------------------------------------------- */

addTest(
    "第四十個測試：10:00 換日完整流程",

    createState({
        field: 11,
        completed: 3,
        inventory: 10,
        maxInventory: 30
    }),

    {
        field: 8,
        completed: 3,
        inventory: 13
    },

    state => {
        rolloverAt10AM(state);
        return state;
    }
);


/* =========================================================
   執行測試
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


function sameExpected(actual, expected) {

    for (const key in expected) {

        if (actual[key] !== expected[key]) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   建立測試畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById("tests");

    tests.forEach((test, index) => {

        const div =
            document.createElement("div");

        div.className = "test";

        div.innerHTML = `

            <div class="test-title">
                ${test.title}
            </div>

            <div class="state">

                <strong>初始狀態</strong>
                <br>

                場上：
                ${test.initial.field}

                <br>

                已完成：
                ${test.initial.completed}

                <br>

                庫存：
                ${test.initial.inventory}

                <br>

                寶箱：
                ${test.initial.treasure}/10

                <br>

                Laura：
                ${test.initial.lauraUsed ? "已使用" : "未使用"}

            </div>

            <button onclick="runTest(${index})">
                執行測試
            </button>

            <div
                class="result"
                id="result-${index}"
            >
                尚未執行
            </div>
        `;

        container.appendChild(div);
    });
}


/* =========================================================
   執行單一測試
   ========================================================= */

function runTest(index) {

    const test = tests[index];

    const state =
        JSON.parse(
            JSON.stringify(test.initial)
        );

    let error = null;

    try {

        test.action(state);

    } catch (e) {

        error = e;
    }


    const success =
        !error &&
        sameExpected(
            state,
            test.expected
        );


    executed++;

    if (success) {
        passed++;
    } else {
        failed++;
    }


    const result =
        document.getElementById(
            `result-${index}`
        );


    if (success) {

        result.innerHTML = `

            <strong>測試結果</strong>
            <br><br>

            場上：
            ${state.field}

            <br>

            已完成：
            ${state.completed}

            <br>

            庫存：
            ${state.inventory}

            <br>

            寶箱：
            ${state.treasure}/10

            <br>

            Laura：
            ${state.lauraUsed ? "已使用" : "未使用"}

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>
        `;

    } else {

        result.innerHTML = `

            <strong>測試結果</strong>
            <br><br>

            ${
                error
                ? `
                    <span class="fail">
                        ❌ 程式錯誤
                    </span>
                    <br>
                    ${error.message}
                `
                : `
                    <span class="fail">
                        ❌ 測試失敗
                    </span>
                `
            }

            <br><br>

            實際：
            場上 ${state.field}
            ／
            已完成 ${state.completed}
            ／
            庫存 ${state.inventory}
            ／
            寶箱 ${state.treasure}/10
        `;
    }


    updateSummary();
}


/* =========================================================
   更新進度
   ========================================================= */

function updateSummary() {

    document.getElementById("summary").innerHTML = `

        <strong>目前測試進度</strong>

        <br><br>

        已執行：
        ${executed} 個

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed} 個
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed} 個
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
