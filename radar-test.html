<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷達規則引擎測試</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
                 "PingFang TC", sans-serif;
    background: #111827;
    color: #f9fafb;
    padding: 20px;
    line-height: 1.6;
}

.card {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    background: #1f2937;
    border-radius: 16px;
}

h1 {
    font-size: 22px;
    margin-top: 0;
}

.test {
    background: #111827;
    padding: 16px;
    border-radius: 12px;
    margin-top: 16px;
}

.test h2 {
    font-size: 16px;
    margin-top: 0;
}

.state {
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    background: #d9821b;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.result {
    margin-top: 12px;
    padding: 14px;
    background: #111827;
    border-radius: 12px;
}

.pass {
    color: #22c55e;
    font-weight: bold;
}

.fail {
    color: #ef4444;
    font-weight: bold;
}

.summary {
    margin-top: 20px;
    padding: 14px;
    background: #111827;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="card">

<h1>雷達規則引擎測試</h1>

<div id="tests"></div>

<div class="summary" id="summary">
尚未執行測試
</div>

</div>

<script>

/* =========================================================
   雷達規則引擎 v1.0
   第 11～20 測試
   ========================================================= */


/* ---------------------------------------------------------
   建立狀態
--------------------------------------------------------- */

function createState({
    field = 0,
    completed = 0,
    inventory = 0,
    maxInventory = 30,
    lauraStar = 0,
    lauraUsed = false
} = {}) {

    return {
        field,
        completed,
        inventory,
        maxInventory,
        lauraStar,
        lauraUsed
    };
}


/* ---------------------------------------------------------
   Laura 雷達數量
--------------------------------------------------------- */

function getLauraRadar(star) {

    const radarMap = {
        0: 5,
        1: 10,
        2: 10,
        3: 10,
        4: 20,
        5: 20
    };

    return radarMap[star] ?? 0;
}


/* ---------------------------------------------------------
   將新雷達加入場上
--------------------------------------------------------- */

function addNewRadar(state, amount) {

    if (amount <= 0) return;

    /*
       新雷達進場規則：

       場上 < 8：
       先補到 8
       剩餘才進庫存

       場上 >= 8：
       新雷達直接：
       場上 +3
       剩餘進庫存
    */

    if (state.field < 8) {

        const need = 8 - state.field;
        const toField = Math.min(amount, need);

        state.field += toField;
        amount -= toField;

    } else {

        const toField = Math.min(amount, 3);

        state.field += toField;
        amount -= toField;
    }

    /*
       Laura 產生的雷達不受 MAX 限制。
       因此這裡直接加入庫存。
    */

    state.inventory += amount;
}


/* ---------------------------------------------------------
   使用 Laura
--------------------------------------------------------- */

function useLaura(state) {

    if (state.lauraUsed) {
        return {
            success: false,
            reason: "Laura 今日已使用"
        };
    }

    const amount = getLauraRadar(state.lauraStar);

    addNewRadar(state, amount);

    state.lauraUsed = true;

    return {
        success: true,
        amount
    };
}


/* ---------------------------------------------------------
   收割一個已完成雷達
--------------------------------------------------------- */

function harvestRadar(state) {

    if (state.completed <= 0) {
        return {
            success: false,
            reason: "沒有已完成雷達"
        };
    }

    state.completed--;
    state.field--;

    /*
       場上低於 8 時，
       庫存立即自動補回。
    */

    if (state.field < 8 && state.inventory > 0) {

        const need = 8 - state.field;
        const refill = Math.min(need, state.inventory);

        state.field += refill;
        state.inventory -= refill;
    }

    return {
        success: true
    };
}


/* ---------------------------------------------------------
   測試工具
--------------------------------------------------------- */

const tests = [];

function addTest(title, initialState, action, expected) {

    tests.push({
        title,
        initialState,
        action,
        expected
    });
}


/* =========================================================
   第 11～20 測試
   ========================================================= */


/* 11
   0 星 Laura
   場上 7
   庫存 0

   +5：
   場上先補到 8
   剩餘 4 進庫存
*/
addTest(
    "第十一個測試：Laura 0星｜場上不足8",
    createState({
        field: 7,
        inventory: 0,
        lauraStar: 0
    }),
    state => useLaura(state),
    {
        field: 8,
        inventory: 4
    }
);


/* 12
   0 星 Laura
   場上 8

   +5：
   場上 +3 → 11
   剩餘 2 進庫存
*/
addTest(
    "第十二個測試：Laura 0星｜場上8",
    createState({
        field: 8,
        inventory: 0,
        lauraStar: 0
    }),
    state => useLaura(state),
    {
        field: 11,
        inventory: 2
    }
);


/* 13
   4 星 Laura
   +20
   場上8

   場上 +3 → 11
   庫存 +17
*/
addTest(
    "第十三個測試：Laura 4星｜+20",
    createState({
        field: 8,
        inventory: 0,
        lauraStar: 4
    }),
    state => useLaura(state),
    {
        field: 11,
        inventory: 17
    }
);


/* 14
   4 星 Laura
   場上6

   +20：
   場上先補2到8
   剩餘18進庫存
*/
addTest(
    "第十四個測試：Laura 4星｜場上6",
    createState({
        field: 6,
        inventory: 0,
        lauraStar: 4
    }),
    state => useLaura(state),
    {
        field: 8,
        inventory: 18
    }
);


/* 15
   Laura 不受 MAX 限制

   場上8
   庫存25
   MAX30
   +20

   場上11
   庫存42
*/
addTest(
    "第十五個測試：Laura 可以突破庫存 MAX",
    createState({
        field: 8,
        inventory: 25,
        maxInventory: 30,
        lauraStar: 4
    }),
    state => useLaura(state),
    {
        field: 11,
        inventory: 42
    }
);


/* 16
   Laura 每日只能使用一次
*/
addTest(
    "第十六個測試：Laura 同一天不能使用第二次",
    createState({
        field: 8,
        inventory: 0,
        lauraStar: 4,
        lauraUsed: true
    }),
    state => useLaura(state),
    {
        field: 8,
        inventory: 0
    }
);


/* 17
   1 星 Laura
   +10
   場上8

   場上11
   庫存7
*/
addTest(
    "第十七個測試：Laura 1星｜+10",
    createState({
        field: 8,
        inventory: 0,
        lauraStar: 1
    }),
    state => useLaura(state),
    {
        field: 11,
        inventory: 7
    }
);


/* 18
   5 星 Laura
   +20
   場上8

   場上11
   庫存17

   寶箱目前還沒有加入本批測試。
*/
addTest(
    "第十八個測試：Laura 5星｜+20",
    createState({
        field: 8,
        inventory: 0,
        lauraStar: 5
    }),
    state => useLaura(state),
    {
        field: 11,
        inventory: 17
    }
);


/* 19
   收割一個完成雷達

   場上8
   已完成1
   庫存5

   收割後：
   場上7
   自動補1
   → 場上8
   庫存4
*/
addTest(
    "第十九個測試：收割後自動從庫存補回8",
    createState({
        field: 8,
        completed: 1,
        inventory: 5
    }),
    state => harvestRadar(state),
    {
        field: 8,
        inventory: 4,
        completed: 0
    }
);


/* 20
   收割一個完成雷達

   場上11
   已完成1
   庫存0

   收割後：
   場上10
   沒有庫存，所以不補
*/
addTest(
    "第二十個測試：場上11收割後變10",
    createState({
        field: 11,
        completed: 1,
        inventory: 0
    }),
    state => harvestRadar(state),
    {
        field: 10,
        inventory: 0,
        completed: 0
    }
);


/* =========================================================
   執行測試
   ========================================================= */

function runTest(test) {

    const state = JSON.parse(JSON.stringify(test.initialState));

    let actionResult = null;

    try {
        actionResult = test.action(state);
    } catch (error) {

        return {
            pass: false,
            state,
            error: error.message
        };
    }

    let pass = true;

    for (const key in test.expected) {

        if (state[key] !== test.expected[key]) {
            pass = false;
        }
    }

    return {
        pass,
        state,
        actionResult
    };
}


/* ---------------------------------------------------------
   顯示測試
--------------------------------------------------------- */

function renderTests() {

    const container = document.getElementById("tests");

    container.innerHTML = "";

    let passed = 0;
    let failed = 0;

    tests.forEach((test, index) => {

        const box = document.createElement("div");
        box.className = "test";

        box.innerHTML = `
            <h2>${test.title}</h2>

            <div class="state">
                <strong>初始狀態：</strong><br>
                場上：${test.initialState.field}<br>
                已完成：${test.initialState.completed}<br>
                庫存：${test.initialState.inventory}<br>
                庫存上限：${test.initialState.maxInventory}
            </div>

            <button onclick="executeSingleTest(${index})">
                執行測試
            </button>

            <div class="result" id="result-${index}">
                尚未執行測試
            </div>
        `;

        container.appendChild(box);
    });

    window.updateSummary = function() {

        const results = tests.map((_, index) => {

            const el = document.getElementById(`result-${index}`);

            return el && el.dataset.pass === "true";

        });

        const executed = results.filter(x => x !== undefined).length;

        /*
           重新統計畫面上的結果
        */

        let p = 0;
        let f = 0;

        tests.forEach((_, index) => {

            const el = document.getElementById(`result-${index}`);

            if (!el || !el.dataset.executed) return;

            if (el.dataset.pass === "true") {
                p++;
            } else {
                f++;
            }
        });

        document.getElementById("summary").innerHTML = `
            <strong>目前測試進度</strong><br><br>
            已執行：${p + f} 個<br>
            <span class="pass">✅ 通過：${p} 個</span><br>
            <span class="fail">❌ 失敗：${f} 個</span>
        `;
    };
}


/* ---------------------------------------------------------
   單項測試
--------------------------------------------------------- */

function executeSingleTest(index) {

    const test = tests[index];
    const result = runTest(test);

    const el = document.getElementById(`result-${index}`);

    el.dataset.executed = "true";
    el.dataset.pass = result.pass ? "true" : "false";

    if (result.pass) {

        el.innerHTML = `
            <strong>測試結果</strong><br><br>

            場上：${result.state.field}<br>
            已完成：${result.state.completed}<br>
            庫存：${result.state.inventory}<br>

            <br>
            <span class="pass">✅ 測試通過</span>
        `;

    } else {

        el.innerHTML = `
            <strong>測試結果</strong><br><br>

            場上：${result.state.field}<br>
            已完成：${result.state.completed}<br>
            庫存：${result.state.inventory}<br>

            <br>
            <span class="fail">❌ 測試失敗</span>
        `;
    }

    updateSummary();
}


/* ---------------------------------------------------------
   初始化
--------------------------------------------------------- */

renderTests();

</script>

</body>
</html>
