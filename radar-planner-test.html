<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雷達規劃器測試 - 衝分日判定</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #d98224;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    margin-bottom: 30px;
}

</style>
</head>


<body>

<div class="container">

<h1>雷達規劃器測試</h1>

<div class="subtitle">
第一階段：下一個衝分日判定
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>

/* =========================================================
   時間核心
   =========================================================

   重要：

   這裡「Date」只拿來儲存一組固定的日期時間數字。

   我們把 UTC 欄位直接當成「台灣時間欄位」使用，
   因此不會受到手機所在地區時區影響。

   規則：

   台灣時間 = 遊戲時間 + 10 小時
   遊戲時間 = 台灣時間 - 10 小時

   ========================================================= */


/* =========================================================
   星期名稱
   ========================================================= */

const weekdayNames = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
];


/* =========================================================
   建立「台灣時間」
   =========================================================

   注意：
   這裡的 Date UTC 欄位就是我們的台灣時間欄位。

   例如：

   taiwanDate(2026, 9, 28, 10, 0)

   代表：

   台灣 2026/09/28 10:00
   ========================================================= */

function taiwanDate(
    year,
    month,
    day,
    hour,
    minute = 0
) {

    return new Date(
        Date.UTC(
            year,
            month - 1,
            day,
            hour,
            minute,
            0,
            0
        )
    );
}


/* =========================================================
   建立「台灣時間的日期」
   ========================================================= */

function makeTaiwanDateFromDateParts(
    year,
    monthIndex,
    day,
    hour,
    minute = 0
) {

    return new Date(
        Date.UTC(
            year,
            monthIndex,
            day,
            hour,
            minute,
            0,
            0
        )
    );
}


/* =========================================================
   台灣時間 → 遊戲時間
   =========================================================

   遊戲時間比台灣時間慢 10 小時。

   例如：

   台灣 09/28 10:00
   ↓ -10 小時
   遊戲 09/28 00:00
   ========================================================= */

function toGameTime(taiwanTime) {

    return new Date(
        taiwanTime.getTime()
        -
        10 * 60 * 60 * 1000
    );
}


/* =========================================================
   格式化台灣時間
   ========================================================= */

function formatTaiwanTime(date) {

    const year =
        date.getUTCFullYear();

    const month =
        String(
            date.getUTCMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getUTCDate()
        ).padStart(2, "0");

    const hour =
        String(
            date.getUTCHours()
        ).padStart(2, "0");

    const minute =
        String(
            date.getUTCMinutes()
        ).padStart(2, "0");

    const weekday =
        weekdayNames[
            date.getUTCDay()
        ];

    return `${year}/${month}/${day}（${weekday}）${hour}:${minute}`;
}


/* =========================================================
   格式化遊戲時間
   ========================================================= */

function formatGameTime(date) {

    const year =
        date.getUTCFullYear();

    const month =
        String(
            date.getUTCMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getUTCDate()
        ).padStart(2, "0");

    const hour =
        String(
            date.getUTCHours()
        ).padStart(2, "0");

    const minute =
        String(
            date.getUTCMinutes()
        ).padStart(2, "0");

    const weekday =
        weekdayNames[
            date.getUTCDay()
        ];

    return `${year}/${month}/${day}（${weekday}）${hour}:${minute}`;
}


/* =========================================================
   判斷是否已經到 10:00
   ========================================================= */

function isAtOrAfter1000(taiwanTime) {

    const hour =
        taiwanTime.getUTCHours();

    const minute =
        taiwanTime.getUTCMinutes();

    return (
        hour > 10
        ||
        (
            hour === 10
            &&
            minute >= 0
        )
    );
}


/* =========================================================
   取得「下一個衝分日」
   =========================================================

   規則：

   週一：
       10:00 前
       → 今天 10:00，準備日

       10:00 後
       → 今天就是衝分日

   週五：
       10:00 前
       → 今天 10:00，準備日

       10:00 後
       → 今天就是衝分日

   週二～週四：
       → 下一個週五 10:00

   週六～週日：
       → 下一個週一 10:00

   ========================================================= */

function getScoringDayInfo(taiwanTime) {

    const weekday =
        taiwanTime.getUTCDay();


    const after10 =
        isAtOrAfter1000(
            taiwanTime
        );


    let target;


    /* -----------------------------------------------------
       週一
       ----------------------------------------------------- */

    if (weekday === 1) {

        target =
            makeTaiwanDateFromDateParts(
                taiwanTime.getUTCFullYear(),
                taiwanTime.getUTCMonth(),
                taiwanTime.getUTCDate(),
                10,
                0
            );


        if (after10) {

            return {
                mode: "scoring",
                target
            };

        }


        return {
            mode: "prepare",
            target
        };
    }


    /* -----------------------------------------------------
       週五
       ----------------------------------------------------- */

    if (weekday === 5) {

        target =
            makeTaiwanDateFromDateParts(
                taiwanTime.getUTCFullYear(),
                taiwanTime.getUTCMonth(),
                taiwanTime.getUTCDate(),
                10,
                0
            );


        if (after10) {

            return {
                mode: "scoring",
                target
            };

        }


        return {
            mode: "prepare",
            target
        };
    }


    /* -----------------------------------------------------
       週二～週四
       → 下一個週五
       ----------------------------------------------------- */

    if (
        weekday === 2
        ||
        weekday === 3
        ||
        weekday === 4
    ) {

        const daysUntilFriday =
            5 - weekday;


        target =
            makeTaiwanDateFromDateParts(
                taiwanTime.getUTCFullYear(),
                taiwanTime.getUTCMonth(),
                taiwanTime.getUTCDate()
                    +
                    daysUntilFriday,
                10,
                0
            );


        return {
            mode: "prepare",
            target
        };
    }


    /* -----------------------------------------------------
       週六
       → 下一個週一
       ----------------------------------------------------- */

    if (weekday === 6) {

        target =
            makeTaiwanDateFromDateParts(
                taiwanTime.getUTCFullYear(),
                taiwanTime.getUTCMonth(),
                taiwanTime.getUTCDate()
                    +
                    2,
                10,
                0
            );


        return {
            mode: "prepare",
            target
        };
    }


    /* -----------------------------------------------------
       週日
       → 明天週一
       ----------------------------------------------------- */

    if (weekday === 0) {

        target =
            makeTaiwanDateFromDateParts(
                taiwanTime.getUTCFullYear(),
                taiwanTime.getUTCMonth(),
                taiwanTime.getUTCDate()
                    +
                    1,
                10,
                0
            );


        return {
            mode: "prepare",
            target
        };
    }

}


/* =========================================================
   測試資料
   ========================================================= */

const tests = [];


function addTest(
    title,
    input,
    expected
) {

    tests.push({
        title,
        input,
        expected
    });

}


/* =========================================================
   測試 A
   週一 09:00
   → 今天 10:00
   ========================================================= */

addTest(

    "測試 A：週一 09:00 → 今天 10:00 衝分",

    taiwanDate(
        2026,
        9,
        28,
        9,
        0
    ),

    {
        mode: "prepare",

        targetTaiwan:
            "2026/09/28（一）10:00"
    }
);


/* =========================================================
   測試 B
   週一 15:00
   → 今天是衝分日
   ========================================================= */

addTest(

    "測試 B：週一 15:00 → 今天是衝分日",

    taiwanDate(
        2026,
        9,
        28,
        15,
        0
    ),

    {
        mode: "scoring",

        targetTaiwan:
            "2026/09/28（一）10:00"
    }
);


/* =========================================================
   測試 C
   週二
   → 下一個週五
   ========================================================= */

addTest(

    "測試 C：週二 → 下一個週五 10:00",

    taiwanDate(
        2026,
        9,
        29,
        12,
        0
    ),

    {
        mode: "prepare",

        targetTaiwan:
            "2026/10/02（五）10:00"
    }
);


/* =========================================================
   測試 D
   週四
   → 明天週五
   ========================================================= */

addTest(

    "測試 D：週四 → 下一個週五 10:00",

    taiwanDate(
        2026,
        10,
        1,
        20,
        0
    ),

    {
        mode: "prepare",

        targetTaiwan:
            "2026/10/02（五）10:00"
    }
);


/* =========================================================
   測試 E
   週五 09:00
   → 今天 10:00
   ========================================================= */

addTest(

    "測試 E：週五 09:00 → 今天 10:00 衝分",

    taiwanDate(
        2026,
        10,
        2,
        9,
        0
    ),

    {
        mode: "prepare",

        targetTaiwan:
            "2026/10/02（五）10:00"
    }
);


/* =========================================================
   測試 F
   週五 15:00
   → 今天是衝分日
   ========================================================= */

addTest(

    "測試 F：週五 15:00 → 今天是衝分日",

    taiwanDate(
        2026,
        10,
        2,
        15,
        0
    ),

    {
        mode: "scoring",

        targetTaiwan:
            "2026/10/02（五）10:00"
    }
);


/* =========================================================
   測試 G
   週六
   → 下一個週一
   ========================================================= */

addTest(

    "測試 G：週六 → 下一個週一 10:00",

    taiwanDate(
        2026,
        10,
        3,
        15,
        0
    ),

    {
        mode: "prepare",

        targetTaiwan:
            "2026/10/05（一）10:00"
    }
);


/* =========================================================
   執行測試
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


function runTest(index) {

    const test =
        tests[index];


    const result =
        getScoringDayInfo(
            test.input
        );


    const actualTarget =
        formatTaiwanTime(
            result.target
        );


    const success =
        result.mode ===
            test.expected.mode
        &&
        actualTarget ===
            test.expected.targetTaiwan;


    executed++;


    if (success) {

        passed++;

    } else {

        failed++;
    }


    const resultBox =
        document.getElementById(
            `result-${index}`
        );


    const gameTarget =
        formatGameTime(
            toGameTime(
                result.target
            )
        );


    if (success) {

        resultBox.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            實際模式：
            ${
                result.mode === "scoring"
                ? "🏆 今天是衝分日"
                : "📦 準備日"
            }

            <br>

            實際衝分時間：
            ${actualTarget}

            <br>

            實際遊戲時間：
            ${gameTarget}

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>

        `;

    } else {

        resultBox.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            <span class="fail">
                ❌ 測試失敗
            </span>

            <br><br>

            實際模式：
            ${
                result.mode === "scoring"
                ? "衝分日"
                : "準備日"
            }

            <br>

            實際衝分時間：
            ${actualTarget}

            <br>

            實際遊戲時間：
            ${gameTarget}

            <br><br>

            預期模式：
            ${
                test.expected.mode === "scoring"
                ? "衝分日"
                : "準備日"
            }

            <br>

            預期衝分時間：
            ${test.expected.targetTaiwan}

        `;
    }


    updateSummary();
}


/* =========================================================
   建立測試畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById(
            "tests"
        );


    tests.forEach(
        (test, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "test";


            const gameInput =
                toGameTime(
                    test.input
                );


            div.innerHTML = `

                <div class="test-title">

                    ${test.title}

                </div>


                <div class="state">

                    <strong>
                        計算基準時間
                    </strong>

                    <br>

                    台灣時間：
                    ${formatTaiwanTime(test.input)}

                    <br>

                    遊戲時間：
                    ${formatGameTime(gameInput)}

                </div>


                <button
                    onclick="runTest(${index})"
                >
                    執行測試
                </button>


                <div
                    class="result"
                    id="result-${index}"
                >

                    尚未執行

                </div>

            `;


            container.appendChild(div);

        }
    );
}


/* =========================================================
   測試摘要
   ========================================================= */

function updateSummary() {

    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            測試進度
        </strong>

        <br><br>

        已執行：
        ${executed} / ${tests.length}

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed}
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed}
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
