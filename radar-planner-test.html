<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雷達規劃器測試 - 10:00 邊界</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #d98224;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    margin-bottom: 30px;
}

</style>
</head>


<body>

<div class="container">

<h1>雷達規劃器測試</h1>

<div class="subtitle">
第二階段：10:00 衝分日邊界測試
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>

/* =========================================================
   時間工具
   ========================================================= */

const weekdayNames = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
];


/*
   建立台灣時間

   台灣 UTC+8
*/
function taiwanDate(
    year,
    month,
    day,
    hour,
    minute = 0
) {

    return new Date(
        Date.UTC(
            year,
            month - 1,
            day,
            hour - 8,
            minute,
            0
        )
    );
}


/*
   取得台灣時間資料
*/
function getTaiwanParts(date) {

    const taiwan =
        new Date(
            date.getTime()
            +
            8 * 60 * 60 * 1000
        );

    return {
        year: taiwan.getUTCFullYear(),
        month: taiwan.getUTCMonth(),
        day: taiwan.getUTCDate(),
        hour: taiwan.getUTCHours(),
        minute: taiwan.getUTCMinutes(),
        weekday: taiwan.getUTCDay()
    };
}


/*
   台灣時間顯示
*/
function formatTaiwanTime(date) {

    const p =
        getTaiwanParts(date);

    const month =
        String(p.month + 1)
        .padStart(2, "0");

    const day =
        String(p.day)
        .padStart(2, "0");

    const hour =
        String(p.hour)
        .padStart(2, "0");

    const minute =
        String(p.minute)
        .padStart(2, "0");

    return `${p.year}/${month}/${day}（${weekdayNames[p.weekday]}）${hour}:${minute}`;
}


/*
   遊戲時間

   遊戲時間 = 台灣時間 - 10 小時
*/
function toGameTime(taiwanDateValue) {

    return new Date(
        taiwanDateValue.getTime()
        -
        10 * 60 * 60 * 1000
    );
}


/*
   遊戲時間顯示
*/
function formatGameTime(date) {

    const year =
        date.getUTCFullYear();

    const month =
        String(date.getUTCMonth() + 1)
        .padStart(2, "0");

    const day =
        String(date.getUTCDate())
        .padStart(2, "0");

    const hour =
        String(date.getUTCHours())
        .padStart(2, "0");

    const minute =
        String(date.getUTCMinutes())
        .padStart(2, "0");

    const weekday =
        weekdayNames[
            date.getUTCDay()
        ];

    return `${year}/${month}/${day}（${weekday}）${hour}:${minute}`;
}


/* =========================================================
   衝分日判定
   ========================================================= */

function getScoringDayInfo(taiwanDateValue) {

    const p =
        getTaiwanParts(
            taiwanDateValue
        );

    const weekday =
        p.weekday;

    const hour =
        p.hour;

    const minute =
        p.minute;


    /*
       10:00 以前：

       還沒有進入今天的衝分日。

       10:00 整開始：
       今天就是衝分日。
    */

    const reached10 =
        hour > 10 ||
        (
            hour === 10 &&
            minute >= 0
        );


    /*
       星期一
    */

    if (weekday === 1) {

        const target =
            new Date(
                Date.UTC(
                    p.year,
                    p.month,
                    p.day,
                    2,
                    0,
                    0
                )
            );

        return {
            mode:
                reached10
                ? "scoring"
                : "prepare",

            target
        };
    }


    /*
       星期五
    */

    if (weekday === 5) {

        const target =
            new Date(
                Date.UTC(
                    p.year,
                    p.month,
                    p.day,
                    2,
                    0,
                    0
                )
            );

        return {
            mode:
                reached10
                ? "scoring"
                : "prepare",

            target
        };
    }


    /*
       星期二～星期四
       → 下一個星期五
    */

    if (
        weekday >= 2 &&
        weekday <= 4
    ) {

        const daysUntilFriday =
            5 - weekday;

        const target =
            new Date(
                Date.UTC(
                    p.year,
                    p.month,
                    p.day + daysUntilFriday,
                    2,
                    0,
                    0
                )
            );

        return {
            mode: "prepare",
            target
        };
    }


    /*
       星期六
       → 下一個星期一
    */

    if (weekday === 6) {

        const target =
            new Date(
                Date.UTC(
                    p.year,
                    p.month,
                    p.day + 2,
                    2,
                    0,
                    0
                )
            );

        return {
            mode: "prepare",
            target
        };
    }


    /*
       星期日
       → 明天星期一
    */

    if (weekday === 0) {

        const target =
            new Date(
                Date.UTC(
                    p.year,
                    p.month,
                    p.day + 1,
                    2,
                    0,
                    0
                )
            );

        return {
            mode: "prepare",
            target
        };
    }

}


/* =========================================================
   測試資料
   ========================================================= */

const tests = [];


function addTest(
    title,
    input,
    expectedMode,
    expectedTarget
) {

    tests.push({
        title,
        input,
        expectedMode,
        expectedTarget
    });

}


/* =========================================================
   A
   週一 09:59
   ========================================================= */

addTest(
    "測試 A：週一 09:59 → 還是準備日",
    taiwanDate(
        2026,
        9,
        28,
        9,
        59
    ),
    "prepare",
    "2026/09/28（一）10:00"
);


/* =========================================================
   B
   週一 10:00
   ========================================================= */

addTest(
    "測試 B：週一 10:00 → 正式進入衝分日",
    taiwanDate(
        2026,
        9,
        28,
        10,
        0
    ),
    "scoring",
    "2026/09/28（一）10:00"
);


/* =========================================================
   C
   週一 10:01
   ========================================================= */

addTest(
    "測試 C：週一 10:01 → 仍是衝分日",
    taiwanDate(
        2026,
        9,
        28,
        10,
        1
    ),
    "scoring",
    "2026/09/28（一）10:00"
);


/* =========================================================
   D
   週五 09:59
   ========================================================= */

addTest(
    "測試 D：週五 09:59 → 還是準備日",
    taiwanDate(
        2026,
        10,
        2,
        9,
        59
    ),
    "prepare",
    "2026/10/02（五）10:00"
);


/* =========================================================
   E
   週五 10:00
   ========================================================= */

addTest(
    "測試 E：週五 10:00 → 正式進入衝分日",
    taiwanDate(
        2026,
        10,
        2,
        10,
        0
    ),
    "scoring",
    "2026/10/02（五）10:00"
);


/* =========================================================
   F
   週五 10:01
   ========================================================= */

addTest(
    "測試 F：週五 10:01 → 仍是衝分日",
    taiwanDate(
        2026,
        10,
        2,
        10,
        1
    ),
    "scoring",
    "2026/10/02（五）10:00"
);


/* =========================================================
   測試執行
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


function runTest(index) {

    const test =
        tests[index];

    const result =
        getScoringDayInfo(
            test.input
        );


    const actualTarget =
        formatTaiwanTime(
            result.target
        );


    const success =
        result.mode ===
            test.expectedMode
        &&
        actualTarget ===
            test.expectedTarget;


    executed++;


    if (success) {
        passed++;
    } else {
        failed++;
    }


    const resultBox =
        document.getElementById(
            `result-${index}`
        );


    const modeText =
        result.mode === "scoring"
        ? "🏆 今天是衝分日"
        : "📦 準備衝分日";


    const expectedModeText =
        test.expectedMode === "scoring"
        ? "🏆 今天是衝分日"
        : "📦 準備衝分日";


    const gameTarget =
        formatGameTime(
            toGameTime(
                result.target
            )
        );


    if (success) {

        resultBox.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            實際模式：
            ${modeText}

            <br>

            實際衝分時間：
            ${actualTarget}

            <br>

            實際遊戲時間：
            ${gameTarget}

            <br><br>

            <span class="pass">
                ✅ 測試通過
            </span>

        `;

    } else {

        resultBox.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            <span class="fail">
                ❌ 測試失敗
            </span>

            <br><br>

            實際模式：
            ${modeText}

            <br>

            實際衝分時間：
            ${actualTarget}

            <br>

            預期模式：
            ${expectedModeText}

            <br>

            預期衝分時間：
            ${test.expectedTarget}

        `;
    }


    updateSummary();
}


/* =========================================================
   建立測試畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById(
            "tests"
        );


    tests.forEach(
        (test, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "test";


            div.innerHTML = `

                <div class="test-title">
                    ${test.title}
                </div>


                <div class="state">

                    <strong>
                        計算基準時間
                    </strong>

                    <br>

                    台灣時間：
                    ${formatTaiwanTime(test.input)}

                    <br>

                    遊戲時間：
                    ${
                        formatGameTime(
                            toGameTime(
                                test.input
                            )
                        )
                    }

                </div>


                <button
                    onclick="runTest(${index})"
                >
                    執行測試
                </button>


                <div
                    class="result"
                    id="result-${index}"
                >
                    尚未執行
                </div>

            `;


            container.appendChild(div);

        }
    );
}


/* =========================================================
   測試摘要
   ========================================================= */

function updateSummary() {

    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            測試進度
        </strong>

        <br><br>

        已執行：
        ${executed} / ${tests.length}

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed}
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed}
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
