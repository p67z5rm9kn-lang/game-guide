<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雷達規劃器測試 - 10:00 理想狀態</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

    line-height: 1.6;
}

.container {
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    font-size: 23px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.test {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
}

.test-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.state {
    background: #111827;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 12px;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #d98224;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

.result {
    margin-top: 12px;
    padding: 14px;
    border-radius: 10px;
    background: #111827;
}

.pass {
    color: #4ade80;
    font-weight: 700;
}

.fail {
    color: #f87171;
    font-weight: 700;
}

.summary {
    background: #111827;
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    margin-bottom: 30px;
}

.ideal {
    color: #fbbf24;
    font-weight: 700;
}

</style>
</head>


<body>

<div class="container">

<h1>雷達規劃器測試</h1>

<div class="subtitle">
第三階段：10:00 理想狀態計算
</div>

<div id="tests"></div>

<div class="summary" id="summary">
    尚未執行測試
</div>

</div>


<script>

/* =========================================================
   10:00 理想狀態規則

   目標：

   10:00 之後
   場上 = 11
   庫存 = MAX

   因為系統 +8：

   場上 >= 8 時
   +8 全部進入庫存。

   所以一般情況：

   10:00 前庫存 = MAX - 8


   但如果 MAX < 8：

   MAX - 8 會變成負數，
   這是不可能的。

   因此準備庫存最低為 0。

   公式：

   beforeInventory = max(0, MAX - 8)
   ========================================================= */


/* =========================================================
   計算 10:00 前理想狀態
   ========================================================= */

function getIdealBefore10State(maxInventory) {

    if (
        !Number.isFinite(maxInventory) ||
        maxInventory <= 0
    ) {

        throw new Error(
            "庫存上限 MAX 必須大於 0"
        );
    }


    return {

        field: 11,

        inventory:
            Math.max(
                0,
                maxInventory - 8
            )

    };
}


/* =========================================================
   模擬 10:00 系統 +8

   系統產生 8 個雷達。

   新增雷達先填場上到 8。

   如果場上原本已經 >= 8，
   則 8 個全部進入庫存。

   庫存受 MAX 限制。
   ========================================================= */

function simulateSystemPlus8(
    field,
    inventory,
    maxInventory
) {

    let newField =
        field;

    let newInventory =
        inventory;


    let generated =
        8;


    /*
       第一階段：
       場上不足 8，
       先補場上。
    */

    if (newField < 8) {

        const need =
            8 - newField;

        const toField =
            Math.min(
                generated,
                need
            );

        newField +=
            toField;

        generated -=
            toField;
    }


    /*
       第二階段：
       剩餘雷達進庫存。

       MAX 是庫存上限。
    */

    if (generated > 0) {

        const room =
            Math.max(
                0,
                maxInventory -
                newInventory
            );

        const toInventory =
            Math.min(
                generated,
                room
            );

        newInventory +=
            toInventory;
    }


    return {

        field:
            newField,

        inventory:
            newInventory

    };
}


/* =========================================================
   測試資料
   ========================================================= */

const tests = [];


function addTest(
    title,
    maxInventory
) {

    tests.push({
        title,
        maxInventory
    });

}


/* =========================================================
   A
   MAX = 30
   ========================================================= */

addTest(
    "測試 A：MAX = 30",
    30
);


/* =========================================================
   B
   MAX = 20
   ========================================================= */

addTest(
    "測試 B：MAX = 20",
    20
);


/* =========================================================
   C
   MAX = 8
   ========================================================= */

addTest(
    "測試 C：MAX = 8",
    8
);


/* =========================================================
   D
   MAX = 5

   特別測試 MAX < 8
   ========================================================= */

addTest(
    "測試 D：MAX = 5（MAX 小於 8）",
    5
);


/* =========================================================
   執行測試
   ========================================================= */

let executed = 0;
let passed = 0;
let failed = 0;


function runTest(index) {

    const test =
        tests[index];


    try {

        /*
           計算 10:00 前理想狀態
        */

        const before =
            getIdealBefore10State(
                test.maxInventory
            );


        /*
           模擬 10:00 +8
        */

        const after =
            simulateSystemPlus8(
                before.field,
                before.inventory,
                test.maxInventory
            );


        /*
           預期：

           10:00 前
           field = 11
           inventory = max(0, MAX - 8)

           10:00 後
           field = 11
           inventory = MAX
        */

        const expectedBeforeInventory =
            Math.max(
                0,
                test.maxInventory - 8
            );


        const beforeCorrect =
            before.field === 11
            &&
            before.inventory ===
                expectedBeforeInventory;


        const afterCorrect =
            after.field === 11
            &&
            after.inventory ===
                test.maxInventory;


        const success =
            beforeCorrect &&
            afterCorrect;


        executed++;


        if (success) {

            passed++;

        } else {

            failed++;
        }


        const resultBox =
            document.getElementById(
                `result-${index}`
            );


        if (success) {

            resultBox.innerHTML = `

                <strong>測試結果</strong>

                <br><br>

                <span class="ideal">
                    10:00 前理想狀態
                </span>

                <br>

                場上：
                ${before.field}

                <br>

                庫存：
                ${before.inventory}

                <br><br>

                <span class="ideal">
                    10:00 系統 +8 後
                </span>

                <br>

                場上：
                ${after.field}

                <br>

                庫存：
                ${after.inventory}

                <br><br>

                <span class="pass">
                    ✅ 測試通過
                </span>

            `;

        } else {

            failed++;


            resultBox.innerHTML = `

                <strong>測試結果</strong>

                <br><br>

                <span class="fail">
                    ❌ 測試失敗
                </span>

                <br><br>

                10:00 前：

                <br>

                實際場上：
                ${before.field}

                <br>

                實際庫存：
                ${before.inventory}

                <br><br>

                10:00 後：

                <br>

                實際場上：
                ${after.field}

                <br>

                實際庫存：
                ${after.inventory}

                <br><br>

                預期 10:00 前：

                <br>

                場上：11

                <br>

                庫存：
                ${expectedBeforeInventory}

                <br><br>

                預期 10:00 後：

                <br>

                場上：11

                <br>

                庫存：
                ${test.maxInventory}

            `;
        }


        updateSummary();


    } catch (error) {

        executed++;
        failed++;


        const resultBox =
            document.getElementById(
                `result-${index}`
            );


        resultBox.innerHTML = `

            <strong>測試結果</strong>

            <br><br>

            <span class="fail">
                ❌ 測試失敗
            </span>

            <br><br>

            ${error.message}

        `;


        updateSummary();
    }
}


/* =========================================================
   建立測試畫面
   ========================================================= */

function renderTests() {

    const container =
        document.getElementById(
            "tests"
        );


    tests.forEach(
        (test, index) => {

            const beforeInventory =
                Math.max(
                    0,
                    test.maxInventory - 8
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "test";


            div.innerHTML = `

                <div class="test-title">
                    ${test.title}
                </div>


                <div class="state">

                    <strong>
                        庫存上限 MAX：
                    </strong>

                    ${test.maxInventory}

                    <br><br>

                    <strong>
                        預計 10:00 前：
                    </strong>

                    <br>

                    場上：11

                    <br>

                    庫存：
                    ${beforeInventory}

                    <br><br>

                    <strong>
                        預計 10:00 後：
                    </strong>

                    <br>

                    場上：11

                    <br>

                    庫存：
                    ${test.maxInventory}

                </div>


                <button
                    onclick="runTest(${index})"
                >
                    執行測試
                </button>


                <div
                    class="result"
                    id="result-${index}"
                >

                    尚未執行

                </div>

            `;


            container.appendChild(div);

        }
    );
}


/* =========================================================
   摘要
   ========================================================= */

function updateSummary() {

    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            測試進度
        </strong>

        <br><br>

        已執行：
        ${executed} / ${tests.length}

        <br>

        <span class="pass">
            ✅ 通過：
            ${passed}
        </span>

        <br>

        <span class="fail">
            ❌ 失敗：
            ${failed}
        </span>

    `;
}


/* =========================================================
   初始化
   ========================================================= */

renderTests();

</script>

</body>
</html>
