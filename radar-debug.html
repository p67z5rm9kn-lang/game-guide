<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Z｜星期二時間測試 v6.2</title>
<style>
:root{--bg:#071426;--card:#0d2038;--line:#27415f;--gold:#d7b56d;--text:#edf3fb;--muted:#9fb1c7;--good:#8fd3a7;--warn:#f0c674}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#061120,#0a192c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px 12px 40px}
main{max-width:680px;margin:auto}
h1{font-size:22px;margin:0 0 7px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px}
.panel{background:rgba(13,32,56,.94);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
input{width:100%;border:1px solid #365574;border-radius:10px;background:#102842;color:#fff;font-size:17px;padding:11px 12px;outline:none}
button{width:100%;margin-top:10px;border:1px solid #a68748;border-radius:10px;background:#172c46;color:#f5d98e;font-weight:700;font-size:16px;padding:11px}
.box{background:#09192c;border-radius:10px;padding:11px;margin-top:9px;font-size:13px;line-height:1.7}
.big{font-size:19px;font-weight:700}
.ok{color:var(--good)}
.warn{color:var(--warn)}
.muted{color:var(--muted)}
.event{display:flex;gap:9px;border-top:1px solid #203852;padding:9px 0;font-size:13px;line-height:1.55}
.event:first-child{border-top:0}
.time{min-width:55px;color:#f2d486;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{border-bottom:1px solid #203852;padding:8px 4px;text-align:left}
th{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<main>
<h1>Last Z｜星期二時間測試 v6.2</h1>
<div class="sub">只測一件事：v4 的「星期二需要處理 20 個」，在玩家可操作時間內能不能完成。</div>

<div class="panel">
<b>測試條件</b>
<div class="box">
MAX：<b>30</b><br>
星期二 v4 開始：<b>場上 0／庫存 0</b><br>
星期二 v4 需要處理：<b>20 個</b><br>
星期二 v4 結束：<b>場上 8／庫存 16</b>
</div>

<label>每日可操作開始時間</label>
<input id="start" type="time" value="18:00">

<label>每日可操作結束時間</label>
<input id="end" type="time" value="22:00">

<button id="run">開始測試</button>
</div>

<div id="result"></div>
</main>

<script>
const $=s=>document.querySelector(s);

function minOf(s){
  const [h,m]=s.split(':').map(Number);
  return h*60+m;
}

function inWindow(t,start,end){
  if(start===end) return true;
  if(start<end) return t>=start && t<=end;
  return t>=start || t<=end;
}

function run(){
  const start=$('#start').value;
  const end=$('#end').value;
  const sm=minOf(start), em=minOf(end);

  // 只測星期二。
  // v4 的「處理 20」是既定需求，本版不重新計算它。
  const required=20;

  // 事件：10:00 +8、18:00 +8、02:00 +8。
  // 這一版先只建立時間位置，不假設每分鐘能處理幾個。
  const events=[
    {time:'10:00',min:600,label:'系統 +8'},
    {time:'18:00',min:1080,label:'系統 +8'},
    {time:'02:00',min:120,label:'系統 +8（隔日）'}
  ];

  const rows=events.map(e=>({
    ...e,
    can:inWindow(e.min,sm,em)
  }));

  const hasWindow=sm!==em;
  const daytimeOverlap=hasWindow && (sm<em ? !(em<=600 || sm>=1320) : true);

  let h=`<div class="panel">
    <b>① v4 星期二基準</b>
    <div class="box">
      開始：<b>0／0</b><br>
      今日需要處理：<b>20 個</b><br>
      預期結束：<b>8／16</b>
    </div>
    <div class="box ok"><b>✅ v4 基準不變</b><br>
      這 20 個不是由時間模組重新計算，而是直接沿用 v4。
    </div>
  </div>`;

  h+=`<div class="panel">
    <b>② 星期二時間軸</b>
    <div class="box">玩家可操作：<span class="big">${start}～${end}</span></div>
    ${rows.map(e=>`<div class="event">
      <span class="time">${e.time}</span>
      <span><b>${e.label}</b><br>
      <span class="${e.can?'ok':'warn'}">${e.can?'🟢 玩家可操作':'🔴 玩家不可操作'}</span></span>
    </div>`).join('')}
  </div>`;

  h+=`<div class="panel">
    <b>③ 目前測試結論</b>
    <div class="box">
      <div class="big">還不判定「20 個能不能完成」</div>
      <div class="muted" style="margin-top:7px">
        原因：我們現在還沒有定義「玩家在操作時間內，每次可以處理多少雷達」。
        如果現在直接說可以或不可以，就是自行猜規則。
      </div>
    </div>
    <div class="box">
      <b>下一個需要確認的規則：</b><br>
      玩家在一次可操作期間，可以處理多少個已完成雷達／收割多少個雷達？
    </div>
  </div>`;

  $('#result').innerHTML=h;
}

$('#run').addEventListener('click',run);
run();
</script>
</body>
</html>
