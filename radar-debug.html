<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃 v14 乾淨核心測試版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#071321;color:#eee;margin:0;padding:16px}
.card{max-width:700px;margin:auto;background:#102338;border:1px solid #8b6a2b;border-radius:14px;padding:16px}
h1{font-size:20px;margin:0 0 8px}
.note{font-size:14px;color:#c9d2dc;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#d8c38b;display:block;margin-bottom:4px}
input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #657487;background:#172d43;color:#fff;font-size:16px}
button{margin-top:12px;background:#8b6a2b;border:0;font-weight:700}
hr{border:0;border-top:1px solid #33485c;margin:16px 0}
.row{padding:10px 12px;background:#172d43;border-radius:9px;margin:7px 0}
.good{color:#8fe39a}.gold{color:#ffd66b}
pre{white-space:pre-wrap;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="card">
<h1>🧭 雷達規劃 v14｜乾淨核心測試版</h1>
<div class="note">這一版重新建立跨日規劃核心，不沿用舊版 crossDayPlan。先確認「完整跨日規劃」可以瞬間完成，再接回正式 UI。</div>

<div class="grid">
<div><label>庫存上限 MAX</label><input id="max" type="number" value="30"></div>
<div><label>目前庫存</label><input id="inv" type="number" value="22"></div>
<div><label>場上雷達</label><input id="field" type="number" value="8"></div>
<div><label>已完成</label><input id="completed" type="number" value="0"></div>
</div>

<hr>

<div class="grid">
<div><label>勞拉</label><select id="laura"><option value="none">無</option><option value="yes" selected>有</option></select></div>
<div><label>勞拉星級</label><select id="star"><option>0</option><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
<div><label>勞拉今日狀態</label><select id="used"><option value="no" selected>未點擊</option><option value="yes">已點擊</option></select></div>
<div><label>勇士戰令</label><select id="task1"><option value="no">未啟用</option><option value="yes" selected>啟用</option></select></div>
<div><label>勇士戰令目前進度</label><input id="p1" type="number" value="0"></div>
<div><label>黎明曙光</label><select id="task2"><option value="no">未啟用</option><option value="yes" selected>啟用</option></select></div>
<div><label>黎明曙光目前進度</label><input id="p2" type="number" value="0"></div>
<div><label>基準時間</label><input id="base" type="datetime-local" value="2026-09-27T11:27"></div>
</div>

<button id="plan">開始規劃</button>
<div id="out" style="margin-top:14px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const DAY=86400000, H=3600000;

function tw(ms){
  const d=new Date(ms+8*H);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),min:d.getUTCMinutes()};
}
function twMs(y,m,d,h=0,min=0){
  return Date.UTC(y,m,d,h,min)-8*H;
}
function fmt(ms){
  const p=tw(ms);
  return `${p.y}/${String(p.m+1).padStart(2,"0")}/${String(p.d).padStart(2,"0")} ${String(p.h).padStart(2,"0")}:${String(p.min).padStart(2,"0")}`;
}
function wd(ms){
  const p=tw(ms);
  return new Date(Date.UTC(p.y,p.m,p.d)).getUTCDay();
}
function nextScore(ms){
  const p=tw(ms), w=wd(ms);
  if((w===1||w===5)&&p.h<10) return twMs(p.y,p.m,p.d,10);
  const add={0:1,1:4,2:3,3:2,4:1,5:3,6:2}[w];
  return twMs(p.y,p.m,p.d+add,10);
}
function dayStart(ms){
  const p=tw(ms);
  return twMs(p.y,p.m,p.d,10);
}
function systemEvents(start,end){
  const out=[];
  let cursor=dayStart(start);
  if(cursor<=start) cursor+=DAY;
  while(cursor<end){
    const p=tw(cursor);
    const a=[twMs(p.y,p.m,p.d,18),twMs(p.y,p.m,p.d+1,2),twMs(p.y,p.m,p.d+1,10)];
    for(const t of a) if(t>start&&t<=end) out.push(t);
    cursor+=DAY;
  }
  return out.sort((a,b)=>a-b);
}
function lauraAmount(star){
  return [5,10,10,10,20,20][star]||0;
}
function completeOne(s){
  s.field=Math.max(0,s.field);
  if(s.unfinished>0){s.unfinished--;s.completed++;if(s.task1.active)s.p1++;if(s.task2.active)s.p2++;}
}
function harvestOne(s){
  if(s.completed<=0)return false;
  s.completed--;s.field--;
  if(s.field<8 && s.inventory>0){const n=Math.min(8-s.field,s.inventory);s.field+=n;s.inventory-=n;}
  if(s.star===5 && s.treasure<10)s.treasure++;
  return true;
}
function enterRadar(s,n){
  const fill=Math.min(n,Math.max(0,8-s.field));
  s.field+=fill;
  s.inventory+=Math.min(n-fill,Math.max(0,s.max-s.inventory));
  s.unfinished+=fill+(n-fill); // 新進入場上的雷達均先視為未完成
}
function futureTaskReset(s){
  s.p1=0;s.p2=0;s.treasure=0;s.lauraUsed=false;
}
function applySystem8(s){
  const before=s.field;
  const fill=Math.min(8,Math.max(0,8-s.field));
  s.field+=fill;
  const remain=8-fill;
  s.inventory+=Math.min(remain,Math.max(0,s.max-s.inventory));
  s.unfinished+=8;
  return {before,field:s.field,inventory:s.inventory};
}
function applyLaura(s){
  if(!s.lauraExists||s.lauraUsed)return 0;
  const n=lauraAmount(s.star);
  const before=s.field;
  const fill=Math.min(n,Math.max(0,8-s.field));
  s.field+=fill;
  const remain=n-fill;
  s.inventory+=remain; // 勞拉可突破 MAX
  s.unfinished+=n;
  s.field=Math.max(s.field,0);
  s.lauraUsed=true;
  return n;
}
function futureTaskNeed(s){
  return Math.max(0,20-Math.max(s.p1,s.p2));
}
function harvestAll(s){
  let n=0;
  while(s.completed>0){harvestOne(s);n++;}
  return n;
}

function plan(){
  const t0=performance.now();
  const base=Date.parse($("base").value);
  const s={
    max:+$("max").value,inventory:+$("inv").value,field:+$("field").value,
    completed:+$("completed").value,
    unfinished:Math.max(0,+$("field").value-+$("completed").value),
    lauraExists:$("laura").value==="yes",
    star:+$("star").value,lauraUsed:$("used").value==="yes",
    treasure:0,
    task1:{},task2:{},
    p1:$("task1").value==="yes"?Math.max(0,+$("p1").value):0,
    p2:$("task2").value==="yes"?Math.max(0,+$("p2").value):0
  };
  s.task1.active=$("task1").value==="yes";
  s.task2.active=$("task2").value==="yes";

  if(!Number.isFinite(base)||s.max<=0||s.inventory<0||s.field<0||s.completed<0||s.completed>s.field){
    $("out").innerHTML='<div class="row" style="color:#ff8f8f">❌ 輸入資料無效</div>';return;
  }

  const score=nextScore(base);
  const events=systemEvents(base,score);
  const lines=[];
  const phase=dayStart(base);

  // Current day: satisfy actual active tasks first.
  let need=Math.max(
    s.task1.active?Math.max(0,10-s.p1):0,
    s.task2.active?Math.max(0,20-s.p2):0
  );
  let completedNow=0;
  while(need>0 && s.unfinished>0){completeOne(s);need--;completedNow++;}

  if(s.lauraExists&&!s.lauraUsed) {
    const n=applyLaura(s);
    lines.push(`📍 今日勞拉：+${n}`);
  }

  for(const t of events){
    const p=tw(t);
    if(p.h===10){
      futureTaskReset(s);
      if(s.task1.active)s.p1=0;
      if(s.task2.active)s.p2=0;
      // Future day planning assumption: both daily tasks active, 20 completions.
      let n=0;
      while(n<20&&s.unfinished>0){completeOne(s);n++;}
      if(s.lauraExists){
        const nL=applyLaura(s);
        if(nL)lines.push(`📅 ${fmt(t)}：新的一日，勞拉 +${nL}`);
      }
      lines.push(`📅 ${fmt(t)}：每日任務規劃完成 ${Math.min(20,20)} 次`);
      applySystem8(s);
    }else{
      applySystem8(s);
      lines.push(`⚡ ${fmt(t)}：系統 +8`);
    }
  }

  const beforeHarvest=s.field+s.inventory;
  const harvested=harvestAll(s);

  const ideal={field:11,inventory:s.max};
  const elapsed=performance.now()-t0;

  $("out").innerHTML=`
    <div class="row"><span class="good">✅ 規劃完成</span>　耗時 ${elapsed.toFixed(3)} ms</div>
    <div class="row"><b>🏆 目標：</b>${fmt(score)} 衝分</div>
    <div class="row"><b>🎯 理想狀態：</b>場上 ${ideal.field} ／ 庫存 ${ideal.inventory}</div>
    <div class="row"><b>📦 預計可達：</b>場上 ${s.field} ／ 庫存 ${s.inventory}</div>
    <div class="row"><b>🏆 本次衝分日預計可收割：</b>${beforeHarvest} 個</div>
    <div class="row"><b>📝 規劃摘要</b><pre>${lines.join("\n")||"目前沒有額外事件。"}</pre></div>
    <div class="row"><b>🔎 核心：</b>共處理 ${events.length} 個系統 +8 事件；完成動作 ${completedNow} 次；最後模擬收割 ${harvested} 個。</div>`;
}
$("plan").onclick=plan;
</script>
</body>
</html>
