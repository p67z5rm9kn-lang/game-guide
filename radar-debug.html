<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Z 雷達週計劃 v8.3.7</title>
<style>
:root{--bg:#071426;--card:#0d2038;--line:#27415f;--gold:#d7b56d;--text:#edf3fb;--muted:#9fb1c7;--good:#8fd3a7;--warn:#f0c674}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061120,#0a192c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px 12px 40px}main{max-width:760px;margin:auto}h1{font-size:22px;margin:0 0 6px;color:var(--gold)}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}.panel,.day{background:rgba(13,32,56,.94);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}label{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}input{width:100%;border:1px solid #365574;border-radius:10px;background:#102842;color:#fff;font-size:17px;padding:11px 12px;outline:none}button{width:100%;margin-top:10px;border:1px solid #a68748;border-radius:10px;background:#172c46;color:#f5d98e;font-weight:700;font-size:16px;padding:11px}.meta{font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px}.day h2{font-size:18px;margin:0 0 8px}.tag{display:inline-block;border:1px solid #806b3e;color:#f2d486;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:5px}.state{font-size:15px;color:#dce8f5;margin:8px 0}.action{background:#09192c;border-radius:10px;padding:9px 10px;margin-top:7px;font-size:13px;line-height:1.65}.result{font-size:15px;line-height:1.65}.muted{color:var(--muted)}.ok{color:var(--good)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:9px}td,th{border-bottom:1px solid #203852;padding:7px 4px;text-align:left}th{color:var(--muted);font-weight:500}.empty{padding:16px;text-align:center;color:var(--muted)}.formula{background:#09192c;border-radius:10px;padding:9px 10px;margin-top:9px;font-size:12px;line-height:1.7}.score{border-color:#806b3e}.timeline{margin-top:10px}.operation-block,.event{background:#09192c;border-radius:10px;padding:9px 10px;margin-top:7px;font-size:16px;line-height:1.75}.operation-block{border-left:3px solid var(--gold);background:#0b2138}.operation-range,.event-time{color:#f2d486;font-weight:700;margin-bottom:3px}.operation-step,.event-action{padding:2px 0;font-size:16px}.event.refresh{border-left:3px solid #557a9e;color:#dce8f5}.event.refresh .event-time{color:#f2d486}.schedule-legend,.player-mark,.system-mark{display:none}
</style></head>
<body><main>
<h1>Last Z｜雷達週計劃 v8.3.7</h1>
<div class="sub">先設定「玩家可操作時間」。依照玩家可操作時間安排每一步操作與刷新雷達。</div>
<div class="panel setup-panel">
<h2 class="section-title">⚙️ 規劃設定</h2>
<label>時間模式</label>
<div class="modes"><label><input type="radio" name="timeMode" value="game" checked> 遊戲時間</label><label><input type="radio" name="timeMode" value="local"> 當地時間</label></div>
<label>套用方式</label>
<div class="modes"><label><input type="radio" name="applyMode" value="same" checked> 每天相同</label><label><input type="radio" name="applyMode" value="custom"> 每天個別設定</label></div>
<div id="sameTimes"></div>
<div id="customTimes" hidden></div>
<div class="meta">新增、刪除或修改時段後會立即記錄；不需要另外按儲存。若結束時間為 00:00，代表可操作到當日午夜。</div>
<div class="setup-divider"></div>
<label>勞拉</label>
<div class="laura-toggle-row"><label class="switch-label"><input type="checkbox" id="lauraToggle" checked><span class="switch"></span><span>有勞拉</span></label><div id="lauraDetail">
<label for="lauraStar">勞拉幾星</label>
<select id="lauraStar" class="setting-select"><option value="0">0★（+5）</option><option value="1">1★（+10）</option><option value="2">2★（+10）</option><option value="3">3★（+10）</option><option value="4" selected>4★（+20）</option><option value="5">5★（+20）</option></select>
</div></div>
<div class="meta">勞拉數量會依星級直接連動每日排程；無勞拉時，排程不會安排點擊勞拉。</div>
<div class="setup-divider"></div>
<label for="max">儲存上限</label><input id="max" type="number" min="1" step="1" placeholder="例如 30">
<button id="plan">重新規劃</button>
<div class="meta">星期一、星期五為衝分日；星期二～四準備星期五，星期六～日準備下週一。v8 以遊戲時間 UTC−2 作為內部時間軸；當地時間會依裝置時區轉換後再排程。每 8h 刷新 8 個雷達優先於玩家操作；普通日安全處理量依實際刷新時間順序計算。</div>
</div>
<div class="result-heading">📊 規劃結果</div>
<div id="out"><div class="panel empty">輸入儲存上限後會自動規劃</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const days=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const LAURA_AMOUNTS={0:5,1:10,2:10,3:10,4:20,5:20};
function getLauraSettings(){
  const has=document.getElementById('lauraToggle')?.checked!==false;
  const star=Number(document.getElementById('lauraStar')?.value||4);
  return {hasLaura:has,lauraStar:star,lauraAmount:has?(LAURA_AMOUNTS[star]??20):0};
}

function prepDay(startF,startI,MAX,isDayBeforeScore,lauraAmount,hasLaura,dailyMin){
  // 每天固定取得系統 +24；勞拉數量依玩家設定的星級決定。
  // 勞拉操作規則：
  // 1. 衝分日前 2～3 天：場上 <8 才能點擊；勞拉前後都可完成／收割。
  // 2. 衝分日前 1 天：先完成／收割當天全部應處理量，場上 =8 才能點擊；點擊後不能再收割。
  // 3. 衝分日：勞拉時機不限，但使用後儲存不得超過 MAX；勞拉前後都可完成／收割。
  const system=24;
  const minProcess=dailyMin;
  const endF=isDayBeforeScore?11:8;
  const availableBeforeLaura=startF+startI+system;

  // 日末安全線：儲存必須 <= MAX-8，預留下一次換日的每 8h 刷新 8 個雷達。
  // 實際處理量必須同時滿足「每日最低處理量」與「日末安全線」。
  // 勞拉數量也必須計入安全線。
  const safetyProcess=Math.max(0,availableBeforeLaura+lauraAmount-endF-(MAX-8));
  const process=Math.max(minProcess,safetyProcess);

  // 先完成/收割 process，再依當日規則使用勞拉。
  const afterProcessTotal=availableBeforeLaura-process;
  let fieldBeforeLaura,invBeforeLaura,fieldEnd,invEnd,lauraNote;

  if(!hasLaura){
    const total=Math.max(0,afterProcessTotal);
    if(total>=8){fieldEnd=8;invEnd=total-8;}else{fieldEnd=total;invEnd=0;}
    lauraNote='本日沒有勞拉，不安排點擊勞拉';
    return {startF:startF,startI:startI,system,laura:0,minProcess,safetyProcess,process,endF:fieldEnd,endI:invEnd,lauraNote,hasLaura:false};
  }

  if(isDayBeforeScore){
    // 衝分日前一天：先完成／收割當天全部應處理量，再確保場上 8，最後勞拉。
    fieldBeforeLaura=8;
    invBeforeLaura=afterProcessTotal-8;
    fieldEnd=11;
    const toField=Math.min(3,lauraAmount);
    invEnd=invBeforeLaura+(lauraAmount-toField);
    lauraNote=`先完成／收割當日全部處理量 → 場上 =8 → 使用勞拉 +${lauraAmount}；點擊後不能再收割`;
  }else{
    // 衝分日前 2～3 天：使用勞拉時場上必須 <8；勞拉前後都可完成／收割。
    // 若處理後場上仍 >=8，代表還需要再處理直到能使用勞拉；本版直接把安全計算納入 process。
    // 為了保持結果可行，將處理後狀態放成「場上不足 8」的合法配置。
    fieldBeforeLaura=Math.min(7,afterProcessTotal);
    invBeforeLaura=afterProcessTotal-fieldBeforeLaura;
    const need=8-fieldBeforeLaura;
    const toField=Math.min(need,lauraAmount);
    fieldEnd=fieldBeforeLaura+toField;
    invEnd=invBeforeLaura+(lauraAmount-toField);
    lauraNote=`場上 <8 才能使用勞拉 +${lauraAmount}；勞拉前後都可完成／收割`;
  }

  return {startF:startF,startI:startI,system,laura:lauraAmount,minProcess,safetyProcess,process,endF:fieldEnd,endI:invEnd,lauraNote};
}

function makePlan(MAX,lauraAmount,hasLaura){
  const rows=[];
  // 每個完整週期以衝分日開始：系統第一次 +8 尚未計入前，場上 11、儲存 MAX-8。
  // 這樣衝分日公式中的 3 次每 8h 刷新 8 個雷達 不會與起始儲存重複計算。
  let field=11,inv=MAX-8;
  for(let d=0;d<7;d++){
    const scoring=(d===0||d===4);
    const startF=field,startI=inv;
    if(scoring){
      // 起始儲存為 MAX-8；當日 3 次每 8h 刷新 8 個雷達 另行計入，避免第一次 +8 重複計算。
      const total=startF+startI+24+lauraAmount;
      rows.push({d,scoring,startF,startI,total,lauraAmount,hasLaura,endF:0,endI:0});
      field=0;inv=0;
      continue;
    }
    const dailyMin=(d===1||d===5)?12:20;
    const r=prepDay(field,inv,MAX,d===3||d===6,lauraAmount,hasLaura,dailyMin);
    rows.push({...r,d,scoring:false,lauraAmount,hasLaura,dailyMin});
    field=r.endF;inv=r.endI;
  }
  return rows;
}

function pad2(n){return String(n).padStart(2,'0');}
function mins(hm){const [h,m]=hm.split(':').map(Number);return h*60+m;}
function fmtMin(m){m=((m%1440)+1440)%1440;return `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;}
function gameDateKey(d){return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;}
function addDaysUTC(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x;}
function gameWeekMonday(){
  // 內部以 UTC−2 的「遊戲時間」決定本週星期；以目前時間取得對應遊戲日期。
  const now=new Date();
  const gameMs=now.getTime()-2*3600000;
  const g=new Date(gameMs);
  const dow=g.getUTCDay(); // Sun=0
  const monOffset=dow===0?-6:1-dow;
  const mon=new Date(Date.UTC(g.getUTCFullYear(),g.getUTCMonth(),g.getUTCDate()));
  mon.setUTCDate(mon.getUTCDate()+monOffset);
  return mon;
}
function weekdayIndexUTC(d){const x=d.getUTCDay();return x===0?6:x-1;}
function getAvailability(){
  const mode=document.querySelector('input[name=timeMode]:checked')?.value||'game';
  const apply=document.querySelector('input[name=applyMode]:checked')?.value||'same';
  const same=readTimes(document.querySelector('#sameDayTimes'));
  const custom=[...document.querySelectorAll('.dayTimes')].map(x=>readTimes(x));
  return {mode,apply,same,custom};
}
function localParts(date,tz){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const parts=Object.fromEntries(f.formatToParts(date).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  return parts;
}
function weekdayShortToIndex(s){return {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[s];}
function localDateTimeToGameDate(localDateISO,hm,tz){
  // 由指定時區的日期+時間反推出 UTC，再轉成遊戲 UTC−2。
  const [Y,M,D]=localDateISO.split('-').map(Number),[h,m]=hm.split(':').map(Number);
  let guess=Date.UTC(Y,M-1,D,h,m);
  for(let i=0;i<3;i++){
    const p=localParts(new Date(guess),tz);
    const asUTC=Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),Number(p.hour),Number(p.minute));
    const target=Date.UTC(Y,M-1,D,h,m);
    guess += target-asUTC;
  }
  const gameMs=guess-2*3600000;
  const gd=new Date(gameMs);
  return {date:gameDateKey(gd),minutes:gd.getUTCHours()*60+gd.getUTCMinutes(),utc:new Date(guess)};
}
function localDateISO(y,m,d){return `${y}-${pad2(m)}-${pad2(d)}`;}
function getLocalWeekdayDatesAroundGameWeek(tz,gameMon){
  const map=new Map();
  for(let off=-3;off<=10;off++){
    const gd=addDaysUTC(gameMon,off);
    // 取遊戲日的中午附近 UTC，僅用於取得相鄰日期範圍；真正轉換仍逐一以當地日期時間處理。
    const base=new Date(Date.UTC(gd.getUTCFullYear(),gd.getUTCMonth(),gd.getUTCDate(),12,0));
    const p=localParts(base,tz);
    const iso=localDateISO(Number(p.year),Number(p.month),Number(p.day));
    map.set(iso,weekdayShortToIndex(p.weekday));
    const prev=addDaysUTC(base,-1), pp=localParts(prev,tz); const iso2=localDateISO(Number(pp.year),Number(pp.month),Number(pp.day)); map.set(iso2,weekdayShortToIndex(pp.weekday));
    const next=addDaysUTC(base,1), pn=localParts(next,tz); const iso3=localDateISO(Number(pn.year),Number(pn.month),Number(pn.day)); map.set(iso3,weekdayShortToIndex(pn.weekday));
  }
  return map;
}
function buildGameAvailability(){
  const cfg=getAvailability();
  const mon=gameWeekMonday();
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
  const result=Array.from({length:7},()=>[]);
  if(cfg.mode==='game'){
    for(let i=0;i<7;i++){
      const rows=cfg.apply==='same'?cfg.same:cfg.custom[i];
      result[i]=rows.map(x=>({start:mins(x.start),end:(x.end==='00:00'?1440:mins(x.end)),source:x}));
    }
    return {result,tz,mon,mode:'game'};
  }
  // 當地時間：先建立涵蓋遊戲週前後幾天的當地日期，再轉成遊戲時間並依遊戲日期分桶。
  for(let delta=-3;delta<=10;delta++){
    const gd=addDaysUTC(mon,delta);
    const base=new Date(Date.UTC(gd.getUTCFullYear(),gd.getUTCMonth(),gd.getUTCDate(),12,0));
    const p=localParts(base,tz);
    const Y=Number(p.year),M=Number(p.month),D=Number(p.day);
    const baseLocal=new Date(Date.UTC(Y,M-1,D));
    for(let localOff=-1;localOff<=1;localOff++){
      const ld=addDaysUTC(baseLocal,localOff);
      const iso=localDateISO(ld.getUTCFullYear(),ld.getUTCMonth()+1,ld.getUTCDate());
      const temp=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth(),ld.getUTCDate(),12));
      const lp=localParts(temp,tz); const wi=weekdayShortToIndex(lp.weekday);
      const rows=cfg.apply==='same'?cfg.same:cfg.custom[wi];
      for(const x of rows){
        if(!x.start||!x.end)continue;
        const s=localDateTimeToGameDate(iso,x.start,tz);
        let e;
        if(x.end==='00:00' || mins(x.end)<=mins(x.start)){
          const nd=addDaysUTC(ld,1); const niso=localDateISO(nd.getUTCFullYear(),nd.getUTCMonth()+1,nd.getUTCDate()); e=localDateTimeToGameDate(niso,x.end,tz);
        }else e=localDateTimeToGameDate(iso,x.end,tz);
        // 將跨日區間拆成最多兩個遊戲日區段。
        const sAbs=s.utc.getTime(),eAbs=e.utc.getTime();
        if(eAbs<=sAbs)continue;
        const startG=new Date(sAbs-2*3600000), endG=new Date(eAbs-2*3600000);
        let curDate=new Date(Date.UTC(startG.getUTCFullYear(),startG.getUTCMonth(),startG.getUTCDate()));
        const lastDate=new Date(Date.UTC(endG.getUTCFullYear(),endG.getUTCMonth(),endG.getUTCDate()));
        while(curDate<=lastDate){
          const idx=weekdayIndexUTC(curDate); let a=0,b=1440;
          if(gameDateKey(curDate)===gameDateKey(startG))a=startG.getUTCHours()*60+startG.getUTCMinutes();
          if(gameDateKey(curDate)===gameDateKey(endG))b=endG.getUTCHours()*60+endG.getUTCMinutes();
          if(a<b)result[idx].push({start:a,end:b,source:x,local:true});
          curDate=addDaysUTC(curDate,1);
        }
      }
    }
  }
  for(let i=0;i<7;i++){
    result[i].sort((a,b)=>a.start-b.start);
    const merged=[]; for(const r of result[i]){const last=merged[merged.length-1]; if(last&&r.start<=last.end)last.end=Math.max(last.end,r.end); else merged.push({...r});} result[i]=merged;
  }
  return {result,tz,mon,mode:'local'};
}
function dayWindows(av,d){return av.result[d]||[];}
function nextOpTime(day,minute,av){
  // day = game-week day index; return {day,minute}；若本日無，向後找 7 日內。
  for(let k=0;k<8;k++){
    const idx=(day+k)%7, rows=dayWindows(av,idx);
    for(const r of rows){if(k===0 && minute<=r.end){return {day:idx,minute:Math.max(minute,r.start)};} if(k>0)return {day:idx,minute:r.start};}
  }
  return null;
}
function hasOpAfter(day,minute,av){
  const n=nextOpTime(day,minute,av);return n&&((n.day!==day)||n.minute>=minute);
}
function availabilitySummary(av){
  // 玩家看到的時段永遠使用自己選擇的時間模式；內部轉換後的遊戲時段不直接暴露在這裡。
  const cfg=getAvailability();
  const formatRows=rows=>rows&&rows.length?rows.map(x=>`${x.start}－${x.end}`).join('、'):'無可操作時間';
  return weekNames.map((d,i)=>{
    const rows=cfg.apply==='same'?cfg.same:cfg.custom[i];
    return `${d}：${formatRows(rows)}`;
  }).join('<br>');
}
function gameMomentToDisplay(gameDay,gameMinute,av){
  const gd=addDaysUTC(av.mon,gameDay);
  if(av.mode==='game') return {day:gameDay,time:fmtMin(gameMinute),dateLabel:`${pad2(gd.getUTCMonth()+1)}/${pad2(gd.getUTCDate())}`};
  // gameMinute is on the game's UTC−2 clock. Convert the exact game instant
  // to UTC, then format it in the player's device timezone.
  const utcMs=Date.UTC(gd.getUTCFullYear(),gd.getUTCMonth(),gd.getUTCDate(),0,0)+gameMinute*60000+2*3600000;
  const parts=localParts(new Date(utcMs),av.tz);
  const wi=weekdayShortToIndex(parts.weekday);
  return {day:wi,time:`${parts.hour}:${parts.minute}`,dateLabel:`${parts.month}/${parts.day}`};
}
function operationDisplay(op,av){
  if(!op)return '無';
  const x=gameMomentToDisplay(op.day,op.minute,av);
  return av.mode==='game'?`${weekNames[x.day]} ${x.time}`:`${weekNames[x.day]} ${x.dateLabel} ${x.time}`;
}
function inWindow(day,minute,av){
  return dayWindows(av,day).some(w=>minute>=w.start&&minute<=w.end);
}
function nextAvailableSameOrLater(day,minute,av){
  for(let k=0;k<8;k++){
    const idx=(day+k)%7, rows=dayWindows(av,idx);
    for(const w of rows){
      if(k===0){ if(minute<=w.end)return {day:idx,minute:Math.max(minute,w.start)}; }
      else return {day:idx,minute:w.start};
    }
  }
  return null;
}
function addRefreshEvent(events,d,minute,field,inv,delta=8){
  // 系統事件優先：先刷新，再讓儲存自動補到場上 8；場上若已 >=8，新增資源進儲存。
  let f=field,i=inv;
  let add=delta;
  if(f<8){const take=Math.min(8-f,add);f+=take;add-=take;}
  i+=add;
  events.push({type:'refresh',day:d,minute,beforeF:field,beforeI:inv,afterF:f,afterI:i,delta});
  return {field:f,inv:i};
}
function addHarvestEvent(events,d,minute,field,inv,qty,reason){
  if(qty<=0)return {field,inv};
  let q=Math.min(qty,field+inv);
  let f=field,i=inv;
  const fromField=Math.min(f,q); f-=fromField; q-=fromField; i-=q;
  // 儲存有資源且場上不足 8 時，遊戲會自動補回場上；這裡只呈現操作後的實際狀態。
  if(f<8&&i>0){const take=Math.min(8-f,i);f+=take;i-=take;}
  events.push({type:'harvest',day:d,minute,beforeF:field,beforeI:inv,afterF:f,afterI:i,qty:Math.min(qty,field+inv),reason});
  return {field:f,inv:i};
}
function addLauraEvent(events,d,minute,field,inv){
  // 勞拉：先補場上至 8；若場上原本已有 8，則增加 3 個到場上，其餘進儲存。
  let f=field,i=inv,add=lauraAmount;
  const need=Math.max(0,8-f); const toField=Math.min(need,add); f+=toField; add-=toField; i+=add;
  events.push({type:'laura',day:d,minute,beforeF:field,beforeI:inv,afterF:f,afterI:i,delta:lauraAmount});
  return {field:f,inv:i};
}
function simulateDay(d,startF,startI,r,av){
  const events=[]; const score=(d===0||d===4), dayBefore=(d===3||d===6);
  const lauraAmount=r.lauraAmount||0, hasLaura=!!r.hasLaura;
  let sf=startF, si=startI, processed=0, lauraUsed=false;
  const target=score?r.total:r.process;
  let currentMinute=0;
  const applyRefresh=()=>{let add=8;if(sf<8){const fill=Math.min(8-sf,add);sf+=fill;add-=fill;}si+=add;};
  const applyLaura=()=>{let add=lauraAmount;if(sf<8){const fill=Math.min(8-sf,add);sf+=fill;add-=fill;}else{const toField=Math.min(3,add);sf+=toField;add-=toField;}si+=add;};
  const applyHarvest=(qty,reason='完成／收割')=>{const want=Math.max(0,Math.min(qty,sf+si));if(want<=0)return 0;let q=want;const fromField=Math.min(sf,q);sf-=fromField;q-=fromField;si=Math.max(0,si-q);if(sf<8&&si>0){const fill=Math.min(8-sf,si);sf+=fill;si-=fill;}events.push({type:'harvest',day:d,minute:currentMinute,qty:want,reason,afterF:sf,afterI:si});processed+=want;return want;};
  const opTimes=[];
  for(const w of dayWindows(av,d)){ if(w.start===w.end)continue; opTimes.push(w.start); for(const m of [480,960]) if(m>w.start&&m<w.end)opTimes.push(m); }
  const uniqueOps=[...new Set(opTimes)].sort((a,b)=>a-b);
  const timeline=[]; [0,480,960].forEach(m=>timeline.push({type:'refresh',minute:m})); uniqueOps.forEach(m=>timeline.push({type:'op',minute:m}));
  timeline.sort((a,b)=>a.minute-b.minute||(a.type==='refresh'?-1:1));

  // v8.3：普通日（週二／三／六）依「剩餘需求」與「當下可用雷達」判斷 Laura。
  // 若現有雷達足以完成剩餘需求：先完成剩餘需求，再點 Laura。
  // 若不足：先處理全部現有雷達，再點 Laura；之後等刷新並重新評估。
  let ordinaryLauraPending=!score&&!dayBefore;
  for(const node of timeline){
    currentMinute=node.minute;
    if(node.type==='refresh'){
      applyRefresh();
      events.push({type:'refresh',day:d,minute:node.minute,delta:8,afterF:sf,afterI:si});
      continue;
    }
    const m=node.minute;
    if(!inWindow(d,m,av))continue;

    if(score){
      if(hasLaura&&!lauraUsed){
        // 衝分日：第一個可操作時間先收割所有目前可用雷達，再點 Laura。
        if(sf+si>0)applyHarvest(sf+si,'完成場上與儲存雷達');
        applyLaura(); lauraUsed=true;
        events.push({type:'laura',day:d,minute:m,delta:lauraAmount,afterF:sf,afterI:si});
      }
      if(processed<target)applyHarvest(target-processed);
    }else if(dayBefore){
      if(processed<target)applyHarvest(target-processed);
      if(hasLaura&&!lauraUsed&&processed>=target&&sf===8){
        applyLaura(); lauraUsed=true;
        events.push({type:'laura',day:d,minute:m,delta:lauraAmount,afterF:sf,afterI:si});
      }
    }else{
      // v8.3.1 普通日：每一次玩家可操作時，都重新依「剩餘需求」與「當下可用雷達」評估。
      // Laura 使用後仍可繼續收割；若尚未完成需求，下一次刷新／可操作時間再重新判斷。
      const remaining=Math.max(0,target-processed);
      if(remaining<=0)continue;

      const available=sf+si;
      if(available>=remaining){
        // 目前雷達足夠：先完成剩餘需求。若 Laura 尚未使用，再於需求完成後點擊 Laura。
        applyHarvest(remaining);
        if(hasLaura&&!lauraUsed){
          applyLaura(); lauraUsed=true;
          events.push({type:'laura',day:d,minute:m,delta:lauraAmount,afterF:sf,afterI:si});
        }
      }else{
        // 目前雷達不足：先處理全部目前可用雷達。
        applyHarvest(available);
        // 若 Laura 尚未使用，處理完目前雷達後立即使用 Laura。
        if(hasLaura&&!lauraUsed){
          applyLaura(); lauraUsed=true;
          events.push({type:'laura',day:d,minute:m,delta:lauraAmount,afterF:sf,afterI:si});

          // Step 5：Laura 完成後立即重新評估「剩餘需求」。
          // 若 Laura 後目前已有足夠雷達，必須在同一個可操作時間立即完成剩餘需求；
          // 只有仍然不足時，才等待下一次刷新／可操作時間。
          const remainingAfterLaura=Math.max(0,target-processed);
          if(remainingAfterLaura>0 && sf+si>0){
            applyHarvest(Math.min(remainingAfterLaura,sf+si));
          }
        }
      }
    }
  }
  const hasOperation=uniqueOps.length>0;
  const feasible=processed>=target && (!score || uniqueOps.some(m=>m>=960)) && (!dayBefore || hasOperation) && (!hasLaura || lauraUsed);
  return {events,processed,lauraUsed,feasible,endF:sf,endI:si};
}
function scheduleWeek(MAX,av){
  const ls=getLauraSettings(), rows=[], impossible=[];

  // v8.3.7：週期承接與安全線分層。
  // 週期 A：星期二→星期三→星期四→星期五。
  // 週期 B：星期六→星期日→星期一。
  // 因此畫面上的星期一必須直接承接「上一個星期日」的實際結束狀態，
  // 不能在每個星期一重新套用 11／MAX-8。
  // 本次只修正週期承接；v8.3.7 的一般日／隔日安全線保留。

  function choosePrep(d,field,inv){
    const dailyMin=(d===1||d===5)?12:20;
    const dayBefore=(d===3||d===6);
    const baseR={
      d,
      scoring:false,
      windows:dayWindows(av,d),
      max:MAX,
      dailyMin,
      lauraAmount:ls.lauraAmount,
      hasLaura:ls.hasLaura,
      process:dailyMin,
      minProcess:dailyMin
    };

    if(dayBefore){
      // v8.3.7：星期四／星期日必須把勞拉後到下一個衝分日第一次操作前的刷新全部納入安全線。
      const maxCandidate=Math.max(dailyMin,MAX+24+ls.lauraAmount+24);
      let chosen=null;
      for(let p=dailyMin;p<=maxCandidate;p++){
        const candidate={...baseR,process:p,minProcess:dailyMin};
        const test=simulateDay(d,field,inv,candidate,av);
        if(!test.feasible)continue;

        const lauraEvent=(test.events||[]).find(e=>e.type==='laura');
        const startAbs=d*1440+(lauraEvent?lauraEvent.minute:1439);
        let safe=true;
        if(lauraEvent && lauraEvent.afterI>MAX) safe=false;
        if(!safe)continue;

        const nextScoreDay=d===6?7:4;
        const scoreDayIndex=((nextScoreDay%7)+7)%7;
        const nextScoreWindow=(dayWindows(av,scoreDayIndex)||[]).find(w=>w.start<=w.end);
        const endAbs=nextScoreWindow
          ? nextScoreDay*1440+nextScoreWindow.start
          : (d+1)*1440+960;

        let sf=test.endF,si=test.endI;
        if(lauraEvent){sf=lauraEvent.afterF;si=lauraEvent.afterI;}
        for(let abs=Math.floor(startAbs/480)*480+480;abs<=endAbs;abs+=480){
          let add=8;
          if(sf<8){const fill=Math.min(8-sf,add);sf+=fill;add-=fill;}
          si+=add;
          if(si>MAX){safe=false;break;}
        }
        if(!safe)continue;

        chosen={...candidate};
        break;
      }
      return chosen||baseR;
    }

    // v8.3.7：一般日安全線。
    // 找出「最少處理量」使：
    // 1. 每日最低處理量完成；
    // 2. 每次刷新後儲存 <= MAX；
    // 3. 勞拉完成後儲存 <= MAX；
    // 4. 23:59:59 儲存 <= MAX-8。
    const maxCandidate=Math.max(dailyMin,MAX+24+ls.lauraAmount+40);
    let chosen=null;
    for(let p=dailyMin;p<=maxCandidate;p++){
      const candidate={...baseR,process:p,minProcess:dailyMin};
      const test=simulateDay(d,field,inv,candidate,av);
      if(!test.feasible)continue;

      const refreshUnsafe=(test.events||[]).some(e=>e.type==='refresh'&&e.afterI>MAX);
      if(refreshUnsafe)continue;
      const lauraUnsafe=(test.events||[]).some(e=>e.type==='laura'&&e.afterI>MAX);
      if(lauraUnsafe)continue;
      const endSafeLimit=Math.max(0,MAX-8);
      if(test.endI>endSafeLimit)continue;

      chosen={...candidate};
      break;
    }
    return chosen||baseR;
  }

  // 先計算「上一個星期六→星期日」的週期 B，
  // 得到本週星期一真正應該承接的起始狀態。
  // 上一個星期五衝分日結束後視為 0／0，再由星期六開始連續推進。
  let priorField=0,priorInv=0;
  for(const d of [5,6]){
    const r=choosePrep(d,priorField,priorInv);
    const sim=simulateDay(d,priorField,priorInv,r,av);
    priorField=sim.endF;
    priorInv=sim.endI;
  }

  // 星期一直接承接上一個星期日的實際結束狀態。
  let field=priorField,inv=priorInv;

  for(let d=0;d<7;d++){
    let r;
    if(d===0||d===4){
      // 衝分日不重新套用固定 11／MAX-8；從實際起始狀態出發。
      const total=field+inv+24+ls.lauraAmount;
      r={
        d,
        scoring:true,
        windows:dayWindows(av,d),
        max:MAX,
        startF:field,
        startI:inv,
        total,
        lauraAmount:ls.lauraAmount,
        hasLaura:ls.hasLaura
      };
    }else{
      r=choosePrep(d,field,inv);
    }

    const sim=simulateDay(d,field,inv,r,av);
    r.startF=field;
    r.startI=inv;
    r.events=sim.events;
    r.simProcessed=sim.processed;
    r.simFeasible=sim.feasible;
    r.endSimF=sim.endF;
    r.endSimI=sim.endI;

    field=sim.endF;
    inv=sim.endI;

    if(!sim.feasible){
      impossible.push(`${weekNames[d]}：目前可操作時間不足，無法當日完成規劃。`);
    }
    rows.push(r);
  }

  // 額外提供目前星期日→下一個星期一的銜接狀態，方便直接驗證週期連續性。
  const sunday=rows.find(r=>r.d===6);
  if(sunday){
    sunday.nextMondayF=sunday.endSimF;
    sunday.nextMondayI=sunday.endSimI;
    sunday.nextMondayTargetF=sunday.endSimF;
    sunday.nextMondayTargetI=sunday.endSimI;
    sunday.nextMondayContinuous=true;
  }

  return {rows,impossible};
}
function eventDisplay(e,av){return gameMomentToDisplay(e.day,e.minute,av);}
function operationWindowForEvent(e,av){
  const rows=dayWindows(av,e.day)||[];

  return rows.find(w=>e.minute>=w.start&&e.minute<=w.end)||null;
}
function formatGameRange(day,start,end,av){
  const a=gameMomentToDisplay(day,start,av);
  if(av.mode==='game'){
    const displayEnd=end<1440&&[480,960].includes(end)?end-1:end;
    const b=gameMomentToDisplay(day,displayEnd,av);
    return `${a.dateLabel} ${a.time}–${b.time}`;
  }
  // 當地時間模式必須先判斷「結束的遊戲瞬間」是否就是刷新瞬間，再往前退 1 分鐘；
  // 不直接用當地顯示時間判斷，避免跨日／時區時把刷新邊界算錯。
  const endBoundary=new Date(Date.UTC(av.mon.getUTCFullYear(),av.mon.getUTCMonth(),av.mon.getUTCDate()+day,0,0)+end*60000);
  const utcEndMs=endBoundary.getTime()+2*3600000;
  const localEnd=localParts(new Date(utcEndMs),av.tz);
  let b;
  if(end<1440&&[480,960].includes(end)){
    const prevGameMinute=end-1;
    b=gameMomentToDisplay(day,prevGameMinute,av);
  }else{
    b={dateLabel:`${localEnd.month}/${localEnd.day}`,time:`${localEnd.hour}:${localEnd.minute}`};
  }
  const sameDate=a.dateLabel===b.dateLabel;
  return sameDate?`${a.dateLabel} ${a.time}–${b.time}`:`${a.dateLabel} ${a.time}–${b.dateLabel} ${b.time}`;
}
function formatOperationRange(e,av){
  const w=operationWindowForEvent(e,av);
  if(!w)return `${eventDisplay(e,av).dateLabel} ${eventDisplay(e,av).time}`;
  // 若這個操作是在 00:00／08:00／16:00 系統刷新後才能開始，排程區間從刷新時間開始顯示；一般第一個操作則沿用完整可操作區間。
  const start=[0,480,960].includes(e.minute) ? Math.max(w.start,e.minute) : w.start;

function operationStepText(e,av,index,total){

  if(e.type==='laura') return `${prefix}點擊勞拉`;

function renderEventGroups(events,av){
  let html='';
  let i=0;
  while(i<events.length){
    const e=events[i];
    if(e.type==='refresh'){
      const x=eventDisplay(e,av);
      html+=`<div class="event refresh"><div class="event-time">${x.dateLabel} ${x.time}</div><div class="event-action">刷新雷達 → 場上 ${e.afterF}、儲存 ${e.afterI}</div></div>`;
      i++; continue;
    }
    const segStart=[0,480,960].filter(x=>x<=e.minute).pop()??0;
    const group=[];
    while(i<events.length && events[i].type!=='refresh'){
      const g=events[i], gs=[0,480,960].filter(x=>x<=g.minute).pop()??0;
      if(gs!==segStart) break;
      group.push(g); i++;
    }
    const first=group[0], w=operationWindowForEvent(first,av);
    const start=Math.max(w?w.start:segStart,segStart);
    const nextRefresh=[480,960,1440].find(x=>x>segStart)??1440;
    const end=Math.min(w?w.end:nextRefresh,nextRefresh);
    const range=formatGameRange(first.day,start,end,av);
    html+=`<div class="operation-block"><div class="operation-range">${range}</div>`;
    group.forEach((g,idx)=>{ const n=group.length>1?`${idx+1}. `:''; html+=`<div class="operation-step">${n}${operationStepText(g,av,idx,group.length)} → 場上 ${g.afterF}、儲存 ${g.afterI}</div>`; });

  }

}
function render(){

   if(!r.simFeasible) html+=`<div class="state warn">⚠️ 目前可操作時間不足，這一天無法完成規劃。</div>`;

function readTimes(container){return [...container.querySelectorAll('.time-row')].map(r=>{const v=r.querySelectorAll('input');return {start:v[0].value,end:v[1].value}}).filter(x=>x.start&&x.end);}
function saveAvailability(){
 const mode=document.querySelector('input[name=timeMode]:checked').value;const apply=document.querySelector('input[name=applyMode]:checked').value;
 const data={timeMode:mode,applyMode:apply,same:readTimes(document.querySelector('#sameDayTimes')),custom:[...document.querySelectorAll('.dayTimes')].map(x=>readTimes(x))};
 localStorage.setItem(timeStoreKey,JSON.stringify(data));
}
function autoPlanIfReady(){
 const raw=$('#max').value.trim();
 const v=Number(raw);
 if(Number.isInteger(v)&&v>=8){render();return;}
 if(raw===''){$('#out').innerHTML='<div class="panel empty">輸入儲存上限後會自動規劃</div>';return;}
 $('#out').innerHTML='<div class="panel empty">請輸入至少 8 的整數儲存上限。</div>';
}
function autoSaveAvailability(){
 if(document.querySelector('#sameDayTimes')){saveAvailability();autoPlanIfReady();}
}
function loadAvailability(){
 try{
  const d=JSON.parse(localStorage.getItem(timeStoreKey));if(!d)return;
  if(d.timeMode)document.querySelector(`input[name=timeMode][value="${d.timeMode}"]`).checked=true;
  if(d.applyMode)document.querySelector(`input[name=applyMode][value="${d.applyMode}"]`).checked=true;
  const same=document.querySelector('#sameDayTimes');
  if(Array.isArray(d.same)&&d.same.length){same.innerHTML=d.same.map(x=>timeRow(x.start,x.end)).join('');}
  if(Array.isArray(d.custom))d.custom.forEach((arr,i)=>{const box=document.querySelector(`.dayTimes[data-day="${i}"]`);if(box&&arr.length)box.innerHTML=arr.map(x=>timeRow(x.start,x.end)).join('');});
  bindDelete();bindTimeInputs();
 }catch(e){}
}
function toggleApply(){const m=document.querySelector('input[name=applyMode]:checked').value;document.querySelector('#sameTimes').hidden=m!=='same';document.querySelector('#customTimes').hidden=m!=='custom';autoSaveAvailability();}
renderTimes();loadAvailability();toggleApply();document.querySelectorAll('input[name=applyMode]').forEach(x=>x.onchange=toggleApply);document.querySelectorAll('input[name=timeMode]').forEach(x=>x.onchange=autoSaveAvailability);autoPlanIfReady();
</script>
</body></html>
