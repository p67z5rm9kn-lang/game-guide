<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雷達規劃核心｜直接照做 v10</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:14px}.wrap{max-width:680px;margin:auto}.title{font-size:21px;font-weight:800;color:#d9b45d}.sub{font-size:13px;line-height:1.65;color:#aeb9c8;margin:6px 0 12px}.card{background:#0d1928;border:1px solid #293a51;border-radius:14px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:#b9c4d2;margin-bottom:4px}input,select,button{width:100%;border:1px solid #52627d;border-radius:9px;background:#101d2d;color:#fff;padding:9px;font-size:14px}button{margin-top:10px;background:#8b6a28;border-color:#c59b45;font-weight:800}.state{background:#091522;border-radius:10px;padding:10px;margin:7px 0;line-height:1.65}.day{border:1px solid #2b3d54;border-radius:12px;margin:10px 0;overflow:hidden}.dayhead{background:#0b1726;padding:10px 11px;font-weight:800;color:#d9b45d}.action{padding:11px;border-top:1px solid #203047;line-height:1.6}.action:first-of-type{border-top:0}.do{color:#8fe0a4;font-weight:800}.wait{color:#9fc1df;font-weight:800}.system{color:#8fc7ff;font-weight:800}.laura{color:#ffd36b;font-weight:800}.score{color:#d9b45d;font-weight:900}.small{font-size:12px;color:#aeb9c8}.big{font-size:19px;font-weight:900}.ok{color:#8fe0a4}.warn{color:#ffd36b}.bad{color:#ff9b9b}.detail summary{cursor:pointer;color:#d9b45d;font-weight:800}.detail{font-size:12px;color:#aeb9c8;line-height:1.6}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#18283d;color:#d9b45d;font-size:11px;margin-right:4px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="title">雷達規劃核心｜直接照做 v10</div>
<div class="sub">這一版不再把計算過程塞給你。按下計算後，只看「哪一天、什麼時間、要做什麼」，並在每個動作後顯示「場上／庫存」。每日完成 20 個與衝分日前資源保留會分開計算。</div>
<div class="card"><div class="grid">
<div><label>庫存 MAX</label><input id="max" type="number" value="30" min="1"></div>
<div><label>目前庫存</label><input id="inv" type="number" value="22" min="0"></div>
<div><label>目前場上</label><input id="field" type="number" value="8" min="0"></div>
<div><label>已完成（場上內）</label><input id="completed" type="number" value="0" min="0"></div>
<div style="grid-column:1/-1"><label>目前時間</label><input id="now" type="datetime-local" value="2026-09-27T11:27"></div>
<div><label>目標場上（衝分日前）</label><input id="targetField" type="number" value="11" min="0"></div>
<div><label>目標庫存（自動＝MAX−8）</label><input id="targetInv" type="number" value="22" readonly></div>
<div><label>勞拉星數</label><select id="star"><option value="0">0★（+5）</option><option value="1">1★（+10）</option><option value="2">2★（+10）</option><option value="3">3★（+10）</option><option value="4" selected>4★（+20）</option><option value="5">5★（+20）</option></select></div>
<div><label><input id="hasLaura" type="checkbox" checked style="width:auto;margin-right:6px">今天有可用勞拉</label></div>
</div><button id="calc">開始規劃</button></div>
<div id="result" class="card"><span class="small">尚未規劃。</span></div>
<details class="card detail"><summary>查看計算明細／測試</summary><div id="tests" style="margin-top:9px">尚未執行。</div></details>
</div>
<script>
const $=id=>document.getElementById(id), LAURA=[5,10,10,10,20,20];
function clone(d){return new Date(d.getTime())}
function fmt(d){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function dateOnly(d,h=0){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0,0,0)}
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function gameDayKey(d){const x=clone(d);if(x.getHours()<10)x.setDate(x.getDate()-1);return dayKey(x)}
function gameDayStart(d){const x=clone(d);if(x.getHours()<10)x.setDate(x.getDate()-1);return dateOnly(x,10)}
function nextScore(now){for(let i=0;i<10;i++){const d=dateOnly(new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),10);if((d.getDay()===1||d.getDay()===5)&&d>=now)return d}return null}
function systemEvents(now,target){const out=[];const base=dateOnly(now,0);for(let i=0;i<8;i++){const day=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i);for(const h of [2,10,18]){const e=dateOnly(day,h);if(e>now&&e<target)out.push(e)}}return out.sort((a,b)=>a-b)}
function applySystem(s){let out={...s},a=8;const fill=Math.min(a,Math.max(0,8-out.field));out.field+=fill;a-=fill;const room=Math.max(0,out.max-out.inventory);const add=Math.min(a,room);out.inventory+=add;out.waste=a-add;return out}
function processState(s,n){if(n<=0)return {...s};const total=s.field+s.inventory-n;if(total<0)return null;return {...s,field:Math.min(8,total),inventory:Math.max(0,total-8),waste:0}}
function applyLaura(s,a){if(a<=0)return {...s};let out={...s};let rem=a;if(out.field<8){const fill=Math.min(rem,8-out.field);out.field+=fill;rem-=fill}else{out.field+=3;rem-=3}out.inventory+=Math.max(0,rem);out.waste=0;return out}
function syncTarget(){const m=+$('max').value;$('targetInv').value=Number.isFinite(m)&&m>0?Math.max(0,m-8):0}
function parse(){syncTarget();return{max:+$('max').value,inv:+$('inv').value,field:+$('field').value,completed:+$('completed').value,now:new Date($('now').value),tf:+$('targetField').value,ti:+$('targetInv').value,star:+$('star').value,hasToday:$('hasLaura').checked}}
function validate(x){const e=[];if(!Number.isFinite(x.max)||x.max<=0)e.push('MAX 必須 > 0');if(!Number.isFinite(x.inv)||x.inv<0)e.push('目前庫存不可 < 0');if(!Number.isFinite(x.field)||x.field<0)e.push('目前場上不可 < 0');if(!Number.isFinite(x.completed)||x.completed<0||x.completed>x.field)e.push('已完成必須介於 0 與目前場上之間');if(Number.isNaN(x.now.getTime()))e.push('目前時間無效');if(x.tf<0||x.ti<0||x.ti>x.max)e.push('目標狀態無效');return e}
function gameDays(now,score){const out=[];let d=gameDayStart(now);while(d<score){out.push(clone(d));d.setDate(d.getDate()+1)}return out}
function eventsForDay(events,gd){const k=dayKey(gd);return events.filter(e=>gameDayKey(e)===k)}
function canLauraToday(x,gd){return LAURA[x.star]>0&&(dayKey(gd)!==gameDayKey(x.now)||x.hasToday)}
function stateText(s){return '場上 '+s.field+'｜庫存 '+s.inventory}
function actionHtml(time,kind,title,detail,state){let cls=kind==='do'?'do':kind==='system'?'system':kind==='laura'?'laura':kind==='score'?'score':'wait';return `<div class="action"><div class="${cls}">${title}</div><div>${detail||''}</div>${state?`<div class="small">動作後：${stateText(state)}</div>`:''}</div>`}
function buildPlan(x,score,events){
 const days=gameDays(x.now,score), amount=LAURA[x.star], availableLaura=days.filter(d=>canLauraToday(x,d));
 const totalAvailable=x.field+x.inv+events.length*8+amount*availableLaura.length;
 const finalTotal=x.tf+x.ti;
 const processTotal=totalAvailable-finalTotal;
 if(processTotal<0)throw new Error('資源不足：目前資源、準備期 +8 與可用勞拉仍不足以達到衝分日前目標。');
 const dailyNeed=days.map((d,i)=>Math.max(0,20-(i===0?x.completed:0)));
 const requiredDaily=dailyNeed.reduce((a,b)=>a+b,0);
 if(processTotal<requiredDaily)throw new Error('無法同時滿足每日完成 20 個與衝分日前目標：可處理總量不足。');
 let s={field:x.field,inventory:x.inv,max:x.max}, processed=0, doneToday=x.completed, plan=[];
 function add(time,kind,title,detail){plan.push({time,kind,title,detail,state:{field:s.field,inventory:s.inventory}})}
 function doProcess(n,taskCount,label,time){if(n<=0)return;const before=s;s=processState(s,n);if(!s)throw new Error('模擬處理量超過目前可用雷達。');processed+=n;const task=Math.min(n,taskCount);doneToday+=task;add(time,'do',label,task>0?`今日任務 +${task}`:'今日任務已達成');}
 // For every game day except the last: complete the daily minimum early; apply system +8 events; use Laura late enough to preserve the next +8.
 for(let di=0;di<days.length;di++){
   const gd=days[di], last=di===days.length-1, evs=eventsForDay(events,gd);
   const dayStart=di===0?x.now:dateOnly(gd,10);
   const need=dailyNeed[di];
   if(need>0){
      // Future game day starts with its 10:00 +8 if present.
      const e10=evs.find(e=>e.getHours()===10);
      if(e10 && e10.getTime()===dayStart.getTime()){s=applySystem(s);add(e10,'system','系統 +8（不用操作）','今日遊戲日開始');}
      doProcess(need,need,`🔵 完成並收割 ${need} 個雷達`,dayStart);
   }else if(di>0){
      const e10=evs.find(e=>e.getHours()===10);if(e10&&e10.getTime()===dayStart.getTime()){s=applySystem(s);add(e10,'system','系統 +8（不用操作）','今日遊戲日開始');}
   }
   for(const e of evs.filter(e=>e.getTime()>dayStart.getTime())){
      // Last day: do not use Laura before the final 02:00 event. Earlier days can use Laura after 18:00.
      if(e.getHours()===18){s=applySystem(s);add(e,'system','系統 +8（不用操作）','18:00 自動取得 +8');
         if(!last && canLauraToday(x,gd)&&amount>0){
            // Make the next 02:00 +8 safe before using Laura.
            const nextEv=events.find(z=>z>e&&z.getHours()===2&&gameDayKey(z)===gameDayKey(gd));
            if(nextEv){let test=applyLaura(s,amount);let safe=applySystem(test);if(safe.waste>0){const need=Math.min(s.inventory+Math.max(0,8-s.field),safe.waste);if(need>0){doProcess(need,0,`🔵 額外收割 ${need} 個（避免下一次 +8 浪費）`,new Date(e.getTime()+1*60000));test=applyLaura(s,amount);safe=applySystem(test)}}}
            s=applyLaura(s,amount);add(new Date(e.getTime()+1*60000),'laura',`🟡 點擊勞拉（+${amount}）`,'今天的勞拉在此使用');
         }
         continue;
      }
      if(e.getHours()===2){s=applySystem(s);add(e,'system','系統 +8（不用操作）','02:00 自動取得 +8');continue;}
      if(e.getHours()===10){/* already handled at day start */continue;}
   }
   if(last){
      // Remaining processing is done after the final prep +8, then Laura, then stop processing.
      const preF=Math.max(0,x.tf-3), preI=Math.max(0,x.ti-(amount>0?amount-3:0));
      const targetBeforeLauraTotal=preF+preI;
      if(amount>0&&x.tf>=11){
         const need=Math.max(0,s.field+s.inventory-targetBeforeLauraTotal);
         if(need>0){doProcess(need,0,`🔵 完成並收割 ${need} 個雷達（今日任務已達成）`,new Date(score.getTime()-2*60*1000));}
         if(s.field!==preF||s.inventory!==preI)throw new Error('無法把最後一次勞拉前狀態整理到指定位置。');
         s=applyLaura(s,amount);add(new Date(score.getTime()-60000),'laura',`🟡 點擊勞拉（+${amount}）`,'最後一次勞拉；之後不再收割');
      }else{
         const need=Math.max(0,s.field+s.inventory-finalTotal);if(need>0)doProcess(need,0,`🔵 完成並收割 ${need} 個雷達（今日任務已達成）`,new Date(score.getTime()-2*60000));
         if(s.field!==x.tf||s.inventory!==x.ti)throw new Error('無法整理到衝分日前目標狀態。');
      }
   }
 }
 // Add scoring event as final checkpoint.
 const scoreState=applySystem(s); // scoring day +8
 plan.push({time:score,kind:'score',title:'🏆 衝分日 10:00：系統 +8（不用操作）',detail:'進入衝分狀態',state:{field:scoreState.field,inventory:scoreState.inventory}});
 if(scoreState.waste>0)throw new Error('衝分日 10:00 會浪費 +8，策略不合法。');
 if(processed!==processTotal)throw new Error(`策略處理量 ${processed} 與應處理 ${processTotal} 不一致。`);
 return {plan,days,amount,availableLaura,processTotal,totalAvailable,finalTotal,requiredDaily};
}
function groupPlan(plan){const map=new Map();for(const a of plan){const k=dayKey(a.time);if(!map.has(k))map.set(k,[]);map.get(k).push(a)}return [...map.entries()].map(([k,items])=>({k,items}))}
function calc(){const btn=$('calc');btn.disabled=true;btn.textContent='規劃中…';try{const x=parse(),errs=validate(x);if(errs.length)throw new Error(errs.join('；'));const score=nextScore(x.now);if(!score)throw new Error('找不到下一個週一／週五 10:00 衝分日。');const events=systemEvents(x.now,score);const r=buildPlan(x,score,events);
 let h=`<div class="state"><span class="pill">直接照做</span><span class="big">🏆 下一個衝分日：${fmt(score)}</span><br><span class="small">衝分日前最後狀態：場上 ${x.tf}｜庫存 ${x.ti}　→　10:00 +8 後：場上 ${x.tf}｜庫存 ${x.ti+8}</span></div>`;
 h+=`<div class="row"><b class="gold">先看這三件事</b><br><span class="ok">① 每個遊戲日完成至少 20 個</span><br><span class="ok">② 需要收割時才收割，不用固定每天收一樣多</span><br><span class="ok">③ 最後一次勞拉後不要再收割，直接留到衝分</span></div>`;
 for(const g of groupPlan(r.plan)){const d=new Date(g.k+'T12:00:00');const isScore=g.k===dayKey(score);h+=`<div class="day"><div class="dayhead">${isScore?'🏆 ': '📅 '}${d.toLocaleDateString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'})}</div>`;for(const a of g.items){h+=actionHtml(a.time,a.kind,fmt(a.time)+'　'+a.title,a.detail,a.state)}h+='</div>'}
 h+=`<div class="state"><b class="gold">這次規劃的總量</b><br>準備期間可取得：${r.totalAvailable} 個<br>衝分日前需要保留：${r.finalTotal} 個<br><span class="big">需要完成並收割：${r.processTotal} 個</span><br><span class="small">每日完成 20 個是任務條件；上面的「完成並收割」是資源處理量，兩者不是同一個數字。</span></div>`;
 $('result').innerHTML=h;runTests();btn.disabled=false;btn.textContent='重新規劃';}catch(e){$('result').innerHTML=`<span class="bad">❌ ${e.message}</span>`;runTests();btn.disabled=false;btn.textContent='重新規劃';}}
function runTests(){const o=[];const T=(n,b)=>o.push((b?'✅ ':'❌ ')+n);const n=new Date('2026-09-27T11:27'),s=nextScore(n);T('9/27 下一個衝分日為 9/28 10:00',s&&s.getDate()===28&&s.getHours()===10);T('9/27 準備期 +8 為 18:00、02:00',systemEvents(n,s).length===2);const x={max:30,inv:22,field:8,completed:0,now:n,tf:11,ti:22,star:4,hasToday:true};try{const r=buildPlan(x,s,systemEvents(n,s));T('MAX30 9/27 處理量 33',r.processTotal===33);T('MAX30 9/27 有1次勞拉',r.availableLaura.length===1)}catch(_){T('MAX30 9/27 規劃可建立',false)}const n2=new Date('2026-09-26T11:27'),s2=nextScore(n2),x2={max:46,inv:22,field:8,completed:0,now:n2,tf:11,ti:38,star:4,hasToday:true};try{const r2=buildPlan(x2,s2,systemEvents(n2,s2));T('MAX46 9/26 處理量 61',r2.processTotal===61);T('MAX46 9/26 有2次勞拉',r2.availableLaura.length===2)}catch(_){T('MAX46 9/26 規劃可建立',false)}T('MAX40 目標庫存為32',40-8===32);$('tests').innerHTML=o.join('<br>')+'<br><br>v10 只顯示可執行流程；這裡的測試僅供確認程式本身。'}
$('max').addEventListener('input',syncTarget);syncTarget();$('calc').addEventListener('click',calc);
</script>
</body></html>
