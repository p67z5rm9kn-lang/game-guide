<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃核心｜遊戲日時間基準 v3</title>

<style>
body{
  margin:0;
  background:#071522;
  color:#eef4fa;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  padding:18px;
}

.wrap{
  max-width:720px;
  margin:auto;
}

.card{
  background:#0b1d2b;
  border:1px solid #304a61;
  border-radius:16px;
  padding:18px;
  margin:14px 0;
}

h1{
  color:#e9b53b;
  font-size:24px;
  margin:0 0 10px;
}

h2{
  font-size:18px;
  color:#e9b53b;
}

p{
  line-height:1.65;
  color:#cbd7e2;
}

.row{
  display:grid;
  gap:8px;
  margin:12px 0;
}

label{
  font-weight:700;
}

.box,
button,
select{
  width:100%;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid #5b7289;
  background:#102538;
  color:#fff;
  padding:13px;
  font-size:16px;
}

button{
  background:#b48627;
  border-color:#d4a83b;
  font-weight:800;
}

.result{
  border-left:4px solid #39d98a;
  padding-left:12px;
}

.event{
  padding:12px;
  margin:10px 0;
  background:#091925;
  border:1px solid #294156;
  border-radius:12px;
}

.ok{
  color:#59e39b;
  font-weight:800;
}

.warn{
  color:#ffd36a;
  font-weight:800;
}

small{
  color:#9fb0c0;
}
</style>
</head>

<body>

<div class="wrap">

<h1>雷達規劃核心｜遊戲日時間基準 v3</h1>

<p>
本版先固定一件事：
<b>所有計算以遊戲時間 UTC−2 為唯一基準</b>。
台灣時間只是顯示方式。
遊戲日 9/27 00:00–23:59
=
台灣 9/27 10:00–9/28 09:59。
</p>

<div class="card">

<h2>目前資料</h2>

<div class="row">
<label>目前時間（台灣時間）</label>
<input
  id="local"
  class="box"
  type="datetime-local"
  value="2026-09-27T11:27">
</div>

<div class="row">
<label>顯示方式</label>

<select id="display">
  <option value="tw">台灣時間</option>
  <option value="game">遊戲時間 UTC−2</option>
</select>

</div>

<button id="run">
檢查遊戲日時間軸
</button>

</div>

<div id="out"></div>

</div>


<script>

function pad(n){
  return String(n).padStart(2,"0");
}


/*
  將使用者輸入的「台灣時間」
  轉成帶有 +08:00 的 Date。

  這裡只把台灣時間當作輸入方式，
  後續計算全部使用絕對時間。
*/
function parseLocal(s){

  return new Date(
    s + ":00+08:00"
  );

}


/*
  顯示時間。

  tw：
    台灣時間 UTC+8

  game：
    遊戲時間 UTC−2
*/
function fmt(d,mode){

  const offset =
    mode === "game"
    ? -2
    : 8;

  const ms =
    d.getTime() +
    offset * 3600 * 1000;

  const x =
    new Date(ms);

  const y =
    x.getUTCFullYear();

  const m =
    pad(x.getUTCMonth()+1);

  const day =
    pad(x.getUTCDate());

  const h =
    pad(x.getUTCHours());

  const mi =
    pad(x.getUTCMinutes());

  return `${y}/${m}/${day} ${h}:${mi}`;

}


/*
  取得某一時間在「遊戲時間 UTC−2」
  下的日期與時間。
*/
function gameParts(d){

  const ms =
    d.getTime() -
    2 * 3600 * 1000;

  const x =
    new Date(ms);

  return {

    y:x.getUTCFullYear(),

    m:x.getUTCMonth(),

    day:x.getUTCDate(),

    h:x.getUTCHours(),

    mi:x.getUTCMinutes()

  };

}


/*
  遊戲日日期。
*/
function gameDateLabel(d){

  const p =
    gameParts(d);

  return `${p.y}/${pad(p.m+1)}/${pad(p.day)}`;

}


/*
  主程式
*/
function run(){

  const now =
    parseLocal(
      document.getElementById("local").value
    );

  const mode =
    document.getElementById("display").value;


  if(isNaN(now)){

    document.getElementById("out").innerHTML =
      `<div class="card">
        <div class="warn">
          時間格式錯誤
        </div>
      </div>`;

    return;

  }


  /*
    取得目前遊戲日。
  */
  const p =
    gameParts(now);


  /*
    遊戲日 00:00 的絕對時間。

    UTC−2 00:00
    = UTC 02:00
  */
  const dayStartGame =
    new Date(
      Date.UTC(
        p.y,
        p.m,
        p.day,
        2,
        0,
        0
      )
    );


  /*
    台灣時間的遊戲日開始：

    遊戲 00:00
    =
    台灣 10:00
  */
  const dayStartTW =
    new Date(
      dayStartGame.getTime()
      +
      10 * 3600 * 1000
    );


  /*
    下一個遊戲日開始。
  */
  const nextDay =
    new Date(
      dayStartTW.getTime()
      +
      24 * 3600 * 1000
    );


  /*
    找目前遊戲日之後的 +8。

    遊戲時間：

    00:00
    08:00
    16:00

    對應台灣：

    10:00
    18:00
    隔日 02:00
  */

  const all = [];

  let base =
    dayStartGame;


  for(let k=0;k<5;k++){

    [0,8,16].forEach(h=>{

      const ev =
        new Date(
          base.getTime()
          +
          h * 3600 * 1000
        );

      if(
        ev > now &&
        all.length < 3
      ){

        all.push(ev);

      }

    });


    base =
      new Date(
        base.getTime()
        +
        24 * 3600 * 1000
      );

  }


  /*
    找下一個衝分日。

    遊戲時間的星期一、星期五
    00:00 開始。
  */

  let cursor =
    new Date(dayStartGame);

  let scoring =
    null;


  for(let i=0;i<8;i++){

    const wd =
      cursor.getUTCDay();


    if(
      (wd === 1 || wd === 5)
      &&
      cursor > now
    ){

      scoring =
        new Date(cursor);

      break;

    }


    cursor =
      new Date(
        cursor.getTime()
        +
        24 * 3600 * 1000
      );

  }


  /*
    輸出結果。
  */

  let html = `

  <div class="card">

    <h2>時間基準結果</h2>

    <div class="result">

      <div class="ok">
        目前屬於遊戲日：
        ${gameDateLabel(now)}
      </div>

      <div>
        遊戲日範圍（台灣）：
        ${gameDateLabel(dayStartTW)}
        10:00 ～ 
        ${gameDateLabel(nextDay)}
        09:59
      </div>

      <div>
        目前時間：
        ${fmt(now,mode)}
        （${mode === "tw"
          ? "台灣時間"
          : "遊戲時間 UTC−2"}）
      </div>

    </div>


    <p>
      例如台灣 9/27 23:59
      與台灣 9/28 00:00，
      仍然都是遊戲日
      ${gameDateLabel(now)}。
    </p>

  </div>

  `;


  /*
    顯示接下來的 +8。
  */

  html += `

  <div class="card">

    <h2>接下來的系統 +8</h2>

  `;


  all.forEach((ev,i)=>{

    const gp =
      gameParts(ev);


    html += `

      <div class="event">

        <b>+8 #${i+1}</b>

        <br>

        顯示：
        ${fmt(ev,mode)}

        <br>

        遊戲日：
        ${gp.y}/${pad(gp.m+1)}/${pad(gp.day)}
        ${pad(gp.h)}:${pad(gp.mi)}

        <br>

        <span class="ok">

          這次 +8 歸屬於遊戲日
          ${gp.y}/${pad(gp.m+1)}/${pad(gp.day)}

        </span>

      </div>

    `;

  });


  html += `

  </div>

  `;


  /*
    顯示下一個衝分日。
  */

  if(scoring){

    html += `

    <div class="card">

      <h2>下一個衝分日</h2>

      <div class="result">

        <b>
          ${fmt(scoring,mode)}
        </b>

        <br>

        遊戲日：
        ${gameDateLabel(scoring)}
        00:00

        （台灣 10:00）

      </div>

    </div>

    `;

  }


  /*
    固定驗證。
  */

  html += `

  <div class="card">

    <h2>固定驗證</h2>

    <div class="event">

      🟢 <b>驗證 1</b>：

      遊戲日不是以台灣 00:00 換日。

    </div>


    <div class="event">

      🟢 <b>驗證 2</b>：

      台灣 9/27 23:59
      →
      9/28 00:00，

      仍屬同一遊戲日。

    </div>


    <div class="event">

      🟢 <b>驗證 3</b>：

      計算層使用 UTC−2，

      顯示層才轉成台灣時間。

    </div>

  </div>

  `;


  document.getElementById("out").innerHTML =
    html;

}


/*
  只有按下按鈕時重新計算。
*/
document
  .getElementById("run")
  .onclick = run;


/*
  初次載入顯示一次結果。
*/
run();

</script>

</body>
</html>
