ion-range,.event-time{color:#f2d486;font-weight:700;margin-bottom:3px}.operation-step,.event-action{padding:2px 0;font-size:16px}.event.refresh{border-left:3px solid #557a9e;color:#dce8f5}.event.refresh .event-time{color:#f2d486}.schedule-legend,.player-mark,.system-mark{display:none}

<body><main>
<h1>Last Z｜雷達週計劃 v9</h1>
<div class="sub">先設定「玩家可操作時間」。依照玩家可操作時間安排每一步操作與刷新雷達。</div>
<div class="panel setup-panel">
<h2 class="section-title">⚙️ 規劃設定</h2>
<label>時間模式</label>
<div class="modes"><label><input type="radio" name="timeMode" value="game" checked> 遊戲時間</label><label><input type="radio" name="timeMode" value="local"> 當地時間</label></div>
<label>套用方式</label>
<div class="modes"><label><input type="radio" name="applyMode" value="same" checked> 每天相同</label><label><input type="radio" name="applyMode" value="custom"> 每天個別設定</label></div>
<div id="sameTimes"></div>
<div id="customTimes" hidden></div>
<div class="meta">新增、刪除或修改時段後會立即記錄；不需要另外按儲存。若結束時間為 00:00，代表可操作到當日午夜。</div>
<div class="setup-divider"></div>
<label>勞拉</label>
<div class="laura-toggle-row"><label class="switch-label"><input type="checkbox" id="lauraToggle" checked><span class="switch"></span><span>有勞拉</span></label><div id="lauraDetail">
<label for="lauraStar">勞拉幾星</label>
<select id="lauraStar" class="setting-select"><option value="0">0★（+5）</option><option value="1">1★（+10）</option><option value="2">2★（+10）</option><option value="3">3★（+10）</option><option value="4" selected>4★（+20）</option><option value="5">5★（+20）</option></select>
</div></div>
<div class="meta">勞拉數量會依星級直接連動每日排程；無勞拉時，排程不會安排點擊勞拉。</div>
<div class="setup-divider"></div>
<label for="max">儲存上限</label><input id="max" type="number" min="1" step="1" placeholder="例如 30">
<button id="plan">開始規劃</button>
<div class="meta">星期一、星期五為衝分日；星期二～四準備星期五，星期六～日準備下週一。v9 以遊戲時間 UTC−2 作為內部時間軸；當地時間會依裝置時區轉換後再排程。每 8h 刷新 8 個雷達優先於玩家操作。</div>
</div>
<div class="result-heading">📊 規劃結果</div>
<div id="out"><div class="panel empty">輸入儲存上限後開始規劃</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const days=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const LAURA_AMOUNTS={0:5,1:10,2:10,3:10,4:20,5:20};
function getLauraSettings(){
  const has=document.getElementById('lauraToggle')?.checked!==false;
  const star=Number(document.getElementById('lauraStar')?.value||4);
  return {hasLaura:has,lauraStar:star,lauraAmount:has?(LAURA_AMOUNTS[star]??20):0};
}

function calcDailyTarget(startF,startI,MAX,d,lauraAmount){
  // v9：沿用既有資源基準，只把「每日最低處理量」更新為最新確認值。
  // 玩家不會看到這個中間計算，只會看到實際可執行的操作。
  const dailyMin=(d===1||d===5)?12:20;
  const system=24;
  const safety=Math.max(0,startF+startI+system+lauraAmount-8-(MAX-8));
  return Math.max(dailyMin,safety);
}

function makePlan(MAX,lauraAmount,hasLaura){
  const rows=[];
  let field=11,inv=MAX-8;
  for(let d=0;d<7;d++){
    const scoring=(d===0||d===4);
    const dayBefore=(d===3||d===6);
    const startF=field,startI=inv;
    if(scoring){
      rows.push({
        d,scoring,dayBefore,startF,startI,
        target:startF+startI+24+(hasLaura?lauraAmount:0),
        dailyMin:null,lauraAmount:hasLaura?lauraAmount:0,hasLaura,
        endF:0,endI:0
      });
      field=0;inv=0;
    }else{
      const target=calcDailyTarget(startF,startI,MAX,d,hasLaura?lauraAmount:0);
      rows.push({
        d,scoring:false,dayBefore,startF,startI,
        target,dailyMin:(d===1||d===5)?12:20,
        lauraAmount:hasLaura?lauraAmount:0,hasLaura
      });
      // endF/endI 由 v9 事件模擬決定，下一天會接續實際模擬狀態。
      field=startF;inv=startI;
    }
  }
  return rows;
}

function simulateDay(d,startF,startI,r,av){
  const events=[];
  const score=(d===0||d===4), dayBefore=(d===3||d===6);
  const lauraAmount=r.lauraAmount||0, hasLaura=!!r.hasLaura;
  let sf=startF,si=startI,processed=0,lauraUsed=false;

  const applyRefresh=()=>{
    let add=8;
    if(sf<8){const fill=Math.min(8-sf,add);sf+=fill;add-=fill;}
    si+=add;
  };
  const applyHarvest=(qty,reason='完成／收割')=>{
    const want=Math.max(0,Math.min(qty,sf+si));
    if(want<=0)return 0;
    let q=want;
    const fromField=Math.min(sf,q);
    sf-=fromField;q-=fromField;
    si=Math.max(0,si-q);
    // 儲存有雷達且場上低於 8 時，會自動補回場上。
    if(sf<8&&si>0){
      const fill=Math.min(8-sf,si);
      sf+=fill;si-=fill;
    }
    processed+=want;
    events.push({type:'harvest',day:d,minute:currentMinute,qty:want,reason,afterF:sf,afterI:si});
    return want;
  };
  const applyLaura=()=>{
    let add=lauraAmount;
    if(sf<8){
      const fill=Math.min(8-sf,add);
      sf+=fill;add-=fill;
    }else{
      const toField=Math.min(3,add);
      sf+=toField;add-=toField;
    }
    si+=add;
    events.push({type:'laura',day:d,minute:currentMinute,delta:lauraAmount,afterF:sf,afterI:si});
    lauraUsed=true;
  };

  const opTimes=[];
  for(const w of dayWindows(av,d)){
    if(w.start===w.end)continue;
    opTimes.push(w.start);
    for(const m of [480,960]) if(m>w.start&&m<w.end)opTimes.push(m);
  }
  const uniqueOps=[...new Set(opTimes)].sort((a,b)=>a-b);
  const timeline=[0,480,960].map(minute=>({type:'refresh',minute}));
  uniqueOps.forEach(minute=>timeline.push({type:'op',minute}));
  timeline.sort((a,b)=>a.minute-b.minute||(a.type==='refresh'?-1:1));

  let currentMinute=0;
  for(const node of timeline){
    currentMinute=node.minute;

    // 同一時間點固定：日切換 → 系統刷新 → 玩家操作。
    if(node.type==='refresh'){
      applyRefresh();
      events.push({type:'refresh',day:d,minute:node.minute,delta:8,afterF:sf,afterI:si});
      continue;
    }
    if(!inWindow(d,currentMinute,av))continue;

    if(score){
      // 衝分日：最早可操作時間先收割當下場上＋儲存全部雷達，再點勞拉。
      // 勞拉產生的新雷達也要在當天衝分，因此後續可再收割。
      if(!lauraUsed){
        applyHarvest(sf+si,'衝分日前已存在雷達全部收割');
        if(hasLaura)applyLaura();
      }
      if(processed<r.target)applyHarvest(r.target-processed);
    }else if(dayBefore){
      // 衝分日前一天：先完成本日需求，確保場上 = 8，再點勞拉；之後禁止再收割。
      if(processed<r.target)applyHarvest(r.target-processed);
      if(hasLaura&&!lauraUsed&&processed>=r.target){
        if(sf<8&&si>0){
          const fill=Math.min(8-sf,si);
          sf+=fill;si-=fill;
        }
        if(sf===8)applyLaura();
      }
    }else{
      // 一般準備日：依後續資源預留後的最佳時機使用勞拉。
      // 若目前資源不足以完成本日需求，先處理當前資源；場上低於 8 時即可使用勞拉。
      const remaining=Math.max(0,r.target-processed);
      if(!lauraUsed){
        if(sf+si<=remaining){
          applyHarvest(sf+si);
          if(hasLaura&&sf<8)applyLaura();
        }else{
          applyHarvest(remaining);
          if(hasLaura&&sf<8)applyLaura();
        }
      }
      if(processed<r.target)applyHarvest(r.target-processed);
    }
  }

  // 若今天仍未有玩家操作時間，但有待處理需求，標記為不可完成。
  const hasOperation=uniqueOps.length>0;
  const feasible=processed>=r.target && (!hasLaura||lauraUsed) && (!dayBefore||lauraUsed) &&
                  (!score||processed>=r.target);
  return {events,processed,lauraUsed,feasible,endF:sf,endI:si};
}

function scheduleWeek(MAX,av){
  const ls=getLauraSettings();
  const base=makePlan(MAX,ls.lauraAmount,ls.hasLaura);
  const rows=[],impossible=[];
  let field=11,inv=MAX-8;

  for(let d=0;d<7;d++){
    const r=base[d];
    const x={...r,d,windows:dayWindows(av,d),max:MAX};
    const sim=simulateDay(d,field,inv,x,av);
    x.events=sim.events;
    x.simProcessed=sim.processed;
    x.simFeasible=sim.feasible;
    x.startF=field;
    x.startI=inv;
    x.endF=sim.endF;
    x.endI=sim.endI;

    // 下一天一定接續前一天實際模擬後的狀態。
    field=sim.endF;
    inv=sim.endI;

    if(!sim.feasible){
      impossible.push(`${weekNames[d]}：目前可操作時間不足，無法完成當日規劃。`);
    }
    rows.push(x);
  }
  return {rows,impossible};
}

function eventDisplay(e,av){return gameMomentToDisplay(e.day,e.minute,av);}
function operationWindowForEvent(e,av){
  const rows=dayWindows(av,e.day)||[];
  // 優先找包含事件時間的玩家可操作區間；若事件正好落在區間邊界，仍視為該區間的一部分。
  return rows.find(w=>e.minute>=w.start&&e.minute<=w.end)||null;
}
function formatGameRange(day,start,end,av){
  const a=gameMomentToDisplay(day,start,av);
  if(av.mode==='game'){
    const displayEnd=end<1440&&[480,960].includes(end)?end-1:end;
    const b=gameMomentToDisplay(day,displayEnd,av);
    return `${a.dateLabel} ${a.time}–${b.time}`;
  }
  // 當地時間模式必須先判斷「結束的遊戲瞬間」是否就是刷新瞬間，再往前退 1 分鐘；
  // 不直接用當地顯示時間判斷，避免跨日／時區時把刷新邊界算錯。
  const endBoundary=new Date(Date.UTC(av.mon.getUTCFullYear(),av.mon.getUTCMonth(),av.mon.getUTCDate()+day,0,0)+end*60000);
  const utcEndMs=endBoundary.getTime()+2*3600000;
  const localEnd=localParts(new Date(utcEndMs),av.tz);
  let b;
  if(end<1440&&[480,960].includes(end)){
    const prevGameMinute=end-1;
    b=gameMomentToDisplay(day,prevGameMinute,av);
  }else{
    b={dateLabel:`${localEnd.month}/${localEnd.day}`,time:`${localEnd.hour}:${localEnd.minute}`};
  }
  const sameDate=a.dateLabel===b.dateLabel;
  return sameDate?`${a.dateLabel} ${a.time}–${b.time}`:`${a.dateLabel} ${a.time}–${b.dateLabel} ${b.time}`;
}
function formatOperationRange(e,av){
  const w=operationWindowForEvent(e,av);
  if(!w)return `${eventDisplay(e,av).dateLabel} ${eventDisplay(e,av).time}`;
  // 若這個操作是在 00:00／08:00／16:00 系統刷新後才能開始，排程區間從刷新時間開始顯示；一般第一個操作則沿用完整可操作區間。
  const start=[0,480,960].includes(e.minute) ? Math.max(w.start,e.minute) : w.start;
  return formatGameRange(e.day,start,w.end,av);
}
function operationStepText(e,av,index,total){
  const prefix=index===0?'':(index===1?'接著，':(index===2?'再來，':(index===3?'最後，':'接著，')));
  if(e.type==='laura') return `${prefix}點擊勞拉`;
  return `${prefix}收割 ${e.qty} 個雷達，完成場上雷達`;
}
function renderEventGroups(events,av){
  let html='';
  let i=0;
  while(i<events.length){
    const e=events[i];
    if(e.type==='refresh'){
      const x=eventDisplay(e,av);
      html+=`<div class="event refresh"><div class="event-time">${x.dateLabel} ${x.time}</div><div class="event-action">刷新雷達 → 場上 ${e.afterF}、儲存 ${e.afterI}</div></div>`;
      i++; continue;
    }
    const segStart=[0,480,960].filter(x=>x<=e.minute).pop()??0;
    const group=[];
    while(i<events.length && events[i].type!=='refresh'){
      const g=events[i], gs=[0,480,960].filter(x=>x<=g.minute).pop()??0;
      if(gs!==segStart) break;
      group.push(g); i++;
    }
    const first=group[0], w=operationWindowForEvent(first,av);
    const start=Math.max(w?w.start:segStart,segStart);
    const nextRefresh=[480,960,1440].find(x=>x>segStart)??1440;
    const end=Math.min(w?w.end:nextRefresh,nextRefresh);
    const range=formatGameRange(first.day,start,end,av);
    html+=`<div class="operation-block"><div class="operation-range">${range}</div>`;
    group.forEach((g,idx)=>{ const n=group.length>1?`${idx+1}. `:''; html+=`<div class="operation-step">${n}${operationStepText(g,av,idx,group.length)} → 場上 ${g.afterF}、儲存 ${g.afterI}</div>`; });
    html+=`</div>`;
  }
  return html;
}
function render(){
 const MAX=Number($('#max').value);
 if(!Number.isInteger(MAX)||MAX<8){$('#out').innerHTML='<div class="panel empty">請輸入至少 8 的整數儲存上限。</div>';return}
 const av=buildGameAvailability(),plan=scheduleWeek(MAX,av);
 const ls=getLauraSettings();
 let html='';

 if(plan.impossible.length) html+=`<div class="panel result"><b class="warn">⚠️ 時間限制</b><div class="meta">${plan.impossible.join('<br>')}</div></div>`;
 for(const r of plan.rows){
   const ev=r.events||[];
   html+=`<section class="day ${r.scoring?'score':''}"><h2>${weekNames[r.d]} <span class="tag">${r.scoring?'🏆 衝分日':'準備日'}</span></h2>`;
   html+=`<div class="state">開始：場上 ${r.startF}、儲存 ${r.startI}</div>`;
   html+=`<div class="timeline"><b>📋 每日操作排程</b>`;
   if(!ev.length) html+=`<div class="empty">沒有可列出的事件。</div>`;
   else html+=renderEventGroups(ev,av);
   html+=`</div>`;
   if(!r.simFeasible) html+=`<div class="state warn">⚠️ 目前可操作時間不足，這一天無法完成規劃。</div>`;
   html+=`</section>`;
 }
 $('#out').innerHTML=html;
}
function syncLauraUI(){
  const has=document.getElementById('lauraToggle')?.checked!==false;
  document.getElementById('lauraDetail').style.display=has?'block':'none';
}
function saveLauraSettings(){
  const has=document.getElementById('lauraToggle')?.checked!==false;
  const star=Number(document.getElementById('lauraStar').value||4);
  localStorage.setItem(lauraStoreKey,JSON.stringify({hasLaura:has,star}));
}
function loadLauraSettings(){
  try{
    const d=JSON.parse(localStorage.getItem(lauraStoreKey)||'null');
    if(!d)return;
    const toggle=document.getElementById('lauraToggle');
    if(toggle)toggle.checked=d.hasLaura!==false;
    if(d.star!==undefined)document.getElementById('lauraStar').value=String(d.star);
  }catch(e){}
}
document.getElementById('lauraToggle').addEventListener('change',()=>{saveLauraSettings();syncLauraUI();render();});
document.getElementById('lauraStar').addEventListener('change',()=>{saveLauraSettings();render();});
loadLauraSettings();
syncLauraUI();
$('#plan').addEventListener('click',render);$('#max').addEventListener('input',()=>{$('#out').innerHTML='<div class="panel empty">輸入完成後按「開始規劃」。</div>'});
</script>

<script>
const timeStoreKey='lastz_radar_v9_availability';
const lauraStoreKey='lastz_radar_v9_laura';
const weekNames=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
function timeRow(h='',end=''){return `<div class="time-row"><input type="time" aria-label="開始時間" value="${h}"><span class="time-sep">－</span><input type="time" aria-label="結束時間" value="${end}"><button type="button" class="smallbtn delTime">刪除</button></div>`}
function bindDelete(){document.querySelectorAll('.delTime').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=()=>{const row=b.closest('.time-row');const parent=row.parentElement;if(parent.querySelectorAll('.time-row').length>1)row.remove();else row.querySelectorAll('input').forEach(x=>x.value='');autoSaveAvailability();};});}
function bindTimeInputs(){document.querySelectorAll('.time-row input').forEach(x=>{if(x.dataset.bound)return;x.dataset.bound='1';x.addEventListener('input',autoSaveAvailability);x.addEventListener('change',autoSaveAvailability);});}
function addTimeRow(container,h='',end=''){container.insertAdjacentHTML('beforeend',timeRow(h,end));bindDelete();bindTimeInputs();autoSaveAvailability();}
function renderTimes(){
 const same=document.querySelector('#sameTimes'), custom=document.querySelector('#customTimes');
 same.innerHTML='<div class="day-title">玩家可操作時間</div><div id="sameDayTimes">'+timeRow()+'</div><button type="button" class="smallbtn addSameTime">＋新增時段</button>';
 custom.innerHTML='<div class="day-title">玩家可操作時間</div>'+weekNames.map((d,i)=>`<div class="day-title">${d}</div><div class="dayTimes" data-day="${i}">${timeRow()}</div><button type="button" class="smallbtn addTime" data-day="${i}">＋新增時段</button>`).join('');
 document.querySelector('.addSameTime').onclick=()=>addTimeRow(document.querySelector('#sameDayTimes'));
 document.querySelectorAll('.addTime').forEach(b=>b.onclick=()=>addTimeRow(document.querySelector(`.dayTimes[data-day="${b.dataset.day}"]`)));
 bindDelete();bindTimeInputs();
}
function readTimes(container){return [...container.querySelectorAll('.time-row')].map(r=>{const v=r.querySelectorAll('input');return {start:v[0].value,end:v[1].value}}).filter(x=>x.start&&x.end);}
function saveAvailability(){
 const mode=document.querySelector('input[name=timeMode]:checked').value;const apply=document.querySelector('input[name=applyMode]:checked').value;
 const data={timeMode:mode,applyMode:apply,same:readTimes(document.querySelector('#sameDayTimes')),custom:[...document.querySelectorAll('.dayTimes')].map(x=>readTimes(x))};
 localStorage.setItem(timeStoreKey,JSON.stringify(data));
}
function autoSaveAvailability(){
 if(document.querySelector('#sameDayTimes'))saveAvailability();
}
function loadAvailability(){
 try{
  const d=JSON.parse(localStorage.getItem(timeStoreKey));if(!d)return;
  if(d.timeMode)document.querySelector(`input[name=timeMode][value="${d.timeMode}"]`).checked=true;
  if(d.applyMode)document.querySelector(`input[name=applyMode][value="${d.applyMode}"]`).checked=true;
  const same=document.querySelector('#sameDayTimes');
  if(Array.isArray(d.same)&&d.same.length){same.innerHTML=d.same.map(x=>timeRow(x.start,x.end)).join('');}
  if(Array.isArray(d.custom))d.custom.forEach((arr,i)=>{const box=document.querySelector(`.dayTimes[data-day="${i}"]`);if(box&&arr.length)box.innerHTML=arr.map(x=>timeRow(x.start,x.end)).join('');});
  bindDelete();bindTimeInputs();
 }catch(e){}
}
function toggleApply(){const m=document.querySelector('input[name=applyMode]:checked').value;document.querySelector('#sameTimes').hidden=m!=='same';document.querySelector('#customTimes').hidden=m!=='custom';autoSaveAvailability();}
renderTimes();loadAvailability();toggleApply();document.querySelectorAll('input[name=applyMode]').forEach(x=>x.onchange=toggleApply);document.querySelectorAll('input[name=timeMode]').forEach(x=>x.onchange=autoSaveAvailability);
</script>
</body></html>
