<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雷達規劃核心｜每日處理量 v1</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#071421;color:#e8eef5;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:auto;padding:18px}
h1{color:#e0ad3b;font-size:24px;margin:0 0 8px}
.lead{font-size:16px;color:#cbd5df;margin-bottom:18px}
.card{background:#0a1c2a;border:1px solid #30465e;border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;box-sizing:border-box;background:#102437;border:1px solid #647991;color:#fff;border-radius:10px;padding:12px;font-size:17px}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px;background:#a77b28;color:#fff;font-weight:800;font-size:17px}
.result{font-size:18px}
.big{font-size:25px;font-weight:900;color:#7ee2a8}
.blue{color:#7db8ff}.gold{color:#e0ad3b}.muted{color:#aab7c5}
.ok{color:#7ee2a8}.warn{color:#ffd166}.bad{color:#ff8b8b}
.row{padding:10px 0;border-bottom:1px solid #26394d}
.row:last-child{border-bottom:0}
.small{font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>雷達規劃核心｜每日處理量 v1</h1>
<div class="lead">
這一版只回答兩件事：<b>今天至少要處理幾個雷達？</b>、<b>今天什麼時候處理？</b>。<br>
規則：每日最低處理量＝當天開始時場上雷達＋20；另外檢查後續系統 +8 是否會造成庫存浪費。
</div>

<div class="card">
<label>庫存 MAX</label><input id="max" type="number" value="30" min="1">
<label>目前庫存</label><input id="inv" type="number" value="22" min="0">
<label>目前場上</label><input id="field" type="number" value="8" min="0">
<label>目前時間</label><input id="now" type="datetime-local" value="2026-09-27T11:27">
<label>每天可操作開始</label><input id="start" type="time" value="08:00">
<label>每天可操作結束</label><input id="end" type="time" value="23:59">
<button id="plan">開始規劃</button>
</div>

<div id="out" class="card result">尚未規劃。</div>
<div id="tests" class="card small">固定檢查尚未執行。</div>
</div>

<script>
function pad(n){return String(n).padStart(2,'0')}
function localDT(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function parseTime(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function weekdayZh(d){return ['日','一','二','三','四','五','六'][d.getDay()]}

function nextSystemEvent(d){
  const x=new Date(d);
  const candidates=[];
  for(let k=0;k<3;k++){
    const q=new Date(x);
    q.setHours(10+k*8,0,0,0);
    if(q>x) candidates.push(q);
  }
  const nextDay=new Date(x); nextDay.setDate(nextDay.getDate()+1); nextDay.setHours(2,0,0,0);
  if(nextDay>x) candidates.push(nextDay);
  candidates.sort((a,b)=>a-b);
  return candidates[0] || null;
}

// 處理一個雷達：收割後若場上 < 8，庫存會自動補回場上。
function processOne(s){
  if(s.field<8 && s.inv>0){
    const move=Math.min(8-s.field,s.inv);
    s.field+=move; s.inv-=move;
  }
  if(s.field<=0) return false;
  s.field--;
  s.processed++;
  if(s.field<8 && s.inv>0){
    const move=Math.min(8-s.field,s.inv);
    s.field+=move; s.inv-=move;
  }
  return true;
}
function processN(s,n){
  for(let i=0;i<n;i++) if(!processOne(s)) return false;
  return true;
}

function system8(s){
  let gen=8;
  if(s.field<8){
    const add=Math.min(8-s.field,gen);
    s.field+=add; gen-=add;
  }
  const room=Math.max(0,s.max-s.inv);
  const add=Math.min(gen,room);
  s.inv+=add;
  s.waste+=gen-add;
  return gen-add;
}

// 檢查「處理 n 後，下一次 +8」是否浪費。
// 這裡直接模擬，不用猜公式。
function wasteAfterNext(s,n){
  const x={...s,processed:0,waste:0};
  if(!processN(x,n)) return {valid:false,waste:Infinity,state:x};
  const w=system8(x);
  return {valid:true,waste:w,state:x};
}

function isInWindow(d,startMin,endMin){
  const m=d.getHours()*60+d.getMinutes();
  return startMin<=endMin ? m>=startMin && m<=endMin : (m>=startMin || m<=endMin);
}
function nextWindowStart(from,startMin,endMin){
  const d=new Date(from);
  if(isInWindow(d,startMin,endMin)) return d;
  for(let i=0;i<3;i++){
    const x=new Date(d); x.setDate(x.getDate()+i);
    x.setHours(Math.floor(startMin/60),startMin%60,0,0);
    if(x>=from) return x;
  }
  return null;
}

function plan(){
  const max=Number(document.getElementById('max').value);
  const inv=Number(document.getElementById('inv').value);
  const field=Number(document.getElementById('field').value);
  const now=new Date(document.getElementById('now').value);
  const startMin=parseTime(document.getElementById('start').value);
  const endMin=parseTime(document.getElementById('end').value);

  const out=document.getElementById('out');
  const tests=document.getElementById('tests');

  if(!Number.isFinite(max)||max<=0||!Number.isFinite(inv)||inv<0||!Number.isFinite(field)||field<0||
     inv>max && field>=8){
    out.innerHTML='<span class="bad">輸入資料有誤，請檢查 MAX／庫存／場上。</span>';
    return;
  }

  const minProcess=field+20;
  const total=field+inv;

  // 找「至少」需要處理多少，讓下一個 +8 不浪費。
  // 從最低量往上找；若最低量本身已不浪費，就不多處理。
  let required=minProcess;
  let found=null;
  for(let n=minProcess;n<=total;n++){
    const r=wasteAfterNext({max,inv,field},n);
    if(r.valid && r.waste===0){found=r;required=n;break;}
  }

  const next=nextSystemEvent(now);
  const op=nextWindowStart(now,startMin,endMin);

  if(!found){
    out.innerHTML=`<div class="bad">目前資源不足以同時滿足每日最低處理量 ${minProcess} 個。</div>`;
    return;
  }

  const after={max,inv,field,processed:0,waste:0};
  processN(after,required);

  let html='';
  html += `<div class="gold"><b>${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${weekdayZh(now)}）</b></div>`;
  html += `<div class="big">今天至少處理 ${required} 個雷達</div>`;
  html += `<div class="row">每日最低要求：<b>${field} + 20 = ${minProcess}</b></div>`;
  html += `<div class="row">為避免下一次 +8 浪費，需要處理：<b>${required}</b></div>`;

  if(required===minProcess){
    html += `<div class="row ok">✅ ${minProcess} 個已經足夠，不需要為了「不浪費」額外多處理。</div>`;
  }else{
    html += `<div class="row warn">⚠️ 最低要求不足，需多處理 ${required-minProcess} 個，才可避免下一次 +8 浪費。</div>`;
  }

  if(op){
    html += `<div class="row"><span class="blue">🕐 建議上線時間：</span><b>${localDT(op)}</b><br><span class="muted">在這個可操作時段內一次處理 ${required} 個即可。</span></div>`;
  }

  html += `<div class="row">處理後：場上 <b>${after.field}</b>｜庫存 <b>${after.inv}</b></div>`;

  if(next){
    const ns={...after,processed:0,waste:0};
    const waste=system8(ns);
    html += `<div class="row">下一次系統 +8：<b>${localDT(next)}</b><br>+8 後：場上 <b>${ns.field}</b>｜庫存 <b>${ns.inv}</b>${waste?'｜浪費 '+waste+' 個':''}</div>`;
  }

  html += `<div class="row small muted">注意：這一版不再計算勞拉、任務、寶箱或已完成雷達；只驗證「每日最低處理量＋不浪費 +8」。</div>`;
  out.innerHTML=html;

  // 固定檢查：使用者提出的 MAX30 / 庫存22 / 場上8。
  const a=wasteAfterNext({max:30,inv:22,field:8},28);
  const b=wasteAfterNext({max:30,inv:22,field:8},30);
  const checks=[
    [a.waste===0,'MAX30／庫存22／場上8：處理28後下一次+8不浪費'],
    [b.waste===0,'同案例：處理30後下一次+8不浪費'],
    [required>=minProcess,'今日處理量不低於場上+20'],
    [!!op,'能找到可操作時間']
  ];
  tests.innerHTML='<b>固定檢查</b><br>'+checks.map((x,i)=>`${x[0]?'🟢':'🔴'} T${i+1} ${x[1]}`).join('<br>');
}
document.getElementById('plan').addEventListener('click',plan);
</script>
</body>
</html>
