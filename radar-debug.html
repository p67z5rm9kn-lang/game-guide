<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Z｜雷達週計劃 v8 核心時間軸測試</title>
<style>
body{margin:0;background:#071426;color:#edf3fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:16px 10px 40px}
main{max-width:700px;margin:auto}.panel{background:#0d2038;border:1px solid #29435f;border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:21px;color:#e0bd6b;margin:0 0 6px}h2{font-size:16px;color:#e0bd6b;margin:0 0 10px}
.note{font-size:12px;color:#9fb1c7;line-height:1.7}
label{display:block;font-size:12px;color:#9fb1c7;margin:9px 0 5px}
input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #365574;background:#102842;color:#fff;font-size:17px}
button{width:100%;margin-top:12px;padding:11px;border-radius:9px;border:1px solid #a68748;background:#172c46;color:#f5d98e;font-weight:700;font-size:15px}
.day{border:1px solid #29435f;border-radius:12px;padding:11px;margin-top:10px;background:#091a2e}
.day h3{margin:0 0 8px;color:#e0bd6b;font-size:15px}.event{border-top:1px solid #203852;padding:9px 0;font-size:12px;line-height:1.65}.event:first-child{border-top:0}
.ok{color:#78d99a}.warn{color:#f0c674}.bad{color:#ff7777}.state{font-size:12px;color:#d9e4ef}
.hidden{display:none}.tag{display:inline-block;background:#132b45;padding:2px 6px;border-radius:6px;font-size:10px;color:#b9c9da}
</style>
</head>
<body>
<main>
<div class="panel">
<h1>Last Z｜雷達週計劃 v8</h1>
<div class="note">
這是「核心時間軸測試版」，不是完整週計劃 UI。<br>
唯一目的：先確認「v4 資源基準＋免費 +8＋玩家操作時間」的事件順序。<br>
v4 週計劃數字不在本版重新推導。
</div>
</div>

<div class="panel">
<h2>測試設定</h2>
<label>庫存上限 MAX</label>
<input id="max" type="number" value="30" min="8">

<label>時間顯示</label>
<select id="basis">
<option value="tw">台灣時間（UTC+8）</option>
<option value="game">遊戲時間（UTC-2）</option>
</select>

<label>每日玩家可操作開始</label>
<input id="start" type="time" value="18:00">

<label>每日玩家可操作結束</label>
<input id="end" type="time" value="22:00">

<button id="run">開始測試</button>
</div>

<div id="result" class="hidden"></div>
</main>

<script>
const DAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const SCORE=new Set([0,4]);
const PRE=new Set([3,6]);

// radar-weekly-v4 鎖定基準（MAX 30）
const START=[[11,22],[0,0],[8,16],[8,22],[11,22],[0,0],[8,16]];
const TARGET=[null,20,38,41,null,20,35];
const END=['0/0','8/16','8/22','11/22','0/0','8/16','11/22'];

function hm(s){let [h,m]=s.split(':').map(Number);return h*60+m}
function fmt(m){m=(m%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function gameToTw(m){return (m+600)%1440}
function twToGame(m){return (m+840)%1440}
function shown(game,basis){return basis==='game'?fmt(game):fmt(gameToTw(game))}
function inWindow(t,s,e){if(s===e)return true;if(s<e)return t>=s&&t<=e;return t>=s||t<=e}

function add8(f,i,max){
 let n=8;
 let a=Math.min(n,Math.max(0,8-f)); f+=a;n-=a;
 let b=Math.min(n,Math.max(0,max-i)); i+=b;n-=b;
 return {f,i,waste:n};
}
function collectAll(f,i){
 let done=f+i;
 return {f:0,i:0,done};
}

// v8 的「核心時間軸」只測事件，不自行推導新的 v4 週計劃。
// 勞拉先只記錄規則位置；不在這個核心測試版自行發明完整勞拉數值。
function simulate(){
 const max=Math.max(8,Number(document.getElementById('max').value)||30);
 const basis=document.getElementById('basis').value;
 const rawS=hm(document.getElementById('start').value);
 const rawE=hm(document.getElementById('end').value);
 const s=basis==='game'?rawS:twToGame(rawS);
 const e=basis==='game'?rawE:twToGame(rawE);

 // 本版要求先驗證 MAX=30 的 v4 基準；其他 MAX 不做 v4 數字推導。
 if(max!==30){
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').innerHTML='<div class="panel"><div class="bad">核心測試版目前只鎖定 MAX=30。請先使用 MAX 30。</div></div>';
  return;
 }

 let html='<div class="panel"><h2>核心時間軸結果</h2><div class="note">免費 +8：遊戲 00:00／08:00／16:00。只有真的因 MAX 滿了而拿不到，才算浪費。</div></div>';

 for(let d=0;d<7;d++){
  let f=START[d][0],i=START[d][1];
  let events=[];
  let processed=0;
  let lauraUsed=false;
  let waste=0;

  // 每天從遊戲 00:00 開始，依序處理三次 +8。
  const times=[0,480,960];

  // 玩家在一天開始時，如果操作窗口包含 00:00，允許主動操作。
  function playerOperate(t){
   // 衝分日：玩家能操作時，收割當下所有已有雷達。
   if(SCORE.has(d)){
    if(f+i>0){
     const before=f+'/'+i;
     const x=collectAll(f,i);f=x.f;i=x.i;
     events.push({t,kind:'玩家',action:'完成／收割 '+x.done+' 個',state:f+'/'+i,cls:'ok'});
    }
    return;
   }

   // 勞拉條件只在此版忠實記錄，不自行創造未確認的數值模型。
   // 一般準備日：場上 <8
   // 衝分日前一天：場上 >=8
   const allow=(PRE.has(d)?f>=8:f<8);
   if(!lauraUsed && allow){
    lauraUsed=true;
    events.push({t,kind:'玩家',action:'可使用勞拉（條件成立）',state:f+'/'+i,cls:'ok'});
   }

   // 準備日只做 v4 當日處理量測試。
   const need=(TARGET[d]||0)-processed;
   if(need>0 && f+i>0){
    const n=Math.min(need,f+i);
    const before=f+'/'+i;
    const x=collectAll(f,i);
    // 為了不改動 v4 基準，只記錄「可處理量」，不把不足量硬算成完成。
    f=x.f;i=x.i;processed+=n;
    events.push({t,kind:'玩家',action:'處理 '+n+' 個',state:f+'/'+i,cls:n===need?'ok':'warn'});
   }
  }

  for(const gm of times){
   const can=inWindow(gm,s,e);
   if(can)playerOperate(shown(gm,basis));

   const before=f+'/'+i;
   const x=add8(f,i,max);f=x.f;i=x.i;waste+=x.waste;
   events.push({
    t:shown(gm,basis),kind:'系統',action:'免費 +8',
    state:f+'/'+i,cls:x.waste?'bad':'ok',
    extra:x.waste?'真正浪費 '+x.waste+' 個':'+8 全部取得'
   });

   if(can)playerOperate(shown(gm,basis));
  }

  // 若操作窗口沒有涵蓋任何 +8，仍允許玩家在窗口內做一次主動操作。
  if(inWindow(s,s,e))playerOperate(shown(s,basis));

  const remain=f+i;
  html+='<div class="day"><h3>'+DAYS[d]+(SCORE.has(d)?'｜衝分日':'｜準備日')+'</h3>';
  html+='<div class="state">v4 開始：<b>'+START[d][0]+' / '+START[d][1]+'</b>';
  if(!SCORE.has(d))html+='　｜　v4 當日處理：<b>'+TARGET[d]+'</b>';
  html+='</div>';

  events.forEach(x=>{
   html+='<div class="event"><span class="tag">'+x.kind+'</span>　<b>'+x.t+'｜'+x.action+'</b><br>狀態：<b>'+x.state+'</b>';
   if(x.extra)html+='<br><span class="'+x.cls+'">'+x.extra+'</span>';
   html+='</div>';
  });

  if(SCORE.has(d)){
   html+='<div class="event"><b>衝分日檢查</b><br>'+
    (remain===0?'<span class="ok">🟢 目前事件模型下全部已收割</span>':
    '<span class="warn">🟡 尚有 '+remain+' 個未完成／未收割；不能假設全部達成</span>')+
    '<br>真正浪費：<b class="'+(waste?'bad':'ok')+'">'+waste+' 個</b></div>';
  }else{
   html+='<div class="event"><b>日末狀態：'+f+' / '+i+'</b><br>'+
    '<span class="'+(waste?'bad':'ok')+'">真正浪費：'+waste+' 個</span></div>';
  }
  html+='</div>';
 }

 document.getElementById('result').classList.remove('hidden');
 document.getElementById('result').innerHTML=html;
}
document.getElementById('run').addEventListener('click',simulate);
</script>
</body>
</html>
