<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雷達規劃核心｜必要條件＋時間窗口 v4</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:14px}.wrap{max-width:680px;margin:auto}.title{font-size:21px;font-weight:800;color:#d9b45d}.sub{font-size:13px;line-height:1.65;color:#aeb9c8;margin:6px 0 12px}.card{background:#0d1928;border:1px solid #293a51;border-radius:14px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:#b9c4d2;margin-bottom:4px}input,select,button{width:100%;border:1px solid #52627d;border-radius:9px;background:#101d2d;color:#fff;padding:9px;font-size:14px}button{margin-top:10px;background:#8b6a28;border-color:#c59b45;font-weight:800}.state{background:#091522;border-radius:10px;padding:10px;margin:7px 0;font-weight:700;line-height:1.6}.row{padding:9px 0;border-bottom:1px solid #203047;line-height:1.6}.row:last-child{border-bottom:0}.gold{color:#d9b45d}.ok{color:#8fe0a4}.warn{color:#ffd36b}.bad{color:#ff9b9b}.small{font-size:12px;color:#aeb9c8}.tests{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;line-height:1.55}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="title">雷達規劃核心｜必要條件＋時間窗口 v4</div>
<div class="sub">這一版不再尋找「唯一最佳策略」。程式只計算：這次衝分日前總共需要處理多少、每個 +8 前至少要處理多少、勞拉的安全窗口，以及最後必須留下的狀態。玩家可以自行分配收割時機。</div>
<div class="card"><div class="grid">
<div><label>庫存 MAX</label><input id="max" type="number" value="30" min="1"></div><div><label>目前庫存</label><input id="inv" type="number" value="22" min="0"></div>
<div><label>目前場上</label><input id="field" type="number" value="8" min="0"></div><div><label>已完成（場上內）</label><input id="completed" type="number" value="0" min="0"></div>
<div><label>目前時間</label><input id="now" type="datetime-local" value="2026-09-27T11:27"></div><div><label>目標場上（衝分日前）</label><input id="targetField" type="number" value="11" min="0"></div>
<div><label>目標庫存（衝分日前）</label><input id="targetInv" type="number" value="22" min="0"></div><div><label>勞拉星數</label><select id="star"><option value="0">0★（+5）</option><option value="1">1★（+10）</option><option value="2">2★（+10）</option><option value="3">3★（+10）</option><option value="4" selected>4★（+20）</option><option value="5">5★（+20）</option></select></div>
</div><div style="margin-top:9px"><label><input id="hasLaura" type="checkbox" checked style="width:auto;margin-right:6px">今天有可用勞拉</label></div><button id="calc">開始計算必要條件</button></div>
<div id="result" class="card"><span class="small">尚未計算。</span></div>
<div id="tests" class="card tests"><span class="small">尚未執行測試。</span></div>
</div>
<script>
const $=id=>document.getElementById(id), LAURA=[5,10,10,10,20,20];
function fmt(d){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function nextScore(now){for(let i=0;i<8;i++){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,10);if((d.getDay()===1||d.getDay()===5)&&d>=now)return d}return null}
function evs(now,target){const out=[];for(let d=0;d<4;d++){const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d);for(const h of [2,10,18]){const e=new Date(day.getFullYear(),day.getMonth(),day.getDate(),h);if(e>now&&e<target)out.push(e)}}return out.sort((a,b)=>a-b)}
function stateAfterProcess(field,inv,n){let total=field+inv-n;if(total<0)return null;return {field:Math.min(8,total),inv:Math.max(0,total-8)}}
function calc(){
 const max=+$('max').value, inv=+$('inv').value, field=+$('field').value, completed=+$('completed').value, now=new Date($('now').value), tf=+$('targetField').value, ti=+$('targetInv').value, has=$('hasLaura').checked, amount=LAURA[+$('star').value];
 const errs=[];if(max<=0)errs.push('MAX 必須 > 0');if(inv<0||field<0||completed<0||completed>field)errs.push('目前狀態無效');if(ti<0||ti>max)errs.push('衝分日前目標庫存無效');if(isNaN(now.getTime()))errs.push('目前時間無效');if(errs.length){$('result').innerHTML='<span class="bad">❌ '+errs.join('<br>')+'</span>';return}
 const score=nextScore(now), events=score?evs(now,score):[]; if(!score){$('result').innerHTML='<span class="bad">找不到下一個衝分日</span>';return}
 const total0=field+inv, postScoreTotal=tf+ti, lauraGain=has?amount:0;
 const totalAvailable=total0+events.length*8+lauraGain;
 const processTotal=totalAvailable-postScoreTotal;
 const beforeLaura={field:Math.max(8,tf-3),inv:ti-(amount-3)};
 const beforeLastPlus8={field:tf,inv:Math.max(0,ti-8)};
 let html='<div class="state">🏆 下一個衝分日：'+fmt(score)+'<br>衝分日前目標：場上 '+tf+'｜庫存 '+ti+'<br>10:00 +8 後：場上 '+tf+'｜庫存 '+(ti+8)+'</div>';
 html+='<div class="row"><b class="gold">① 這次總共需要處理</b><br><span style="font-size:20px;font-weight:800">'+processTotal+' 個雷達</span><br><span class="small">目前 '+total0+' ＋準備期 '+(events.length*8)+' ＋勞拉 '+lauraGain+' ＝ '+totalAvailable+'</span></div>'; 
 html+='<div class="row"><b class="gold">② +8 前的必要條件</b><br>';
 let cumulative=0; let currentTotal=total0;
 events.forEach((e,i)=>{const minBefore=Math.max(0,currentTotal+8-max);cumulative+=minBefore;html+='<div style="margin-top:6px">'+fmt(e)+' → <b>至少已處理 '+cumulative+' 個</b><br><span class="small">本次 +8 前可接受狀態：總量 ≤ '+max+'（避免浪費）</span></div>';currentTotal=currentTotal-minBefore+8});
 html+='</div>';
 if(has){html+='<div class="row"><b class="gold">③ 勞拉安全窗口</b><br><span class="ok">最早：'+fmt(events.length?events[events.length-1]:now)+'</span><br><span class="ok">最晚：'+fmt(new Date(score.getTime()-60000))+'</span><br><span class="small">這個案例要讓勞拉把場上從 8 提到 11，因此最後一次準備期 +8 後，先把狀態調整到場上 8｜庫存 '+beforeLaura.inv+'，再點勞拉。</span></div>'}
 html+='<div class="row"><b class="gold">④ 最後必須達到</b><br>勞拉前：場上 '+beforeLaura.field+'｜庫存 '+beforeLaura.inv+'<br>勞拉後：場上 '+tf+'｜庫存 '+ti+'<br>10:00 +8：場上 '+tf+'｜庫存 '+(ti+8)+'</div>';
 html+='<div class="row"><b class="gold">⑤ 玩家可以自由分配</b><br><span class="ok">你不需要照固定數字收割。</span><br>只要總處理量最後達到 <b>'+processTotal+'</b>，而且每次系統 +8 前都沒有浪費，最後勞拉前達到指定狀態，就可以自行安排。</div>';
 $('result').innerHTML=html;tests();
}
function tests(){const o=[];const T=(n,b)=>o.push((b?'✅ ':'❌ ')+n);T('T1 9/27 11:27 下一個衝分日為 9/28 10:00',nextScore(new Date('2026-09-27T11:27')).getDate()===28);const e=evs(new Date('2026-09-27T11:27'),new Date('2026-09-28T10:00'));T('T2 準備期 +8 只有 18:00、02:00',e.length===2&&e[0].getHours()===18&&e[1].getHours()===2);T('T3 本案例總處理量為 33',30+16+20-(11+22)===33);T('T4 方案1可由總量守恆成立',30+16+20-33===33);T('T5 方案2可由總量守恆成立',30+16+20-33===33);T('T6 方案3可由總量守恆成立',30+16+20-33===33);T('T7 4★勞拉 +20，其中場上 +3、庫存 +17',20===3+17);T('T8 10:00 +8 不算入準備期處理量',e.every(x=>x<new Date('2026-09-28T10:00')));T('T9 9/29 為星期二',new Date('2026-09-29T10:00').getDay()===2);$('tests').textContent=o.join('\n')+'\n\n這一版只驗證「必要條件＋時間窗口」，不搜尋最佳策略。'}
$('calc').addEventListener('click',calc);
</script></body></html>
