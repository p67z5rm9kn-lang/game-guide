<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃 v17｜容量與最早時機測試版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#071321;color:#eee;margin:0;padding:16px}
.card{max-width:720px;margin:auto;background:#102338;border:1px solid #8b6a2b;border-radius:14px;padding:16px}
h1{font-size:20px;margin:0 0 8px}.note{font-size:14px;color:#c9d2dc;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#d8c38b;display:block;margin-bottom:4px}
input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #657487;background:#172d43;color:#fff;font-size:16px}
button{margin-top:12px;background:#8b6a2b;border:0;font-weight:700}
hr{border:0;border-top:1px solid #33485c;margin:16px 0}
.row{padding:10px 12px;background:#172d43;border-radius:9px;margin:7px 0;line-height:1.55}
.good{color:#8fe39a}.warn{color:#ffd66b}.bad{color:#ff8f8f}
pre{white-space:pre-wrap;line-height:1.55;margin:0}
</style>
</head>
<body>
<div class="card">
<h1>🧭 雷達規劃 v17｜容量與最早時機測試版</h1>
<div class="note">
這一版加入三個新規則：① 勞拉在場上已有 8 個時，仍是「+3 進場上、其餘進庫存」；
② 系統 +8 不可超過 MAX，若會浪費，必須提前提醒並計算要先完成/收割幾個；
③ 能安全執行時，策略優先採用「最早可執行時間」。
</div>

<div class="grid">
<div><label>庫存上限 MAX</label><input id="max" type="number" value="30"></div>
<div><label>目前庫存</label><input id="inv" type="number" value="22"></div>
<div><label>場上雷達</label><input id="field" type="number" value="8"></div>
<div><label>已完成</label><input id="completed" type="number" value="0"></div>
</div>
<hr>
<div class="grid">
<div><label>勞拉</label><select id="laura"><option value="none">無</option><option value="yes" selected>有</option></select></div>
<div><label>勞拉星級</label><select id="star"><option>0</option><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
<div><label>勞拉今日狀態</label><select id="used"><option value="no" selected>未點擊</option><option value="yes">已點擊</option></select></div>
<div><label>勇士戰令</label><select id="task1"><option value="no">未啟用</option><option value="yes" selected>啟用</option></select></div>
<div><label>勇士戰令目前進度</label><input id="p1" type="number" value="0"></div>
<div><label>黎明曙光</label><select id="task2"><option value="no">未啟用</option><option value="yes" selected>啟用</option></select></div>
<div><label>黎明曙光目前進度</label><input id="p2" type="number" value="0"></div>
<div><label>基準時間</label><input id="base" type="datetime-local" value="2026-09-27T11:27"></div>
</div>
<button id="plan">開始規劃</button>
<div id="out" style="margin-top:14px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const H=3600000, DAY=86400000;

function tw(ms){
  const d=new Date(ms+8*H);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),min:d.getUTCMinutes()};
}
function twMs(y,m,d,h=0,min=0){return Date.UTC(y,m,d,h,min)-8*H}
function fmt(ms){
  const p=tw(ms);
  return `${p.y}/${String(p.m+1).padStart(2,"0")}/${String(p.d).padStart(2,"0")} ${String(p.h).padStart(2,"0")}:${String(p.min).padStart(2,"0")}`;
}
function wd(ms){const p=tw(ms);return new Date(Date.UTC(p.y,p.m,p.d)).getUTCDay()}
function dayStart(ms){const p=tw(ms);return twMs(p.y,p.m,p.d,10)}
function nextScore(ms){
  const p=tw(ms),w=wd(ms);
  if((w===1||w===5)&&p.h<10)return twMs(p.y,p.m,p.d,10);
  return twMs(p.y,p.m,p.d+({0:1,1:4,2:3,3:2,4:1,5:3,6:2}[w]),10);
}
function eventsBetween(start,end){
  const out=[],p=tw(start);
  for(let i=-1;i<=3;i++){
    const d=p.d+i;
    for(const h of [2,10,18]){
      const t=twMs(p.y,p.m,d,h);
      if(t>start&&t<=end)out.push(t);
    }
  }
  return [...new Set(out)].sort((a,b)=>a-b);
}
function lauraAmount(star){return [5,10,10,10,20,20][star]||0}
function stateText(s){return `（場上${s.field}，庫存${s.inventory}）`}

function completeOne(s){
  if(s.unfinished<=0)return false;
  s.unfinished--;s.completed++;
  if(s.task1.active)s.p1++;
  if(s.task2.active)s.p2++;
  return true;
}
function enterFromInventory(s){
  if(s.inventory<=0)return false;
  s.inventory--;s.field++;s.unfinished++;return true;
}
function completeAndHarvestOne(s){
  if(s.unfinished<=0&&!enterFromInventory(s))return false;
  if(!completeOne(s))return false;
  if(s.completed<=0)return false;
  s.completed--;s.field--;
  if(s.field<8&&s.inventory>0){
    const n=Math.min(8-s.field,s.inventory);
    s.field+=n;s.inventory-=n;s.unfinished+=n;
  }
  if(s.star===5&&s.treasure<10)s.treasure++;
  return true;
}
function completeOnlyAllCurrent(s){
  let n=0;
  const initial=s.unfinished;
  while(n<initial&&completeOne(s))n++;
  return n;
}
function completeHarvestN(s,n){
  let done=0;
  while(done<n&&completeAndHarvestOne(s))done++;
  return done;
}
function system8(s){
  const generated=8;
  const fill=Math.min(generated,Math.max(0,8-s.field));
  s.field+=fill;
  const remain=generated-fill;
  const room=Math.max(0,s.max-s.inventory);
  const stored=Math.min(remain,room);
  const lost=remain-stored;
  s.inventory+=stored;
  s.unfinished+=fill+stored+lost;
  // lost means the radar was generated but could not be stored; it must NOT enter field/inventory.
  s.unfinished-=lost;
  return {lost};
}
function applyLaura(s){
  if(!s.lauraExists||s.lauraUsed)return 0;
  const n=lauraAmount(s.star);
  const fill=Math.min(n,Math.max(0,8-s.field));
  s.field+=fill;
  s.inventory+=n-fill;
  s.unfinished+=n;
  s.lauraUsed=true;
  return n;
}
function safeHarvestBeforeSystem(s){
  // Number of completed/harvested radars needed so the next +8 can fit.
  const need=Math.max(0,s.inventory-(s.max-8));
  if(need<=0)return 0;
  return completeHarvestN(s,need);
}
function prepareLauraSafe(s,nextSystem){
  if(!s.lauraExists||s.lauraUsed)return 0;
  const amount=lauraAmount(s.star);
  const fill=Math.min(amount,Math.max(0,8-s.field));
  const addedInv=amount-fill;
  const allowed=Math.max(0,s.max-8);
  const need=Math.max(0,(s.inventory+addedInv)-allowed);
  return completeHarvestN(s,need);
}
function futureReset(s){
  s.p1=0;s.p2=0;s.treasure=0;s.lauraUsed=false;
}
function pushLine(lines,icon,time,text,s){lines.push(`${icon} ${time}：${text} ${stateText(s)}`)}

function plan(){
  const t0=performance.now();
  const base=Date.parse($("base").value);
  const s={
    max:+$("max").value,inventory:+$("inv").value,field:+$("field").value,
    completed:+$("completed").value,
    unfinished:Math.max(0,+$("field").value-+$("completed").value),
    lauraExists:$("laura").value==="yes",star:+$("star").value,
    lauraUsed:$("used").value==="yes",treasure:0,
    p1:$("task1").value==="yes"?Math.max(0,+$("p1").value):0,
    p2:$("task2").value==="yes"?Math.max(0,+$("p2").value):0,
    task1:{active:$("task1").value==="yes"},
    task2:{active:$("task2").value==="yes"}
  };
  if(!Number.isFinite(base)||s.max<=0||s.inventory<0||s.field<0||s.completed<0||s.completed>s.field){
    $("out").innerHTML='<div class="row bad">❌ 輸入資料無效</div>';return;
  }

  const score=nextScore(base);
  const events=eventsBetween(base,score);
  const lines=[];

  function add(icon,time,text){lines.push(`${icon} ${time}：${text} ${stateText(s)}`);}
  function harvestN(n){return completeHarvestN(s,n);}

  // 目標：勞拉一旦讓場上達到 11，就直到衝分日不再收割。
  // 因此先反推「勞拉之後還剩幾個 +8」，再找最早仍能安全點擊勞拉的時間。
  // 本案例：9/27 18:00、9/28 02:00、9/28 10:00；若 18:00 點勞拉，
  // 後面兩個 +8 會使容量不足，因此最早安全點擊時間是 02:00。
  const nonScore=events.filter(t=>t<score);
  const first18=nonScore.find(t=>tw(t).h===18);
  const first02=nonScore.find(t=>tw(t).h===2);

  // 先完成並收割目前場上雷達；收割時會用庫存補回場上 8。
  const initialTotal=s.field+s.inventory;
  const initialHarvest=Math.min(initialTotal, s.field+s.inventory);
  // 先把目前場上 8 完成，然後收割，之後可繼續收割庫存補進的雷達。
  let doneCurrent=0;
  while(s.unfinished>0) { if(!completeOne(s)) break; doneCurrent++; }
  let h0=harvestN(Math.min(22,s.inventory+s.completed));
  add("🟢","現在",`完成並收割 ${h0} 個雷達`);

  if(!s.lauraExists || s.lauraUsed){
    // no future Laura action
  }else if(first18 && first02){
    // 18:00: system +8 first.
    const r=system8(s);
    if(r.lost>0)add("🚨",fmt(first18),`系統 +8，有 ${r.lost} 個雷達因庫存上限消失`);
    else add("⚡",fmt(first18),"系統 +8");

    // Earliest safe Laura is 02:00 in this scenario.
    // Before Laura, reduce inventory so that Laura +17 inventory plus the 10:00 +8 fits MAX.
    // Required: inventory <= MAX - 25.
    const targetInv=Math.max(0,s.max-25);
    const need=Math.max(0,s.inventory-targetInv);
    if(need>0){
      const got=harvestN(need);
      add("⚠️",fmt(first18),`為了讓 ${fmt(first02)} 點擊勞拉後，衝分日前的 +8 不浪費，先完成並收割 ${got} 個雷達`);
    }

    // 02:00: Laura first, then no more harvest until score.
    const n=applyLaura(s);
    if(n)add("🧭",fmt(first02),`點擊勞拉 +${n}`);

    // 10:00 scoring day: system +8, then stop strategy sequence.
    const scoreEvent=events.find(t=>t===score);
    if(scoreEvent){
      const r2=system8(s);
      if(r2.lost>0)add("🚨",fmt(scoreEvent),`系統 +8，有 ${r2.lost} 個雷達因庫存上限消失`);
      else add("⚡",fmt(scoreEvent),"系統 +8");
      add("🏆",fmt(scoreEvent),"今天是衝分日，請完成並收割所有雷達");
    }
  }else{
    // Generic fallback: process non-score events, but never harvest after Laura.
    for(const t of events){
      const p=tw(t);
      if(p.h===10){
        system8(s);
        add("⚡",fmt(t),"系統 +8");
        add("🏆",fmt(t),"今天是衝分日，請完成並收割所有雷達");
        break;
      }
      system8(s); add("⚡",fmt(t),"系統 +8");
    }
  }

  const elapsed=performance.now()-t0;
  $("out").innerHTML=`
  <div class="row"><span class="good">✅ 規劃完成</span>　耗時 ${elapsed.toFixed(3)} ms</div>
  <div class="row"><b>🏆 目標：</b>${fmt(score)} 衝分</div>
  <div class="row"><b>🎯 理想狀態：</b>場上 11 ／ 庫存 ${s.max}</div>
  <div class="row"><b>📦 預計可達：</b>場上 ${s.field} ／ 庫存 ${s.inventory}</div>
  <div class="row"><b>📝 規劃摘要</b><pre>${lines.join("\n")}</pre></div>
  <div class="row"><b>🔎 核心：</b>勞拉點擊後直到衝分日不再安排收割；每個節點都標示場上／庫存；衝分日 10:00 後不再列出後續 +8 或勞拉提醒。</div>`;
}
$("plan").onclick=plan;
</script>
</body>
</html>
