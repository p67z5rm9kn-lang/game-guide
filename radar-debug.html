<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Z｜雷達週計劃 v7.0</title>
<style>
:root{--bg:#071426;--card:#0d2038;--deep:#08192c;--line:#27415f;--gold:#e0bd6b;--text:#edf3fb;--muted:#9fb1c7;--good:#78d99a;--warn:#f0c674;--bad:#ff7777}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061120,#0a192c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:16px 10px 36px}main{max-width:700px;margin:auto}
h1{font-size:22px;margin:0 0 6px;color:var(--gold)}.sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.panel{background:rgba(13,32,56,.96);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}h2{font-size:16px;margin:0 0 9px;color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}
input,select{width:100%;border:1px solid #365574;border-radius:10px;background:#102842;color:#fff;font-size:17px;padding:10px 11px;outline:none}select{appearance:none;-webkit-appearance:none}
button{width:100%;margin-top:9px;border:1px solid #a68748;border-radius:10px;background:#172c46;color:#f5d98e;font-weight:700;font-size:15px;padding:10px}
.box{background:var(--deep);border-radius:10px;padding:10px;margin-top:8px;font-size:12px;line-height:1.65}.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.day{border:1px solid #213b58;background:#0a1b30;border-radius:12px;padding:10px;margin-top:10px}.day h3{font-size:14px;margin:0 0 7px;color:var(--gold)}
.state{font-size:12px;color:#d8e3ef;margin-bottom:7px}.event{border-top:1px solid #203852;padding:8px 0;font-size:12px;line-height:1.55}.event:first-of-type{border-top:0}
.row{display:flex;gap:8px;justify-content:space-between}.badge{font-size:11px;padding:2px 6px;border-radius:7px;background:#132a43}.note{font-size:11px;color:var(--muted);line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<h1>Last Z｜雷達週計劃 v7.0</h1>
<div class="sub">固定沿用 radar-weekly-v4 的週計劃基準；本版把玩家操作與免費 +8 改成真正的時間軸事件測試。</div>

<div class="panel">
<h2>設定</h2>
<label>庫存上限 MAX</label>
<input id="max" type="number" min="8" step="1" value="30">

<label>時間顯示方式</label>
<select id="basis">
<option value="tw">台灣時間（UTC+8）</option>
<option value="game">遊戲時間（UTC-2）</option>
</select>

<label>每日可操作開始時間</label>
<input id="start" type="time" value="18:00">
<label>每日可操作結束時間</label>
<input id="end" type="time" value="22:00">

<button id="run">開始模擬</button>
<div class="box note">免費 +8 固定為「遊戲時間 00:00／08:00／16:00」。選擇時間制式後，畫面只顯示你選擇的時間。</div>
</div>

<div id="results" class="hidden"></div>
</main>

<script>
const dayNames=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const scoreDays=new Set([0,4]);
const preScoreDays=new Set([3,6]);

// radar-weekly-v4 固定基準
const v4Process=[null,20,38,41,null,20,35];
const v4Start=[[11,22],[0,0],[8,16],[8,22],[11,22],[0,0],[8,16]];
const v4End=['0 / 0','8 / 16','8 / 22','11 / 22','0 / 0','8 / 16','11 / 22'];

function minOf(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function fmtHM(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function twToGame(m){return (m+840)%1440}
function gameToTw(m){return (m+600)%1440}
function display(gameMin,basis){return basis==='tw'?fmtHM(gameToTw(gameMin)):fmtHM(gameMin)}
function inWindow(t,s,e){if(s===e)return true;if(s<e)return t>=s&&t<=e;return t>=s||t<=e}

function add8(f,i,max){
  let remain=8;
  const fieldRoom=Math.max(0,8-f);
  const toField=Math.min(remain,fieldRoom);f+=toField;remain-=toField;
  const invRoom=Math.max(0,max-i);
  const toInv=Math.min(remain,invRoom);i+=toInv;remain-=toInv;
  return {f,i,waste:remain};
}

function processAll(f,i){
  // 完成／收割全部當下已有雷達。
  // 每收一個，若場上低於 8，庫存立即補回場上。
  let done=0;
  while(f+i>0){
    if(f>0){f--;done++;}
    else{
      const move=Math.min(8,i);
      if(move===0)break;
      f+=move;i-=move;
      continue;
    }
    if(f<8&&i>0){
      const move=Math.min(8-f,i);
      f+=move;i-=move;
    }
  }
  return {f,i,done};
}

function processN(f,i,n){
  let done=0;
  while(done<n && f+i>0){
    if(f>0){f--;done++;}
    else{
      const move=Math.min(8,i);if(!move)break;
      f+=move;i-=move;continue;
    }
    if(f<8&&i>0){
      const move=Math.min(8-f,i);
      f+=move;i-=move;
    }
  }
  return {f,i,done};
}

function lauraAllowed(d,f){
  if(scoreDays.has(d))return false;
  if(preScoreDays.has(d))return f>=8;
  return f<8;
}
function useLaura(f,i){
  if(f<8){
    const toField=Math.min(20,8-f);
    return {f:f+toField,i:i+(20-toField)};
  }
  return {f:f+3,i:i+17};
}

function simulate(){
  const max=Math.max(8,Math.floor(Number(document.querySelector('#max').value)||30));
  const basis=document.querySelector('#basis').value;
  const inputS=minOf(document.querySelector('#start').value);
  const inputE=minOf(document.querySelector('#end').value);
  const s=basis==='tw'?twToGame(inputS):inputS;
  const e=basis==='tw'?twToGame(inputE):inputE;

  let out='',totalWaste=0,scoreFail=0;

  for(let d=0;d<7;d++){
    let f=v4Start[d][0],i=v4Start[d][1];
    const startState=[f,i],score=scoreDays.has(d),pre=preScoreDays.has(d);
    const target=v4Process[d];
    let events=[],processed=0,lauraUsed=false;

    /*
      一天內事件依「遊戲時間」排序：
      00:00、08:00、16:00。
      玩家可操作視窗也在同一條時間軸上。
      關鍵：每一次 +8 前後，只要玩家仍在可操作時間，
      就可以再次操作；不再限制「一天只能操作一次」。
    */
    const sys=[{m:0},{m:480},{m:960}];

    function playerOperate(label){
      // 衝分日：每次玩家可操作都把當下全部雷達收掉。
      if(score){
        const x=processAll(f,i);
        f=x.f;i=x.i;
        if(x.done>0)events.push({m:label,kind:'player',text:`完成／收割 ${x.done} 個`,state:`${f} / ${i}`,cls:'ok'});
        return;
      }

      // 勞拉只允許一次。
      if(!lauraUsed && lauraAllowed(d,f)){
        const x=useLaura(f,i);
        f=x.f;i=x.i;lauraUsed=true;
        events.push({m:label,kind:'player',text:'使用勞拉',state:`${f} / ${i}`,cls:'ok'});
      }

      // 準備日：同一可操作時段可合併完成當日剩餘處理量。
      if(target>processed){
        const need=target-processed;
        const x=processN(f,i,need);
        f=x.f;i=x.i;processed+=x.done;
        if(x.done>0)events.push({m:label,kind:'player',text:`處理 ${x.done} 個`,state:`${f} / ${i}`,cls:x.done===need?'ok':'warn'});
      }
    }

    // 依事件時間跑三次 +8；在每次事件前與事件後都檢查玩家是否可操作。
    for(const ev of sys){
      const can=inWindow(ev.m,s,e);
      if(can)playerOperate(display(ev.m,basis));

      const before=`${f} / ${i}`;
      const x=add8(f,i,max);
      f=x.f;i=x.i;totalWaste+=x.waste;
      events.push({
        m:display(ev.m,basis),kind:'system',text:'免費 +8',
        state:`${f} / ${i}`,
        cls:x.waste?'bad':'ok',
        extra:x.waste?`🔴 真正浪費 ${x.waste} 個`:'🟢 +8 全部取得'
      });

      if(can)playerOperate(display(ev.m,basis));
    }

    // 若操作窗口內沒有任何系統事件，也要允許在窗口內主動操作。
    if(score){
      // 找一個代表性的窗口時間點做最後一次收割。
      const probe=s;
      if(inWindow(probe,s,e))playerOperate(display(probe,basis));
    }else if(processed<target){
      // 在一天結束前，只要窗口存在，就再嘗試一次合併處理。
      playerOperate(display(s,basis));
    }

    const remain=f+i;

    if(score){
      if(remain>0)scoreFail++;
      out+=`<div class="day">
        <h3>${dayNames[d]} 🏆 衝分日</h3>
        <div class="state">開始：<b>${startState[0]} / ${startState[1]}</b>　｜　目標：<b>全部完成／收割</b></div>
        <div class="box ${remain===0?'ok':'warn'}">
          ${remain===0?'🟢 本日全部完成／收割':'🔴 尚有 '+remain+' 個雷達未能完成／收割'}<br>
          ${remain>0?'只有玩家不可操作期間產生或保留的雷達才會留到日末。':''}
        </div>
      </div>`;
    }else{
      const expected=v4End[d],actual=`${f} / ${i}`;
      out+=`<div class="day">
        <h3>${dayNames[d]}｜準備日</h3>
        <div class="state">開始：<b>${startState[0]} / ${startState[1]}</b>　｜　當日處理：<b>${target} 個</b>　｜　週計劃預期：<b>${expected}</b></div>
        ${events.map(x=>`
          <div class="event">
            <div class="row"><b>${x.m}｜${x.text}</b><span class="badge">${x.kind==='system'?'系統':'玩家'}</span></div>
            <div>狀態：<b>${x.state}</b></div>
            ${x.extra?`<div class="${x.cls}">${x.extra}</div>`:''}
          </div>`).join('')}
        <div class="box ${actual===expected?'ok':'warn'}">
          日末：<b>${actual}</b><br>
          ${actual===expected?'🟢 與週計劃預期一致':'🟡 與週計劃預期不同；不修改週計劃基準。'}
        </div>
      </div>`;
    }
  }

  document.querySelector('#results').classList.remove('hidden');
  document.querySelector('#results').innerHTML=`
  <div class="panel"><h2>模擬結果</h2>
    <div class="box">
      玩家可操作：<b>${document.querySelector('#start').value}～${document.querySelector('#end').value}</b><br>
      顯示時間：<b>${basis==='tw'?'台灣時間':'遊戲時間'}</b><br>
      免費 +8：<b>${basis==='tw'?'10:00／18:00／02:00':'00:00／08:00／16:00'}</b><br>
      真正因 MAX 滿了而浪費：<b class="${totalWaste?'bad':'ok'}">${totalWaste} 個</b><br>
      衝分日未全部完成／收割：<b class="${scoreFail?'bad':'ok'}">${scoreFail} 天</b>
    </div>
  </div>${out}
  <div class="panel"><h2>判讀方式</h2>
    <div class="box note">
      🟢 +8 成功取得／玩家已完成<br>
      🔴 只有容量滿、真的拿不到 +8 才算浪費。<br>
      玩家每次仍在可操作時間內，都可以再次操作；不再限制一天只能操作一次。<br>
      同一個操作時段可完成的處理量會合併，不拆成 1、15 等多筆。
    </div>
  </div>`;
}

document.querySelector('#run').addEventListener('click',simulate);
</script>
</body>
</html>
