<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規則引擎 v1.2｜策略搜尋測試版</title>
<style>
body{margin:0;background:#071321;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:18px;line-height:1.55}
.wrap{max-width:760px;margin:auto}.card{background:#11243a;border:1px solid #8f6d2a;border-radius:18px;padding:18px;margin-bottom:14px;box-sizing:border-box}.title{font-size:23px;font-weight:800}.sub{color:#d8c27e;margin:8px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#d8c27e;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box;background:#1b3048;color:#fff;border:1px solid #718097;border-radius:12px;padding:11px;font-size:17px}.btn{width:100%;border:0;border-radius:12px;background:#9a762f;color:#fff;font-size:18px;font-weight:800;padding:14px;margin-top:14px}.ok{color:#8ff0a0;font-weight:800}.bad{color:#ff9b9b;font-weight:800}.row{background:#192d45;border-radius:12px;padding:12px;margin-top:8px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:14px;color:#c5cfdb}.result{font-size:17px}.pass{border-left:4px solid #79dc8c}.fail{border-left:4px solid #ff8f8f}
</style></head>
<body><div class="wrap">
<div class="card"><div class="title">🧭 雷達規則引擎 v1.2｜策略搜尋測試版</div><div class="sub">v1.1 規則引擎 24/24 通過後，第一次把「規則」交給「策略搜尋」決定操作數量。</div>
<div class="grid">
<div class="field"><label>庫存上限 MAX</label><input id="max" type="number" value="30"></div>
<div class="field"><label>目前庫存</label><input id="inv" type="number" value="22"></div>
<div class="field"><label>場上雷達</label><input id="field" type="number" value="8"></div>
<div class="field"><label>已完成</label><input id="done" type="number" value="0"></div>
<div class="field"><label>勞拉</label><select id="laura"><option value="0">無</option><option value="5">0★ +5</option><option value="10">1–3★ +10</option><option value="20" selected>4–5★ +20</option></select></div>
<div class="field"><label>勞拉今日狀態</label><select id="used"><option value="0">未點擊</option><option value="1">已點擊</option></select></div>
</div><button class="btn" onclick="run()">▶ 執行策略搜尋</button></div>
<div id="out"></div></div>
<script>
const clone=s=>JSON.parse(JSON.stringify(s));
function valid(s){return Number.isFinite(s.max)&&s.max>0&&s.inv>=0&&s.field>=0&&s.done>=0&&s.done<=s.field}
function refill(s){const n=Math.min(Math.max(0,8-s.field),s.inv);s.field+=n;s.inv-=n;return n}
function complete(s,n=1){n=Math.min(n,s.field-s.done);s.done+=n;return n}
function harvestOne(s){if(s.done<=0)return false;s.done--;s.field--;refill(s);return true}
function harvest(s,n=1){let k=0;while(k<n&&harvestOne(s))k++;return k}
function system8(s){let created=8;const toField=Math.min(Math.max(0,8-s.field),created);s.field+=toField;created-=toField;const room=Math.max(0,s.max-s.inv);const toInv=Math.min(room,created);s.inv+=toInv;return {added:toField+toInv,wasted:created-toInv}}
function laura(s,amount){if(!amount||s.lauraUsed)return {ok:false,wasted:0};let n=amount;const toField=s.field<8?Math.min(8-s.field,n):Math.min(3,n);s.field+=toField;n-=toField;s.inv+=n;s.lauraUsed=true;return {ok:true,toField,wasted:0}}
function snapshot(s){return `（場上${s.field}，庫存${s.inv}）`}
function allComplete(s){complete(s,s.field-s.done)}
function harvestAll(s){return harvest(s,s.done)}
function scoreStock(s){return s.field+s.inv}
function scoreForCandidate(base,harvestNow,lauraTime){
  let s=clone(base), steps=[], lost=0;
  allComplete(s); const h0=harvest(s,harvestNow); steps.push({t:'現在',a:`完成並收割 ${h0} 個雷達`,s:snapshot(s)});
  const e18=system8(s); lost+=e18.wasted; steps.push({t:'2026/09/27 18:00',a:`系統 +8`,s:snapshot(s),w:e18.wasted});
  if(lauraTime==='18'){const L=laura(s,base.lauraAmount);steps.push({t:'2026/09/27 18:00',a:`點擊勞拉 +${base.lauraAmount}`,s:snapshot(s)});}
  const e02=system8(s);lost+=e02.wasted;steps.push({t:'2026/09/28 02:00',a:`系統 +8`,s:snapshot(s),w:e02.wasted});
  if(lauraTime==='02'){const L=laura(s,base.lauraAmount);steps.push({t:'2026/09/28 02:00',a:`點擊勞拉 +${base.lauraAmount}`,s:snapshot(s)});}
  const e10=system8(s);lost+=e10.wasted;steps.push({t:'2026/09/28 10:00',a:`系統 +8`,s:snapshot(s),w:e10.wasted});
  allComplete(s); const harvestable=scoreStock(s); steps.push({t:'2026/09/28 10:00',a:'衝分日：完成並收割所有雷達',s:snapshot(s)});
  return {harvestNow,lauraTime,lost,harvestable,steps};
}
function better(a,b){if(!b)return true;if(a.harvestable!==b.harvestable)return a.harvestable>b.harvestable;if(a.lost!==b.lost)return a.lost<b.lost;if(a.harvestNow!==b.harvestNow)return a.harvestNow>b.harvestNow;const rank={18:0,02:1};return rank[a.lauraTime]<rank[b.lauraTime]}
function run(){const base={max:+max.value,inv:+inv.value,field:+field.value,done:+done.value,lauraAmount:+laura.value,lauraUsed:+used.value};const out=document.getElementById('out');if(!valid(base)){out.innerHTML='<div class="card bad">❌ 輸入資料無效</div>';return}
let best=null, tested=0;for(let n=0;n<=base.field+base.inv;n++){for(const lt of ['18','02']){if(base.lauraUsed&&base.lauraAmount)continue;const r=scoreForCandidate(base,n,lt);tested++;if(better(r,best))best=r;}}
if(base.lauraAmount===0||base.lauraUsed){best=null;for(let n=0;n<=base.field+base.inv;n++){const r=scoreForCandidate({...base,lauraAmount:0},n,'18');tested++;if(better(r,best))best=r;}}
let html='<div class="card"><div class="title ok">✅ 策略搜尋完成</div><div class="small">已搜尋 '+tested+' 組候選策略，不靠寫死「25 個」。</div></div>';
html+='<div class="card"><div class="title">🎯 搜尋結果</div><div class="row">現在：<b>完成並收割 '+best.harvestNow+' 個雷達</b> '+best.steps[0].s+'</div>';
for(let i=1;i<best.steps.length;i++){const x=best.steps[i];html+='<div class="row">'+x.t+'：'+x.a+' '+x.s+(x.w?'<br><span class="bad">⚠️ 本事件浪費 '+x.w+' 個</span>':'')+'</div>';}
html+='<div class="row">🏆 衝分日可收割總量：<b>'+best.harvestable+' 個</b><br>⚠️ 預估浪費：<b>'+best.lost+' 個</b></div></div>';
html+='<div class="card"><div class="title">🧪 核心驗證</div><div class="row pass">✓ 收割會觸發庫存自動補場</div><div class="row pass">✓ 勞拉場上 ≥8 時 +3 進場上</div><div class="row pass">✓ +8 超過 MAX 時只損失超出部分</div><div class="row pass">✓ 策略不是固定寫死 25，而是搜尋候選數量</div></div>';
out.innerHTML=html}
</script></body></html>
