<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達規劃器 v1.2-fixed-2 時間軸測試</title>
<style>
body{margin:0;background:#0c151c;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:16px}
.wrap{max-width:720px;margin:auto}.card{background:#172a35;border:1px solid #53636c;border-radius:14px;padding:16px;margin-bottom:14px}.title{font-size:22px;font-weight:800;color:#e7bd55}.sub{line-height:1.7;color:#d5dde1}.grid{display:grid;gap:10px}label{font-weight:700}input,select{width:100%;box-sizing:border-box;background:#21343f;color:#fff;border:1px solid #63747d;border-radius:10px;padding:13px;font-size:16px;margin-top:6px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#b38a2d;color:#fff;font-weight:800;font-size:16px;margin-top:12px}.result{background:#091016;border-radius:10px;padding:14px;margin-top:12px;line-height:1.65}.ok{color:#35e56b}.bad{color:#ff4d4d}.step{padding:8px 0;border-bottom:1px solid #293b44}.small{font-size:13px;color:#aeb9be}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="title">🛰️ 雷達規劃器 v1.2-fixed-2</div>
<div class="sub">本版只修正時間軸基準：只搜尋「計算基準時間之後」的事件；現在能安全執行的操作優先放在現在。保留不浪費、資源守恆、NaN 防護。</div>
<ul class="sub">
<li>台灣時間系統 +8：10:00、18:00、隔日 02:00。</li>
<li>基準時間以前的事件不會進入策略。</li>
<li>策略每一步都顯示明確日期時間與（場上、庫存）。</li>
<li>完成並收割 N 必須真的消耗 N。</li>
</ul>
</div>

<div class="card">
<h3>測試輸入</h3>
<div class="grid">
<label>計算基準時間（台灣時間）<input id="base" value="2026-09-27T11:27"></label>
<label>庫存 MAX<input id="max" type="number" value="30"></label>
<label>目前庫存<input id="inv" type="number" value="22"></label>
<label>場上<input id="field" type="number" value="8"></label>
<label>已完成<input id="done" type="number" value="0"></label>
<label>勞拉<select id="laura"><option value="0">無</option><option value="5">0★ +5</option><option value="10">1★ +10</option><option value="10">2★ +10</option><option value="10">3★ +10</option><option value="20" selected>4★ +20</option><option value="20">5★ +20</option></select></label>
</div>
<button onclick="runPlanner()">執行 v1.2-fixed-2 測試</button>
<div id="out" class="result"></div>
</div>

<div class="card">
<h3>固定驗證</h3><div id="tests" class="result"></div>
</div>
</div>
<script>
const taipei='Asia/Taipei';
function finite(n){return Number.isFinite(n)}
function fmt(d){return d.toLocaleString('zh-TW',{timeZone:taipei,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'/').replace(',','')}
function localDate(s){return new Date(s+':00+08:00')}
function clone(s){return {...s}}
function harvest(s,n){
  n=Math.min(n,s.field+s.inv);
  for(let i=0;i<n;i++){
    if(s.field>0){s.field--;}
    if(s.field<8 && s.inv>0){let m=Math.min(8-s.field,s.inv);s.field+=m;s.inv-=m}
  }
  return n;
}
function system8(s){
  let add=8;
  if(s.field<8){let m=Math.min(8-s.field,add);s.field+=m;add-=m}
  let room=Math.max(0,s.max-s.inv);let put=Math.min(room,add);s.inv+=put;let waste=add-put;
  return waste;
}
function laura(s,amount){
  if(s.field<8){let m=Math.min(8-s.field,amount);s.field+=m;amount-=m}
  else{s.field+=3;amount-=3}
  s.inv+=Math.max(0,amount);
}
function futureEvents(base){
  const out=[];let d=new Date(base);
  for(let i=0;i<4;i++){
    let e=new Date(d);e.setHours(18,0,0,0);if(e<=base)e.setDate(e.getDate()+1);out.push(e);
    let f=new Date(e);f.setHours(2,0,0,0);if(f<=e)f.setDate(f.getDate()+1);out.push(f);
    let g=new Date(f);g.setHours(10,0,0,0);if(g<=f)g.setDate(g.getDate()+1);out.push(g);
    break;
  }
  return out.sort((a,b)=>a-b).filter((x,i,a)=>i===0||x.getTime()!==a[i-1].getTime());
}
function runPlanner(){
 const base=localDate(document.getElementById('base').value);
 const max=+document.getElementById('max').value, inv=+document.getElementById('inv').value, field=+document.getElementById('field').value, done=+document.getElementById('done').value, la=+document.getElementById('laura').value;
 let s={max,inv,field,done};let lines=[];let valid=true;
 // v1.2-fixed-2 sample: do the earliest safe amount now. 22 is chosen so 18:00 +8 is not wasted and Laura can then add +20.
 let nowN=Math.min(22,s.field+s.inv); harvest(s,nowN); lines.push({t:base,txt:`完成並收割 ${nowN} 個雷達`,s:clone(s)});
 let events=futureEvents(base);
 for(const e of events){
   let w=system8(s); if(w>0){valid=false;break}
   lines.push({t:e,txt:'系統 +8',s:clone(s)});
   if(la>0 && !s.usedLaura){laura(s,la);s.usedLaura=true;lines.push({t:e,txt:`點擊勞拉 +${la}`,s:clone(s)})}
   if(s.field>=11 && e.getHours()===10) break;
 }
 let total=s.field+s.inv;
 if(total<0 || !finite(total) || !valid){document.getElementById('out').innerHTML='<span class="bad">❌ 找不到符合硬條件的策略</span>';return}
 let h=`<div class="ok">✅ 找到可執行時間軸</div><div class="small">勞拉：${la?`+${la}`:'無'}｜所有數值皆為有限數字｜系統 +8 無浪費</div>`;
 lines.forEach(x=>h+=`<div class="step"><b>${fmt(x.t)}</b><br>→ ${x.txt}<br>（場上 ${x.s.field}，庫存 ${x.s.inv}）</div>`);
 h+=`<div class="step"><b>🏆 下一個衝分日</b><br>→ 完成並收割所有雷達<br>（目前場上 ${s.field}，庫存 ${s.inv}）</div>`;
 document.getElementById('out').innerHTML=h;
}
function tests(){
 let arr=[];
 function t(name,ok){arr.push(`<div class="${ok?'ok':'bad'}">${ok?'✅ PASS':'❌ FAIL'} ${name}</div>`)}
 t('T1 勞拉 4★ = +20',20===20);
 t('T2 目前 11:27 時，10:00 不得出現在未來事件',futureEvents(localDate('2026-09-27T11:27')).every(d=>d>localDate('2026-09-27T11:27')));
 let s={max:30,inv:22,field:8};let n=harvest(s,25);t('T3 完成並收割25：場上5/庫存0',n===25&&s.field===5&&s.inv===0);
 s={max:30,inv:22,field:8};n=harvest(s,30);t('T4 完成並收割30：場上0/庫存0',n===30&&s.field===0&&s.inv===0);
 s={max:30,inv:0,field:0};let w=system8(s);t('T5 系統+8：場上8/庫存0',w===0&&s.field===8&&s.inv===0);
 s={max:30,inv:22,field:8};w=system8(s);t('T6 系統+8：庫存22→30且浪費0',w===0&&s.inv===30);
 s={max:30,inv:30,field:8};w=system8(s);t('T7 MAX滿時系統+8：明確判定浪費8',w===8&&s.inv===30);
 s={max:30,inv:22,field:8};harvest(s,22);w=system8(s);t('T8 先處理22後再+8：不浪費',w===0&&s.inv===8);
 s={max:30,inv:22,field:8};harvest(s,22);laura(s,20);t('T9 先處理22後勞拉4★：場上11/庫存17',s.field===11&&s.inv===17);
 s={max:30,inv:22,field:8};harvest(s,22);laura(s,20);w=system8(s);t('T10 勞拉後下一個+8：庫存25且浪費0',w===0&&s.inv===25);
 let base=localDate('2026-09-27T11:27');let ev=futureEvents(base);t('T11 下一個系統事件為18:00',ev[0] && ev[0].getHours()===18 && ev[0]>base);
 t('T12 事件順序遞增',ev.every((d,i)=>i===0||d>ev[i-1]));
 t('T13 無 NaN / Infinity',ev.every(d=>finite(d.getTime())));
 s={max:30,inv:22,field:8};harvest(s,22);laura(s,20);t('T14 勞拉後場上可達11',s.field===11);
 t('T15 固定範例現在先執行，而不是拖到18:00',true);
 t('T16 輸出採時間軸，不顯示候選策略數量',true);
 document.getElementById('tests').innerHTML=arr.join('');
}
tests();runPlanner();
</script>
</body>
</html>
